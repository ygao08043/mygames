<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Nikko Standards black metronome</title>
  <desc id="desc">A clean vector illustration of a black pyramid-shaped mechanical metronome with gold markings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f8f7"/>
      <stop offset="1" stop-color="#e7e8e7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111214"/>
      <stop offset=".42" stop-color="#292b2e"/>
      <stop offset=".72" stop-color="#08090a"/>
      <stop offset="1" stop-color="#303236"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242629"/>
      <stop offset="1" stop-color="#090a0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e7736"/>
      <stop offset=".45" stop-color="#f1d58a"/>
      <stop offset="1" stop-color="#b58a3c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="22" fill="url(#bg)"/>
