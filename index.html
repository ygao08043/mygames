}[gameSort];return list.sort(cmp||((a,b)=>b.playSeconds-a.playSeconds))}
function selectorImage(v){if(mode==='source')return (sourceCards[v]||sourceCards.Other).image;return categoryImages[v]||categoryImages.Other}
function renderSelectors(){const host=document.querySelector('#selectorStrip');host.innerHTML='';for(const v of currentValues()){const list=selectionList(v),sum=list.reduce((a,b)=>a+b.playSeconds,0);const b=document.createElement('button');b.className='selector-card'+(selected===v?' active':'');const img=selectorImage(v);if(mode==='source'&&v==='Steam'){b.classList.add('steam-brand');b.style.background='radial-gradient(circle at 78% 18%,rgba(102,192,244,.34),transparent 24%),linear-gradient(135deg,#171a21 0%,#1b2838 48%,#2a475e 100%)';b.style.setProperty('--bgimg','none')}else{b.style.setProperty('--bgimg',img?`url("${img}")`:'none')}b.innerHTML=`<div class="sel-content"><b>${label(v)}</b><small>${v==='DEVICE'?`${devices.length} 台设备`:`${list.length} 款 · ${hours(sum)} h`}</small></div>`;b.onclick=()=>{selected=v;renderAll()};host.appendChild(b)}}
function activityOf(name){return ACTIVITY[name]||{value:'—',kind:'na',label:'暂无数据',detail:'暂无可靠公开在线数据',sort:0}}
function gameCard(g,max){const [c1,c2]=palette(g.name),cat=categoryLabels[g.category]||g.category,a=activityOf(g.name);const el=document.createElement('article');el.className='media-card';el.title=(g.note?g.note+'\n':'')+'在线/活跃：'+a.value+' · '+a.label+'\n'+a.detail;el.style.setProperty('--c1',c1);el.style.setProperty('--c2',c2);const img=imageOf(g);el.innerHTML=`<div class="art"><div class="art-fallback">${g.name}</div><img src="${img}" alt="" loading="lazy" onerror="this.style.display='none'"></div><div class="card-body"><div class="name">${g.name}</div><div class="sub">${cat} · ${g.platform}</div><div class="online-row ${a.kind}"><span class="online-dot"></span><span class="online-value">${a.value}</span><span class="online-label">${a.label}</span></div><div class="bottomline"><div class="hours">${hours(g.playSeconds)} h</div><div class="src">${g.source}</div></div><div class="progress"><i style="width:${Math.max(1.5,g.playSeconds/max*100)}%"></i></div></div>`;return el}
function renderDevices(){const host=document.querySelector('#gameLibrary');host.innerHTML='';devices.forEach(d=>{const el=document.createElement('article');el.className='media-card device-card';el.style.setProperty('--dc1',d.c1);el.style.setProperty('--dc2',d.c2);const visual=d.image?`<img src="${d.image}" alt="" loading="lazy">`:`<div class="device-visual">${d.badge}</div>`;el.innerHTML=`<div class="art">${visual}<span class="device-badge">${d.badge}</span></div><div class="card-body"><div class="name">${d.name}</div><div class="sub">${d.detail}</div><div class="device-spec">${d.spec}</div><div class="bottomline"><div class="hours">${d.platform}</div><div class="src">游戏设备</div></div></div>`;host.appendChild(el)})}
function updateSortButtons(disabled=false){const h=document.querySelector('#sortHours'),t=document.querySelector('#sortHeat');h.disabled=t.disabled=disabled;if(disabled){h.classList.remove('active');t.classList.remove('active');return}const [kind,dir]=gameSort.split('-');h.classList.toggle('active',kind==='hours');t.classList.toggle('active',kind==='heat');h.textContent='时长 '+(kind==='hours'?(dir==='desc'?'↓':'↑'):'↓');t.textContent='热度 '+(kind==='heat'?(dir==='desc'?'↓':'↑'):'↓')}
function renderGames(){const host=document.querySelector('#gameLibrary');if(selected==='DEVICE'){document.querySelector('#libraryTitle').textContent='游戏设备';document.querySelector('#libraryMeta').textContent=`${devices.length} 台`;updateSortButtons(true);renderDevices();return}updateSortButtons(false);const list=selectionList(selected);document.querySelector('#libraryTitle').textContent=selected==='ALL'?'全部游戏':label(selected);const sortNames={'hours-desc':'时长从高到低','hours-asc':'时长从低到高','heat-desc':'热度从高到低','heat-asc':'热度从低到高'};document.querySelector('#libraryMeta').textContent=`${list.length} 款 · ${sortNames[gameSort]}`;host.innerHTML='';if(!list.length){host.innerHTML='<div class="empty">暂无内容</div>';return}const max=Math.max(...GAMES.map(g=>g.playSeconds));list.forEach(g=>host.appendChild(gameCard(g,max)))}
function renderAll(){renderSelectors();renderGames()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;selected='ALL';renderAll()});
document.querySelector('#sortHours').onclick=()=>{if(gameSort==='hours-desc')gameSort='hours-asc';else gameSort='hours-desc';renderGames()};
document.querySelector('#sortHeat').onclick=()=>{if(gameSort==='heat-desc')gameSort='heat-asc';else gameSort='heat-desc';renderGames()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelector('#'+b.dataset.page).classList.add('active')});
function renderVideoTabs(){const h=document.querySelector('#videoTabs');h.innerHTML='';Object.keys(VIDEOS).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=k===videoType?'active':'';b.onclick=()=>{videoType=k;renderVideoTabs();renderVideos()};h.appendChild(b)})}
function renderVideos(){const host=document.querySelector('#videoLibrary');host.innerHTML='';for(const [country,raw] of Object.entries(VIDEOS[videoType])){const items=videoNewFirst?[...raw]:[...raw].reverse();const sec=document.createElement('section');sec.innerHTML=`<div class="country-head"><h3>${country}</h3><span>${items.length} 部</span></div>`;const lib=document.createElement('div');lib.className='library';items.forEach((name,idx)=>{const [c1,c2]=palette(name);const el=document.createElement('article');el.className='media-card video-card';el.style.setProperty('--c1',c1);el.style.setProperty('--c2',c2);el.innerHTML=`<div class="art"><div class="art-fallback">${name}</div><img src="${videoThumb(name)}" alt="" loading="lazy" onerror="this.style.display='none'"></div><div class="card-body"><div class="name">${name}</div><div class="sub">${videoType} · ${country}</div><div class="bottomline"><div class="hours">${videoNewFirst?'按发布时间由新到旧':'按发布时间由旧到新'}</div><div class="src">${String(idx+1).padStart(2,'0')}</div></div></div>`;lib.appendChild(el)});sec.appendChild(lib);host.appendChild(sec)}}
document.querySelector('#videoSort').onclick=()=>{videoNewFirst=!videoNewFirst;document.querySelector('#videoSort').textContent=videoNewFirst?'发布时间：新 → 旧':'发布时间：旧 → 新';renderVideos()};
const root=document.documentElement,menu=document.querySelector('#themeMenu');function setTheme(v){root.dataset.theme=v;localStorage.setItem('ymkf-theme',v);document.querySelectorAll('[data-theme-value]').forEach(b=>b.classList.toggle('active',b.dataset.themeValue===v))}setTheme(localStorage.getItem('ymkf-theme')||'system');document.querySelector('#themeBtn').onclick=()=>menu.classList.toggle('open');document.querySelectorAll('[data-theme-value]').forEach(b=>b.onclick=()=>{setTheme(b.dataset.themeValue);menu.classList.remove('open')});document.addEventListener('click',e=>{if(!e.target.closest('#themeBtn')&&!e.target.closest('#themeMenu'))menu.classList.remove('open')});

// Desktop horizontal navigation for large selector cards: wheel + click-safe drag.
const strip=document.querySelector('#selectorStrip');
strip.addEventListener('wheel',e=>{if(window.innerWidth>680&&Math.abs(e.deltaY)>=Math.abs(e.deltaX)){e.preventDefault();strip.scrollLeft+=e.deltaY;}},{passive:false});
let drag=false,startX=0,startLeft=0,moved=false,pointerId=null,suppressClick=false;
strip.addEventListener('pointerdown',e=>{if(window.innerWidth<=680||e.button!==0)return;drag=true;moved=false;pointerId=e.pointerId;startX=e.clientX;startLeft=strip.scrollLeft});
strip.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-startX;if(!moved&&Math.abs(dx)>8){moved=true;strip.classList.add('dragging');try{strip.setPointerCapture(pointerId)}catch(_){}}if(moved){strip.scrollLeft=startLeft-dx;e.preventDefault()}});
function endDrag(){if(!drag)return;drag=false;strip.classList.remove('dragging');if(moved){suppressClick=true;setTimeout(()=>suppressClick=false,120)}moved=false;pointerId=null}
strip.addEventListener('pointerup',endDrag);strip.addEventListener('pointercancel',endDrag);strip.addEventListener('lostpointercapture',endDrag);
strip.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopPropagation()}},true);

renderAll();renderVideoTabs();renderVideos();
</script>
</body></html>
