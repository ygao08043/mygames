input,select,button {

}
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));

let filtered = [...games];

function initFilters() {
    const sourceSet = new Set();
    const categorySet = new Set();

    games.forEach(g => {
        sourceSet.add(g.source);
        categorySet.add(g.category);
    });

    const sourceSelect = document.getElementById('sourceFilter');
    sourceSet.forEach(s => {
        sourceSelect.innerHTML += `<option value="${s}">${s}</option>`;
    });

    const categorySelect = document.getElementById('categoryFilter');
    categorySet.forEach(c => {
        categorySelect.innerHTML += `<option value="${c}">${c}</option>`;
    });
}

function render(list) {
    const container = document.getElementById('gameList');
    container.innerHTML = '';

    list.forEach(g => {
        const div = document.createElement('div');
        div.className = 'card';

        div.innerHTML = `
            <h3>${g.name}</h3>
            <div class="meta">⏱ ${g.playtime.toFixed(1)} 小时</div>
            <div class="meta">${g.source} / ${g.platform}</div>
            <div>${g.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        `;

        container.appendChild(div);
    });
}

function sortByTime() {
    filtered.sort((a,b)=>b.playtime-a.playtime);
    render(filtered);
}

function applyFilters() {
    const keyword = document.getElementById('search').value.toLowerCase();
    const source = document.getElementById('sourceFilter').value;
    const category = document.getElementById('categoryFilter').value;

    filtered = games.filter(g => {
        return (
            g.name.toLowerCase().includes(keyword) &&
            (!source || g.source === source) &&
            (!category || g.category === category)
        );
    });

    render(filtered);
}

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('sourceFilter').addEventListener('change', applyFilters);
document.getElementById('categoryFilter').addEventListener('change', applyFilters);

initFilters();
sortByTime();
</script>
