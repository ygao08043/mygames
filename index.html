<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的游戏数据站</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, #111827 0%, #0f172a 100%);
      color: white;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 28px;
    }

    .title {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      background: rgba(255,255,255,0.05);
      padding: 16px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 12px;
      z-index: 10;
    }

    select {
      background: #1e293b;
      color: white;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 18px;
      backdrop-filter: blur(10px);
    }

    .stat-label {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .games {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .game-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
      backdrop-filter: blur(14px);
    }

    .game-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.2);
    }

    .banner {
      height: 12px;
      background: linear-gradient(90deg, #38bdf8, #8b5cf6, #ec4899);
    }

    .game-content {
      padding: 20px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .game-name {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
    }

    .time {
      text-align: right;
      min-width: 120px;
    }

    .time-main {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .time-sub {
      color: #94a3b8;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .remark-box {
      margin-top: 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 16px;
      overflow: hidden;
    }

    .remark-toggle {
      width: 100%;
      background: transparent;
      color: white;
      border: none;
      text-align: left;
      padding: 14px 16px;
      cursor: pointer;
      font-size: 0.92rem;
    }

    .remark-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
      color: #cbd5e1;
      font-size: 0.92rem;
      line-height: 1.7;
      white-space: pre-wrap;
      padding: 0 16px;
    }

    .remark-content.open {
      max-height: 1200px;
      padding-bottom: 16px;
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .top-row {
        flex-direction: column;
      }

      .time {
        text-align: left;
      }

      .title {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">🎮 我的游戏数据站</div>
      <div class="subtitle">支持分类筛选、时长排序与备注展开查看</div>
    </div>

    <div class="controls">
      <select id="categoryFilter">
        <option value="all">全部分类</option>
      </select>

      <select id="platformFilter">
        <option value="all">全部平台</option>
      </select>

      <select id="sortSelect">
        <option value="desc">时长从高到低</option>
        <option value="asc">时长从低到高</option>
      </select>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">游戏总数</div>
        <div class="stat-value" id="gameCount">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">总游玩时长</div>
        <div class="stat-value" id="totalTime">0h</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">当前显示</div>
        <div class="stat-value" id="visibleCount">0</div>
      </div>
    </div>

    <div class="games" id="gamesContainer"></div>
  </div>

  <script>
    const games = [
      {
        "名称": "4399小游戏",
        "分类": "Other",
        "备注": "时长来源于游戏内部PC数和粗略计算总和：\n奥奇传说\n摩尔庄园\n美食大战老鼠\n生死狙击等",
        "平台": "PC (Windows)",
        "游玩时间": 1080000,
        "来源": "Other"
      },
      {
        "名称": "Aimlabs",
        "分类": "fps",
        "备注": "",
        "平台": "PC (Windows)",
        "游玩时间": 6780,
        "来源": "Steam"
      },
      {
        "名称": "Among Us",
        "分类": "Other",
        "备注": "",
        "平台": "PC (Windows)",
        "游玩时间": 1440,
        "来源": "Steam"
      },
      {
        "名称": "Arcaea",
        "分类": "Music game",
        "备注": "时长计算公式：时长随iOS统计每周日更新，无PC数据\nB30：12.0814\nPOTENTIAL：12.10",
        "平台": "Mobile（iOS）",
        "游玩时间": 1185060,
        "来源": "Other"
      },
      {
        "名称": "Battlefield 1",
        "分类": "fps",
        "备注": "",
        "平台": "PC (Windows)",
        "游玩时间": 255000,
        "来源": "Steam"
      },
      {
        "名称": "CS2",
        "分类": "fps",
        "备注": "官匹10000分 / 完美世界C+",
        "平台": "PC (Windows)",
        "游玩时间": 636120,
        "来源": "Steam"
      },
      {
        "名称": "Phigros",
        "分类": "Music game",
        "备注": "RKS：14.95",
        "平台": "Mobile（iOS）",
        "游玩时间": 429600,
        "来源": "Other"
      }
    ];

    function formatTime(seconds) {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);

      if (hours === 0) {
        return `${minutes}分钟`;
      }

      return `${hours}小时 ${minutes}分钟`;
    }

    function populateFilters() {
      const categories = [...new Set(games.map(g => g.分类))];
      const platforms = [...new Set(games.map(g => g.平台))];

      const categorySelect = document.getElementById('categoryFilter');
      const platformSelect = document.getElementById('platformFilter');

      categories.forEach(category => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        categorySelect.appendChild(option);
      });

      platforms.forEach(platform => {
        const option = document.createElement('option');
        option.value = platform;
        option.textContent = platform;
        platformSelect.appendChild(option);
      });
    }

    function updateStats(filteredGames) {
      document.getElementById('gameCount').textContent = games.length;
      document.getElementById('visibleCount').textContent = filteredGames.length;

      const totalSeconds = games.reduce((sum, game) => sum + game.游玩时间, 0);
      document.getElementById('totalTime').textContent = formatTime(totalSeconds);
    }

    function renderGames() {
      const category = document.getElementById('categoryFilter').value;
      const platform = document.getElementById('platformFilter').value;
      const sort = document.getElementById('sortSelect').value;

      let filtered = [...games];

      if (category !== 'all') {
        filtered = filtered.filter(g => g.分类 === category);
      }

      if (platform !== 'all') {
        filtered = filtered.filter(g => g.平台 === platform);
      }

      filtered.sort((a, b) => {
        return sort === 'desc'
          ? b.游玩时间 - a.游玩时间
          : a.游玩时间 - b.游玩时间;
      });

      updateStats(filtered);

      const container = document.getElementById('gamesContainer');
      container.innerHTML = '';

      filtered.forEach((game, index) => {
        const card = document.createElement('div');
        card.className = 'game-card';

        card.innerHTML = `
          <div class="banner"></div>
          <div class="game-content">
            <div class="top-row">
              <div>
                <div class="game-name">${game.名称}</div>
                <div class="tags">
                  <div class="tag">${game.分类}</div>
                  <div class="tag">${game.平台}</div>
                  <div class="tag">${game.来源}</div>
                </div>
              </div>

              <div class="time">
                <div class="time-main">${formatTime(game.游玩时间)}</div>
                <div class="time-sub">${game.游玩时间.toLocaleString()} 秒</div>
              </div>
            </div>

            ${game.备注 ? `
              <div class="remark-box">
                <button class="remark-toggle" onclick="toggleRemark(${index})">
                  查看备注 ▼
                </button>
                <div class="remark-content" id="remark-${index}">
                  ${game.备注}
                </div>
              </div>
            ` : ''}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function toggleRemark(index) {
      const element = document.getElementById(`remark-${index}`);
      element.classList.toggle('open');
    }

    document.getElementById('categoryFilter').addEventListener('change', renderGames);
    document.getElementById('platformFilter').addEventListener('change', renderGames);
    document.getElementById('sortSelect').addEventListener('change', renderGames);

    populateFilters();
    renderGames();
  </script>
</body>
</html>
