  {
    "BackgroundImage": "1e5cd5db-fc97-4c63-a214-026cb50709db\\7b5d63b6-6584-4c63-9f68-5274dc05c826.jpg",
    "Description": "<p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/578080/extras/a540542c9e4e836390bfb24a25c205bf.poster.avif?t=1764817633\"></span></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/578080/extras/94748cbaeec0ad3090ce509567b709e9.poster.avif?t=1764817633\"></span></p><p class=\"bb_paragraph\"><strong>降落，</strong>&nbsp;</p><p class=\"bb_paragraph\">&nbsp;</p><p class=\"bb_paragraph\">纵身跃入不断扩展和变化的地图，迎接全新挑战。你会冒着物资匮乏的风险选择较为安全的边缘地带，还是直接空降人潮密集的城区，一落地就展开激战？每一次降落都是全新的挑战，如何利用手头资源生存，全凭你的战术与战略。&nbsp;</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/578080/extras/4bb643362d2925a1950009742966fba0.poster.avif?t=1764817633\"></span></p><p class=\"bb_paragraph\"><strong>搜集，</strong>&nbsp;</p><p class=\"bb_paragraph\">&nbsp;</p><p class=\"bb_paragraph\">独特武器、丰富物资与特殊道具助你智胜对手，如何武装自己，由你决定！为你钟爱的武器搭配强力配件，或为了稀有战利品冒险争夺众人觊觎的补给箱，扩大自己在战场上的优势。&nbsp;</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/578080/extras/960d991a398e5ab7472f6e7677693968.poster.avif?t=1764817633\"></span></p><p class=\"bb_paragraph\"><strong>求生</strong>&nbsp;</p><p class=\"bb_paragraph\">&nbsp;</p><p class=\"bb_paragraph\">搜集物资只是生存的第一步。随着安全区不断缩小，遭遇其他生存者的几率也大幅上升。一旦阵亡，就彻底出局。只有比对手更聪明、更迅速，或枪法更胜一筹，才能存活到最后，成为最终吃鸡的赢家。&nbsp;&nbsp;</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/578080/extras/fa735ab8c6a53aad70db16bca96549d9.poster.avif?t=1764817633\"></span></p><p class=\"bb_paragraph\"><strong>多样玩法，</strong>&nbsp;</p><p class=\"bb_paragraph\">&nbsp;</p><p class=\"bb_paragraph\">在团队淘汰竞赛中热身，尝试街机模式的多变玩法，体验全新赛季活动，或创建自定义大厅，和好友来一场特别的较量！&nbsp;</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/578080/extras/83ece2f7635b618bee2c6dd899a13503.poster.avif?t=1764817633\"></span></p><p class=\"bb_paragraph\"><strong>独特战局</strong>&nbsp;</p><p class=\"bb_paragraph\">&nbsp;</p><p class=\"bb_paragraph\">每一场战斗都独一无二，你的每次降落、搜集和求生的决策都至关重要。空降战场后，你的每一个选择都可能关乎胜负；战斗到底，力争成为最后的生存者。&nbsp;</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\">可自由选择购买的游戏内商品已上架。&nbsp;</p>",

    "BackgroundImage": "075f791f-30c6-4f5e-882f-d3078037ea02\\737f7bd1-82dc-4a0d-9c19-be7c30d7ffe7.jpg",
    "Description": "<p class=\"bb_paragraph\"><i>你青春年少，试着查清楚父亲的遭遇；但最后却碰上一场事故，失去了一部分记忆。如今的你，把往事抛在身后，搬到另一座小镇上开展大学生活。身为大一新生，你将邂逅多名美少女，走进一个充满着乐趣、谜团以及性爱内容的新世界。</i></p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1350650/extras/56dfd5cfb33a3fc00375267907b79529.poster.avif?t=1755804848\"></span></p><p class=\"bb_paragraph\">《新生也疯狂》是一款由选择推动情节发展的成人向视觉小说游戏，涵盖以下内容：</p><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\">超过7000张静态图片，多达150个动态情景</p></li><li><p class=\"bb_paragraph\">8到10小时的游戏时间</p></li><li><p class=\"bb_paragraph\">引人入胜的谜团</p></li><li><p class=\"bb_paragraph\">145首曲目</p></li><li><p class=\"bb_paragraph\">形形色色的美少女，海量的香艳情景</p></li><li><p class=\"bb_paragraph\">总计五个章节</p></li></ul><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\">揭开往事背后的秘密</h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1350650/extras/b42d0459afc1caa5a77a82aea499df32.avif?t=1755804848\"></span>揭开往事背后的秘辛，那是一个幽远诡秘的阴谋。体验诸多反转，邂逅令人难忘的角色。</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\">和你梦想中的美少女（或者一群美少女）约会</h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1350650/extras/1dcfffebc0c152f44594d925bc6db222.avif?t=1755804848\"></span>在充满交互因素的约会环境中结识至多8位爱侣。对于确立关系而言，每个选择都至关重要！她们各有各的个性、品味和女性风范！</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\">建立你的后宫</h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1350650/extras/d82f79f6cef68fdea0a08ab921100393.avif?t=1755804848\"></span>如果您准备好迎接难如登天的挑战，不妨尝试建立终极后宫！每位少女的身材、喜恶都各不相同。当然了，还有性癖也是……</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\">《新生也疯狂：第2季》以及之后的几季都将延续同一故事，并作为DLC单独发布和销售。</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1350650/extras/e5c7db503c450f4973dbe7300bebf07d.avif?t=1755804848\"></span><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1350650/extras/97a83e417017310e731fd7d6a62d6513.avif?t=1755804848\"></span></p>",

    "Description": "<p class=\"bb_paragraph\"><strong>Goose Goose Duck</strong> 是一款社交推理游戏，鹅需要完成任务，而鸭子则会进行破坏并试图消灭鹅。您可以扮演一只鹅以求生存，或者扮演一只鸭子制造混乱。游戏支持近距离语音聊天、独特的角色、自定义的外观装扮和多样化的环境供您探索。</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\">作为鹅：<strong>&nbsp;</strong>完成任务、报告尸体并投票将鸭子驱逐出局。</p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1568590/extras/de70f42131182c53ff08d10ef0502595.poster.avif?t=1750955551\"></span></p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\">作为鸭子<strong>：&nbsp;</strong>发动破坏行动，干扰并消灭鹅。</p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1568590/extras/f8c7a7fd9cdc65f9f47df9cd1b3d73f5.poster.avif?t=1750955551\"></span></p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\">作为中立者：<strong>&nbsp;</strong>追求你自己的秘密目标，争取获胜。</p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1568590/extras/b18388ae4b7007beddf12498d3adbcde.poster.avif?t=1750955551\"></span></p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\"><strong>功能特色：</strong></h2><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\">近距离语音聊天</p></li><li><p class=\"bb_paragraph\">跨平台游戏 – 支持PC、Mac、iOS和Android</p></li><li><p class=\"bb_paragraph\">独特的角色系统</p></li><li><p class=\"bb_paragraph\">可自定义的装扮</p></li><li><p class=\"bb_paragraph\">多样化的地图和环境</p></li><li><p class=\"bb_paragraph\">游戏内任务和迷你游戏</p></li><li><p class=\"bb_paragraph\">多种游戏模式</p></li><li><p class=\"bb_paragraph\">定期更新和新内容追加</p></li></ul>",

    "Description": "深入《双影奇境》的多重世界，体验惊心动魄的时刻。这是由 2021 年度最佳游戏《双人成行》工作室打造的又一款创新合作类动作冒险游戏。米欧和佐伊是两位风格截然不同的作家，她们一个擅长科幻小说，另一个专注于奇幻题材。被骗进入一台意在窃取创意的机器后，她们陷入了自己创作的故事之中。她们必须相互依靠，保护自己的记忆不受侵害，进而赢得自由；同时她们还必须共同努力掌握各种技能，在科幻与奇幻的世界间穿梭，在意外萌生的友情中共同克服挑战。<br><br>《双影奇境》是一款独一无二的动作类冒险游戏，让你身临其境，感受一个个意想不到的时刻。前一分钟你还在驯服惹人喜爱的龙，下一分钟就变身成为赛博忍者与敌人对战。逃离可怕的巨魔，躲避机器人停车场管理员投掷出的悬浮车辆等等……怪诞，狂野而多彩的体验，专为与伙伴分享体验而设计。<br><br>叫上搭档，准备好克服前进过程中遇到的任何障碍。<br><br><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2001120/extras/7b3b5eca6b0c25fc3a0b12185f3af6df.poster.avif?t=1763484567\"></span>",

    "Description": "Wallpaper Engine 使您可在 Windows 桌面上使用动态壁纸。它支持各种类型的动画壁纸，包括 3D 和 2D 动画、网站、视频、乃至某些应用程序。选择现有壁纸，或创建自己的壁纸并在 Steam 创意工坊上分享！此外，您还可以使用适用于 Android 的 Wallpaper Engine 免费伴侣应用程序，将您最喜爱的壁纸传输到 Android 移动设备，并随身携带动态壁纸。<br><br><strong>新功能：</strong>使用免费的 Android 伴侣应用程序，将您最喜爱的壁纸传输到 Android 移动设备。<br><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/431960/extras/77154d0b748644adfcdfdad048fcd1e1.avif?t=1739211362\"></span><br><br><ul class=\"bb_ul\"><li>通过实时图形、视频、应用程序或网站让您的桌面充满活力。<br></li><li>在您离开计算机时使用动画屏幕保护程序。<br></li><li>用您最喜欢的颜色个性化动画壁纸。<br></li><li>使用可通过鼠标控制的交互式壁纸。<br></li><li>支持多种宽高比和原始分辨率，包括 16:9、21:9、16:10、4:3。<br></li><li>支持多显示器环境。<br></li><li>壁纸将在玩游戏时暂停，以节省性能。<br></li><li>在 Wallpaper Engine 编辑器中创建自己的动画壁纸。<br></li><li>通过基本图片制作新的动态壁纸动画，或为壁纸导入 HTML 或视频文件。<br></li><li>使用 Steam 创意工坊免费分享和下载壁纸。<br></li><li>Wallpaper Engine 可与任何其他 Steam 游戏或应用程序同时使用。<br></li><li>支持的视频格式：mp4、WebM、avi、m4v、mov、wmv（对于本地文件，创意工坊仅支持 mp4）。<br></li><li>使用免费的 Android 伴侣应用程序，随身携带您最喜爱的场景和视频壁纸。<br></li><li>支持 Razer Chroma 和 Corsair iCUE。</li></ul><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/431960/extras/03b14fb2acf91d9bf17adc2d18778cc4.avif?t=1739211362\"></span><br><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/431960/extras/f9c0282a9f4c800f72beda69cf51f4c9.avif?t=1739211362\"></span><h2 class=\"bb_tag\"></h2>Wallpaper Engine 旨在提供有趣的体验，同时尽可能少占用系统资源。您可以选择在使用其他应用程序或全屏播放（包括无边框窗口模式）时自动暂停或完全停止壁纸，以免在玩游戏或工作时分散注意力或受到妨碍。许多微调质量和性能的选项可使 Wallpaper Engine 完美地适合您的计算机。根据一般经验，3D、2D 和基于视频的壁纸表现最佳，而网站和应用程序需要占用您系统中更多的资源。强烈建议您使用专用 GPU，但这不是必要要求。<h2 class=\"bb_tag\"></h2><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/431960/extras/4a6dd14923f81be2d9a27238a476e831.avif?t=1739211362\"></span><h2 class=\"bb_tag\"></h2>Steam 创意工坊中提供超过一百万张免费壁纸，而且每天都会上传新壁纸！找不到适合您心情的壁纸？通过使用 Wallpaper Engine 编辑器从图片、视频、网站或应用程序创建自己的动画壁纸，尽情发挥您的想象力。大量的预设和效果可让您为自己的图片制作动画，并在 Steam 创意工坊上分享或仅为己用。",

    "Description": "<p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><i>你青春年少，试着查清楚父亲的遭遇；但最后却碰上一场事故，失去了一部分记忆。如今的你，把往事抛在身后，搬到另一座小镇上开展大学生活。身为大一新生，你将邂逅多名美少女，走进一个充满着乐趣、谜团以及性爱内容的新世界。</i> </p><p class=\"bb_paragraph\"> </p><p class=\"bb_paragraph\"><i>经历第一季的险情后，你终于与父亲团聚，同时逐渐揭开了他失踪的真相。然而，事情并不像表面上的那么简单。 </i> </p><p class=\"bb_paragraph\"> </p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3478650/extras/032422eced46ad50c1b8862d74609c92.poster.avif?t=1765821149\"></span></p><p class=\"bb_paragraph\"> </p><h2 class=\"bb_tag\">预计内容包括： </h2><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\">6,324幅4K渲染图</p></li><li><p class=\"bb_paragraph\">407段动画</p></li><li><p class=\"bb_paragraph\">68,577词彙</p></li><li><p class=\"bb_paragraph\">支持者版中的部分场景可选择皮肤与阴毛</p></li><li><p class=\"bb_paragraph\">茱莉亚的3D打印手办, 支持者版专属</p></li><li><p class=\"bb_paragraph\">翻譯：英語、西班牙語、法語、繁體中文、簡體中文、德語、義大利語、韓語、波蘭語、日語、捷克語、泰語、葡萄牙語、土耳其語及俄語;</p></li><li><p class=\"bb_paragraph\">配音和新稿</p></li><li><p class=\"bb_paragraph\">所有角色均支持汗水、物理效果及高清贴图 </p></li></ul><p class=\"bb_paragraph\"> </p><h2 class=\"bb_tag\">群芳争艳</h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3478650/extras/7907cab10127238d0a0a9f0dcbe5fe2a.poster.avif?t=1765821149\"></span></p><p class=\"bb_paragraph\">与多达10位女性发展关系，了解她们各自的故事和兴趣。挑选心仪的对象建立后宫。 </p><p class=\"bb_paragraph\"> </p><h2 class=\"bb_tag\">选择一条充斥着坎坷、喜剧感和海量性爱内容的道路</h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3478650/extras/393a4ba5ae08e005eda1efea5c311c3b.poster.avif?t=1765821149\"></span></p><p class=\"bb_paragraph\">做出自己的选择开辟道路。揭开过去的谜团，走上复仇之路，或者选择痛改前非，过上平静的生活。 </p><p class=\"bb_paragraph\"> </p><h2 class=\"bb_tag\">准备好迎接一段充满冒险、艳遇和缠绵的惊险旅程</h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3478650/extras/be4841b104663f237d656813f6c6a84d.poster.avif?t=1765821149\"></span></p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\">开苞破处。猛干熟妇。实现你的双飞梦想。</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><strong>备注:</strong></p><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\">此版本不包含《新生也疯狂》第1季内容。</p></li><li><p class=\"bb_paragraph\">你可以加载《新生也疯狂》第1季存档，延续之前的选择。</p></li></ul>",

    "Description": "<h2 class=\"bb_tag\"><strong>游戏特色</strong></h2><p class=\"bb_paragraph\">《天月麻雀》是首款集台湾麻将、香港麻将、日本麻将及四川麻将，加上台港日人气配音阵容及二次元风格的免费线上麻将游戏。</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\">集台日港川麻将玩法，即时多人线上对局</h2><p class=\"bb_paragraph\">游戏提供跨平台多人连线即时麻将对局，集合台湾麻将、香港麻将、日本 (立直) 麻将及四川麻将四款玩法，随时随地一开即玩。除了具挑战性的段位模式外，游戏更设有休闲场、友人场等多种模式，带给麻将爱好者最丰富的对局选择。</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\">台湾、香港、日本三地人气配音阵容</h2><p class=\"bb_paragraph\">每位角色都有台、港、日三地的本地化配音、令你更投入每场麻将对战！国语配音有超过10位人气台湾vtuber献声，包括真理果、bana、515、哈鲁、祈Iruni、洛可洛斯特、Aoi、小金碧碧、莱姆薄荷等，不能尽录，总有一位你会喜欢！粤配有vtuber米亚、MK妹及纺霊拉比等等。日配则有超人气实力声优坐阵：包括优木加奈、小仓唯、日笠阳子、内田真礼、鬼头明里、纺木吏佐、天崎滉平、前田诚二等。每位角色均有专属的酷炫胡牌动画、精致动态立绘及搞怪表情贴图。更多vtuber配音及联动活动持续增加中，敬请期待！</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\">装饰品自由配搭，打造专属麻将领域</h2><p class=\"bb_paragraph\">多款装饰品及胡牌特效让玩家自由配搭，令对局更富个人风格、胡牌仿如使用炫酷绝招。 《天月麻雀》更首创雀局主题场景，真正在麻将桌上领域展开，带来前所未有的沉浸式体验！</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\"><strong>详细麻将教学，助你轻松上手</strong></h2><p class=\"bb_paragraph\">台日港川四款麻将有未玩过的不会规则？不用担心！游戏特别为新手贴心设计，有精通四式麻将的教学助手，规则、胡牌型、结算计分通通手把手教学，助你一秒菜鸟变雀圣。配合自动排序、摸牌及切牌等系统，对局更流畅，全面提升您的对局体验。</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\">定期举办官方赛事，以牌会友互相切磋</h2><p class=\"bb_paragraph\">官方定期举办各款麻将线上线下赛事，让玩家从竞技中一起交流进步、切磋牌技。赛事不但免费参加，更设有丰富限定奖励，让玩家透过激烈对局竞逐「天元月华」最高荣誉。</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\">QQ群群号：995854428</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\">※ 游戏以18岁以上之成年人为诉求对象。</p><p class=\"bb_paragraph\">※ 游戏不提供现金交易赌博，游戏内的所有货币、道具及角色均属虚拟财产，不能兑换为现金或任何形式的实物报酬。</p><p class=\"bb_paragraph\"></p>",

    "Description": "游玩《双人成行》，踏上生命中最疯狂的旅程，这是一款别开生面的平台冒险游戏，完全为合作模式而设计。利用好友通行证*邀请一位好友免费游玩，共同体验多种多样的乐趣，享受颠覆性的玩法挑战。扮演相互看不顺眼的科迪和小梅夫妇，这两个人被魔咒变成了玩偶。他们一起被困在一个奇幻世界里，每个角落都隐藏着意想不到的东西，他们不得不一起克服挑战，同时挽救他们破裂的关系。<br><br>在每个新关卡中，掌握角色独特且与对方息息相关的能力。一定要互相帮助，克服大量出乎意料的障碍，共度搞笑欢乐的时刻。用力踢流氓松鼠毛茸茸的尾巴，绕过一条内裤，在热闹的夜店里开舞会，坐雪橇穿过神奇的雪花玻璃球。一个真挚又搞笑的故事在游戏中徐徐展开，交织成独特的隐喻体验。<br><br>《双人成行》由业界合作游戏领导者且屡获殊荣的工作室 Hazelight 开发。他们即将带您踏上狂野而奇妙的旅程，只有一件事是确定的：二人同心，其利断金。<h2 class=\"bb_tag\"><strong>主要特色</strong></h2><ul class=\"bb_ul\"><li><strong>纯粹而完美的合作模式</strong>——通过远程同乐**邀请好友免费畅玩，体验一场纯粹为两位玩家打造的惊奇冒险。体验分屏显示模式，选择本地合作或在线联机，面对不断变化的挑战，团结一致是前进的唯一途径。<br><br></li><li><strong>搞笑又颠覆想像的游戏</strong>——从暴走的真空吸尘器到走心的爱情大师，您永远不会知道接下来会遇到什么。每个关卡都有大量别开生面的挑战和需要掌握的全新角色技能，体验故事和游戏交织的隐喻风格，推动互动式故事徐徐展开。<br><br></li><li><strong>关于人际关系的故事</strong>——在克服挑战的相处中发现真挚情感。帮助科迪和小梅学习如何克服他们之间的分歧。结识各种奇特和可爱的角色。团结一致，一起踏上冒险之旅！</li></ul><h2 class=\"bb_tag\"><strong>关于 HAZELIGHT</strong></h2>Hazelight 位于瑞典斯德哥尔摩，是一家屡获殊荣的独立游戏开发工作室。在 2014 年由 Josef Fares（影片导演和获奖游戏《兄弟：双子传说》的创作者）创办，Hazelight 致力于推动游戏的创意界限。在 2018 年，Hazelight 发布了荣获 BAFTA 奖的游戏《A Way Out》——史上第一款第三人称动作-冒险合作游戏——这是 EA Originals 计划的一部分。<h2 class=\"bb_tag\"><strong>关于 EA ORIGINALS</strong></h2>EA Originals 帮助全球充满热情,自成一格,才华横溢的游戏工作室崭露头角。发掘别出心裁的游戏制作者，探索他们天马行空的想象力，展现新颖而难忘的游戏体验。",

  {

    "Description": "<span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/945360/extras/e5c2ed740b8c544b5fe6adee73f86d66.avif?t=1757444903\"></span><br>欢迎各位新乘员！<br><br>快跳入《Among Us》最新的地图“Airship”中吧！在这艘飞船上同心协力，实行最缜密巧妙的计划... 至于是以船员还是伪装者的身分行动，那就是另一回事了。<br><br>本次免费更新包含：<br><ul class=\"bb_ul\"><li>第 4 张地图，也是当前最大的地图<br></li><li>抛光宝石、清垃圾 (真好玩) 等全新任务<br></li><li>能够选择开局时所在的房间<br></li><li>可探索 (或死于其中) 的全新区域<br></li><li>改善梯子与移动平台的移动能力<br></li><li>全新免费帽子，包含心型别针、愤怒眉毛、独角兽头部、橡胶手套等内容！</li></ul><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/945360/extras/6bbe13c19eac2f3aeaadddbc7bb40fdc.avif?t=1757444903\"></span><br><br>您可以在线或利用本地 WiFi 与 4-15 名玩家一起游玩，努力整备飞船为出发做准备，但过程中要小心，组员中至少会有一名玩家会被随机指派为想要杀死大家的伪装者！<br><br>本游戏是以派对同乐为目的打造而成，因此推荐您与好友们通过局域网面机，或在线上配合语音聊天一起游玩。可在 Android、iOS 和电脑间跨平台畅游。<br><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/945360/extras/76bef22d1af309e719a8f2b578ef63dc.avif?t=1757444903\"></span><br><br><ul class=\"bb_ul\"><li>完成任务让船只准备好启程或是驱逐所有伪装者来获得胜利。<br></li><li>快速应对以修复伪装者造成的破坏。<br></li><li>查看管理室地图和保安摄像机以密切关注其他船员的动态。<br></li><li>发现尸体时立即报告，以开始讨论谁可能是伪装者。<br></li><li>召开紧急会议来针对可疑的行动进行讨论。<br></li><li>投票驱逐推测是伪装者的人。</li></ul><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/945360/extras/a00136b10c71226d0cb43d07d88efbf7.avif?t=1757444903\"></span><br><br><ul class=\"bb_ul\"><li>杀死船员并嫁祸给旁观者。<br></li><li>假装进行任务以融入船员之中。<br></li><li>利用通风口在船上隐密地快速移动。<br></li><li>搞破坏来制造混乱并分化船员。<br></li><li>关门以困住受害者并悄悄将其杀害。</li></ul><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/945360/extras/c2ae1f9084de411d71d9c73d345d9622.avif?t=1757444903\"></span><h2 class=\"bb_tag\"> 功能 </h2><ul class=\"bb_ul\"><li>客制化：自行选择颜色和帽子。<br></li><li>多样化的游戏选项：增加更多伪装者、更多任务与其他更多内容！<br></li><li>利用主持列表来快速寻找在线游戏！<br></li><li>游戏内文字聊天。<br></li><li>丰富的 Discord 整合项目。<br></li><li>在电脑、Android 和 iOS 上享受跨平台游玩的乐趣！</li></ul>",

  {
    "BackgroundImage": "e5fd7d3c-4a81-415a-b16c-eed25dca6852\\8f425632-f8ea-4de4-9b56-acdcf3b64f8a.jpg",
    "Description": "<h2 class=\"bb_tag\"><strong>战术干员，硬核撤离</strong></h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2507950/extras/652f6c335d66eb9209730063a330a9e3.poster.avif?t=1770350489\"></span></p><p class=\"bb_paragraph\">加入G.T.I.（全球应急行动组织），集结各怀绝技的精英干员。无论你是用侦察箭索敌、磁吸炸弹爆破，还是启动动力外骨骼强行冲阵—灵活运用战术道具与队友协同，在险象环生的撤离任务中智胜对手。</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\"><strong>前所未有的搜刮乐趣</strong></h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2507950/extras/0a3769c06708785f035665e2736bae83.poster.avif?t=1770350489\"></span></p><p class=\"bb_paragraph\">重燃对战利品的原始渴望。探索动态地图，破解密码，上天掏鸟窝，下海摸蚌壳。每一次出击都是一场未知的寻宝博弈，将单纯的搜刮升格为肾上腺素狂飙的冒险。</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\"><strong>智取首领，枪火制胜</strong></h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2507950/extras/1714c15ede69196c9325adca67d2d84d.poster.avif?t=1770350489\"></span></p><p class=\"bb_paragraph\">直面全副武装的佣兵与残暴首领，夺取高价值物资。但请时刻保持警惕—最致命的猎手往往是和你一样觊觎战利品的敌对玩家。只有活到最后的赢家，才配拥有财富。富贵，险中求。</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\"><strong>撤离路线，由你掌控</strong></h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2507950/extras/181965c4720d88928eb6fb1254f70a37.poster.avif?t=1770350489\"></span></p><p class=\"bb_paragraph\">撤离是一门艺术。告别枯燥的定点撤离—你可以发射巨型火箭升空，身着飞鼠装高空滑翔，或是穿越地下管网隐秘潜行。在混乱战场中随机应变，用最意想不到的方式全身而退。</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\"><strong>满载而归，升级你的特勤处</strong></h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2507950/extras/289b106705999bcd156696ec829ae7c9.poster.avif?t=1770350489\"></span></p><p class=\"bb_paragraph\">生存只是第一步。利用带出的物资升级特勤处，扩充军火库容，强化身体机能并解锁尖端装备。每一次积累都将转化为战场优势，助你以更强姿态、更精良装备重返前线。</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\"><strong>海陆空三栖，主宰全面战场</strong></h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2507950/extras/2b05bc4cc804393046d6c09d3b9cbf43.poster.avif?t=1770350489\"></span></p><p class=\"bb_paragraph\">投身全面战场，体验64人的史诗级宏大对决。驾驶坦克和直升机穿梭于城市街道、山巅和广阔岛屿之间。在支持全场景破坏的地图上，体验无缝衔接的纯粹战斗快感。</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\"><strong>海量军械，极致改装</strong></h2><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2507950/extras/8e83034ce18c8e074872ef74de8a7d5f.poster.avif?t=1770350489\"></span></p><p class=\"bb_paragraph\">在资深军事顾问的协助下，数十把枪械、每把武器超10种改装部位，超1000种搭配，创造并分享你独特的改装方案。不止于枪械，你还可以改装海陆空载具。定制专属军火库，按你的方式主宰战场。</p><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\"><strong>【写在最后的话，来自制作人Shadow】</strong></h2><p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\"><strong>作为玩家：</strong></h2><p class=\"bb_paragraph\">《三角洲特种部队》是我玩过的第一款射击游戏，它开启了我对射击游戏的热爱和梦想。我非常珍惜制作这款《三角洲行动》的机会，希望能让更多玩家体验到那种难忘的游戏乐趣。我想要新三角洲成为这个宏大的射击世界。 </p><h2 class=\"bb_tag\"><strong>作为制作人：</strong></h2><p class=\"bb_paragraph\">我们希望做出Unreal的极致表现，做到真正的跨端，能让全球玩家领略到丰富战术策略、有深度的角色、战场破坏、顶级动作……对得起“下一代”射击称号。</p><p class=\"bb_paragraph\">希望你们和我一起，共同打造出这款属于所有三角洲玩家的《三角洲行动》。 </p><p class=\"bb_paragraph\"></p>",

  {
    "BackgroundImage": "40d7dc30-c046-4965-97ec-61cb372e09b9\\5d648c5d-c65a-485b-b54f-1e67fd95ce6d.jpg",
    "Description": "<p class=\"bb_paragraph\"></p><h2 class=\"bb_tag\"><strong>Aimlabs是排名第一的瞄准训练平台，已获超过4000万名玩家的信赖！准备好提升你的瞄准技巧了吗？</strong></h2><p class=\"bb_paragraph\">Aimlabs是一个帮助你在第一人称射击游戏「FPS」提升瞄准技巧的训练平台。无论你玩哪种FPS游戏，Aimlabs都提供了全面的工具来改善你的瞄准能力。精心策划的训练场景能让你迅速成为神射手！</p><p class=\"bb_paragraph\">进入专门设计的训练项目，掌握「快速瞄准」、「追踪瞄准」和「切换瞄准」的技巧。 Aimlabs的详细分析为你提供宝贵的意见，引导你快速进步。</p><p class=\"bb_paragraph\">Aimlabs不断增加新功能，确保与各类游戏的兼容性。无论你是新手还是经验丰富的玩家，Aimlabs都能助你一臂之力，提升竞技优势。</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/714010/extras/16a9df8737ee67a9cfeefb3edb61d761.poster.avif?t=1766860625\"></span></p><h2 class=\"bb_tag\"><strong>功能特色：</strong></h2><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\"><strong>瞄准训练：</strong>通过训练「快速瞄准」、「追踪瞄准」和「切换瞄准」来掌握瞄准基础！</p></li><li><p class=\"bb_paragraph\"><strong>游戏专用训练：</strong>找到最适合你的FPS游戏训练任务列表！</p></li><li><p class=\"bb_paragraph\"><strong>找到你的灵敏度 (Universal Sensitivity Finder)：</strong>找到适用于任何游戏并专属于你的最佳滑鼠灵敏度！</p></li><li><p class=\"bb_paragraph\"><strong>Valorant训练中心：</strong>在「1:1地图重建」中训练Valorant的基本技巧，如准星位置！</p></li><li><p class=\"bb_paragraph\"><strong>自适应任务 (Adaptive Tasks)：</strong>以最适合你的难度进行每项任务，个性化你的瞄准训练！</p></li><li><p class=\"bb_paragraph\"><strong>Aimlabs学院 (Academy)：</strong>每月推出新的课程！透过专家制作的逐步课程，学习如何将训练应用于你最爱的FPS游戏。</p></li><li><p class=\"bb_paragraph\"><strong>Discovery AI教练：</strong>从你的个人AI瞄准教练获取瞄准建议！</p></li><li><p class=\"bb_paragraph\"><strong>瞄准分析：</strong>透过详细的分析揭示你的瞄准强项和弱项！</p></li><li><p class=\"bb_paragraph\"><strong>灵敏度匹配：</strong>使用与你FPS游戏中完全相同的滑鼠灵敏度进行训练！</p></li><li><p class=\"bb_paragraph\"><strong>排名赛季 (Ranked Seasons)：</strong>与其他玩家竞争获得Aimlabs排名，展现你的瞄准水平！</p></li><li><p class=\"bb_paragraph\"><strong>排行榜：</strong>与其他枪手竞赛，展示你出色的瞄准技巧！</p></li><li><p class=\"bb_paragraph\"><strong>玩家自订：</strong>使用武器造型、头像、横幅、头衔等自订你的瞄准训练！</p></li><li><p class=\"bb_paragraph\"><strong>战斗通行证 (Battlepass)：</strong>在Aimlabs季赛中玩游戏即可获得独家奖励！</p></li><li><p class=\"bb_paragraph\"><strong>重播录影：</strong>观看并学习其他玩家在每项任务中的瞄准方式！</p></li><li><p class=\"bb_paragraph\"><strong>每日任务：</strong>透过训练赚取Aim积分，每天兑换精彩奖励！</p></li><li><p class=\"bb_paragraph\"><strong>自订环境：</strong>完全掌控你的训练环境！</p></li><li><p class=\"bb_paragraph\">滑鼠+游戏手把支援：无论输入设备如何，都可以自由训练！</p></li><li><p class=\"bb_paragraph\"><strong>训练连击：</strong>每天玩游戏，追踪你的训练进度！</p></li><li><p class=\"bb_paragraph\"><strong>持续更新：</strong>我们不断增加新功能，探索创新的方式来提升你的瞄准。我们持续新增任务和内容，确保与多种游戏的兼容性。</p></li></ul><h2 class=\"bb_tag\"><strong>玩家评价：</strong></h2><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\">「Aimlabs让我在Valorant中不再拖后腿。」 - Discord用户</p></li><li><p class=\"bb_paragraph\">「我非常喜欢玩Aimlabs。我的Wingman枪法确实提升了。」 - Lululuvely</p></li><li><p class=\"bb_paragraph\">「Aimlabs帮我克服了左侧弱点。」 - King George</p></li><li><p class=\"bb_paragraph\">「有了Aimlabs，还需要去健身房吗？」 - Aceu</p></li><li><p class=\"bb_paragraph\">「Aimlabs让我交到女朋友。」 - Twitter用户</p></li></ul>",

// 初始化平台筛选
const platformSelect = document.getElementById('platform');
const platforms = new Set();

data.forEach(g => {
    const p = g.Platforms?.[0]?.Name;
    if (p) platforms.add(p);
});

platforms.forEach(p => {
    const option = document.createElement('option');
    option.value = p;
    option.textContent = p;
    platformSelect.appendChild(option);
});

function render() {
    const container = document.getElementById('games');
    container.innerHTML = '';

    let filtered = [...data];

    const platform = platformSelect.value;
    if (platform !== 'all') {
        filtered = filtered.filter(g => g.Platforms?.[0]?.Name === platform);
    }

    const sort = document.getElementById('sort').value;
    filtered.sort((a, b) => {
        return sort === 'desc'
            ? b.Playtime - a.Playtime
            : a.Playtime - b.Playtime;
    });

    filtered.forEach(game => {
        const playtimeHours = (game.Playtime / 3600).toFixed(1);

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
            <div class="name">${game.Name}</div>
            <div class="meta">
                ${game.ReleaseYear || ''} · ${game.Platforms?.[0]?.Name || ''}
            </div>
            <div class="playtime">⏱ ${playtimeHours} 小时</div>
            ${game.Notes ? `<div class="notes">${game.Notes}</div>` : ''}
        `;

        container.appendChild(card);
    });
}

document.getElementById('sort').addEventListener('change', render);
platformSelect.addEventListener('change', render);

render();

</script>
