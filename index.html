<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>游戏时长档案馆 · 极简黑境</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
            color: #f0f0f0;
            padding: 2rem 1rem;
            line-height: 1.4;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            background: #000000;
        }

        /* 极简黑底白边 */
        .header {
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 1rem;
            margin-bottom: 1.8rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 450;
            letter-spacing: -0.5px;
            margin-bottom: 0.3rem;
            color: #fff;
        }

        .sub {
            font-size: 0.8rem;
            color: #aaaaaa;
            margin-top: 0.2rem;
            border-left: 2px solid #3a3a3a;
            padding-left: 0.7rem;
        }

        /* 控制栏 + 分类统计区块 */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin: 1.2rem 0 1.5rem 0;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem;
            background: #121212;
            padding: 0.4rem 1rem;
            border-radius: 32px;
            border: 1px solid #2c2c2c;
        }

        .filter-group label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #ddd;
        }

        select, button {
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            padding: 0.35rem 0.9rem;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.2s ease;
            color: #f0f0f0;
        }

        select:hover, button:hover {
            border-color: #888;
            background-color: #2a2a2a;
        }

        .sort-buttons {
            display: flex;
            gap: 0.6rem;
        }

        .stats-badge {
            background: #121212;
            padding: 0.3rem 1rem;
            border-radius: 32px;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: monospace;
            border: 1px solid #2c2c2c;
        }

        .stats-badge span {
            font-weight: 700;
            color: #ffffff;
        }

        /* 分类总时长面板 — 新增加区域，显示各分类总时长排序 */
        .category-summary {
            background: #0a0a0a;
            border: 1px solid #262626;
            border-radius: 20px;
            padding: 1rem 1.2rem;
            margin-bottom: 2rem;
        }

        .category-summary h3 {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-bottom: 0.8rem;
            color: #ccc;
            border-left: 2px solid #fff;
            padding-left: 0.6rem;
        }

        .category-tiles {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem 1rem;
        }

        .cat-tile {
            background: #111;
            border-radius: 40px;
            padding: 0.3rem 1rem;
            font-size: 0.75rem;
            font-family: monospace;
            border: 1px solid #2e2e2e;
            transition: all 0.1s;
            cursor: default;
        }

        .cat-tile strong {
            font-weight: 600;
            color: white;
        }

        .cat-tile span {
            color: #aaa;
            margin-left: 0.3rem;
        }

        .cat-tile:hover {
            border-color: #5a5a5a;
            background: #1a1a1a;
        }

        /* 游戏列表 */
        .game-list {
            margin-top: 1rem;
            border-top: 1px solid #222;
        }

        .game-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 0.5rem;
            border-bottom: 1px solid #1f1f1f;
            transition: background 0.1s;
        }

        .game-row:hover {
            background-color: #0c0c0c;
        }

        .game-name-area {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .game-name {
            font-size: 1rem;
            font-weight: 430;
            letter-spacing: -0.2px;
            word-break: break-word;
            color: #f5f5f5;
        }

        .game-category {
            font-size: 0.65rem;
            background: #1e1e1e;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            color: #bbbbbb;
            text-transform: capitalize;
            font-family: monospace;
            border: 0.5px solid #333;
        }

        .right-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .game-hours {
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 450;
            letter-spacing: 0.3px;
            color: #e0e0e0;
            background: transparent;
            min-width: 85px;
            text-align: right;
        }

        .note-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 0.2rem;
            color: #aaa;
            transition: color 0.1s;
            border-radius: 20px;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .note-btn:hover {
            color: #ffffff;
            background: #2a2a2a;
            border: none;
        }

        .empty-message {
            text-align: center;
            padding: 3rem 1rem;
            color: #666;
            font-size: 0.9rem;
            border-bottom: 1px solid #222;
        }

        /* 模态框 黑底白字 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-card {
            background: #121212;
            max-width: 480px;
            width: 90%;
            border-radius: 24px;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.6);
            border: 1px solid #2e2e2e;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.3rem;
            border-bottom: 1px solid #2a2a2a;
            font-weight: 500;
            background: #0a0a0a;
        }

        .modal-header h3 {
            font-size: 1rem;
            font-weight: 470;
            color: #eee;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            padding: 0 0.3rem;
            color: #aaa;
            border-radius: 40px;
        }

        .close-modal:hover {
            color: white;
            background: #2c2c2c;
        }

        .modal-body {
            padding: 1.3rem;
            font-size: 0.85rem;
            line-height: 1.55;
            color: #e5e5e5;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 60vh;
            overflow-y: auto;
            background: #121212;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: #444;
            border-top: 1px solid #222;
            padding-top: 1.5rem;
        }

        @media (max-width: 680px) {
            body {
                padding: 1rem 0.8rem;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group {
                justify-content: space-between;
            }
            .category-tiles {
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>◼ 游戏时长·黑简录</h1>
        <div class="sub">最近修改于6月7日</div>
    </div>

    <!-- 各分类总时长排序面板 (新增) -->
    <div class="category-summary" id="categorySummaryPanel">
        <h3>📊 分类总时长排行 (小时)</h3>
        <div class="category-tiles" id="categoryTilesContainer">
            <!-- 动态注入分类排行 -->
        </div>
    </div>

    <!-- 筛选 + 排序栏 -->
    <div class="controls">
        <div class="filter-group">
            <label>分类筛选</label>
            <select id="categoryFilter">
                <option value="ALL">▸ 全部游戏</option>
            </select>
            <div class="stats-badge">
                ⏱ 当前总时长 <span id="totalHours">0.0</span> h
            </div>
        </div>
        <div class="sort-buttons">
            <button id="sortHighToLow">↓ 时长 高→低</button>
            <button id="sortLowToHigh">↑ 时长 低→高</button>
        </div>
    </div>

    <!-- 游戏列表 -->
    <div class="game-list" id="gameListContainer">
        <div class="empty-message">加载列表中...</div>
    </div>
    <footer>点击右侧「📋」查看备注详情 · 极简黑境</footer>
</div>

<!-- 备注模态框 -->
<div id="noteModal" class="modal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>📄 游戏备注</h3>
            <button class="close-modal" id="closeModalBtn">✕</button>
        </div>
        <div class="modal-body" id="modalNoteContent">
            <p>备注内容</p>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 原始数据 (基于CSV, 时长单位:秒)
    // --------------------------------------------------------------
    const GAMES_DATA = [
        { name: "4399小游戏", category: "Other", note: "时长来源于游戏内部PC数和粗略计算总和：\n奥奇传说\n摩尔庄园\n美食大战老鼠\n弹弹堂\n森林冰火人\n疯狂小人战斗", platform: "PC (Windows)", playSeconds: 1080000, source: "Other" },

        { name: "Among Us", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 1440, source: "Steam" },

        { name: "Battlefield 1", category: "fps", note: "", platform: "PC (Windows)", playSeconds: 261728, source: "Steam" },
        { name: "Battlefield 2042", category: "fps", note: "", platform: "PC (Windows)", playSeconds: 242700, source: "Steam" },
        { name: "Battlefield 5", category: "fps", note: "", platform: "PC (Windows)", playSeconds: 22380, source: "Steam" },
        { name: "Battlefield 6", category: "fps", note: "", platform: "PC (Windows)", playSeconds: 334620, source: "Steam" },
        { name: "CHUNITHM", category: "Music game", note: "国服991PC，RIN服508PC\n时长计算公式：pleynite自动统计RIN+国服PC*3*240（单位：秒）\nB50=O30+N20\n国服B50（中二节奏2026）：16.44（V段）\nRIN服B50（X-VERSE）：16.81（V段）\nB30：16.93", platform: "Arcade", playSeconds: 1398810, source: "Other" },
        { name: "Counter-Strike 2", category: "fps", note: "", platform: "PC (Windows)", playSeconds: 3545460, source: "Steam" },
        { name: "FreshWomen - Season 1", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 12360, source: "Steam" },
        { name: "FreshWomen - Season 2", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 15420, source: "Steam" },
        { name: "Goose Goose Duck", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 39240, source: "Steam" },
        { name: "MAI MAI", category: "Music game", note: "国服10PC\n时长计算公式：国服PC*3*240（单位：秒）\nDX评分=O35+N15：3369\n段位：无", platform: "Arcade", playSeconds: 7200, source: "Other" },
        { name: "Microsoft Solitaire Collection", category: "Card", note: "", platform: "PC (Windows)", playSeconds: 11580, source: "Xbox" },
        { name: "Minecraft Bedrock", category: "Open world", note: "", platform: "PC (Windows)", playSeconds: 526802, source: "Xbox" },
        { name: "Minecraft iOS", category: "Open world", note: "", platform: "Mobile（iOS）", playSeconds: 892080, source: "Xbox" },
        { name: "Phigros", category: "Music game", note: "时长计算公式：时长来源于TapTap，无PC数据\nRKS=P3+B27：14.92\n位次：76144\n课题模式段位：红49", platform: "Mobile（iOS）", playSeconds: 99720, source: "Other" },
        { name: "Project SEKAI", category: "Music game", note: "时长计算公式：时长随iOS统计每周日更新，无PC数据\n国服排位：白金2\n国服位次：6168", platform: "Mobile（iOS）", playSeconds: 58000, source: "Other" },
        { name: "PUBG: BATTLEGROUNDS", category: "fps", note: "", platform: "PC (Windows)", playSeconds: 1277100, source: "Steam" },
        { name: "Riptide GP: Renegade", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 0, source: "Steam" },
        { name: "Riptide GP2", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 92627, source: "Steam" },
        { name: "Wallpaper Engine：壁纸引擎", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 4740, source: "Steam" },
        { name: "Zuma Deluxe", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 16200, source: "Steam" },
        { name: "斗牌魂", category: "Card", note: "", platform: "PC (Windows)", playSeconds: 180601, source: "Steam" },
        { name: "节奏大师", category: "Music game", note: "老版本闯关188关，新版本70PC\n时长计算公式：240*2*188+240*新版本PC\n节奏战力=B50+N25：5.56", platform: "Mobile（iOS）", playSeconds: 107040, source: "Other" },
        { name: "决战！平安京", category: "MOBA", note: "190PC\n时长计算公式：PC*1800（单位：秒）", platform: "Mobile（iOS）", playSeconds: 342000, source: "Other" },
        { name: "狼人杀", category: "Card", note: "网杀108PC，面杀4h\n时长计算公式：PC*25*60+面杀时长", platform: "Mobile（iOS）", playSeconds: 176400, source: "Other" },
        { name: "球球大作战", category: "Other", note: "80PC\n时长计算公式：PC*600（单位：秒）", platform: "Mobile（iOS）", playSeconds: 48000, source: "Other" },
        { name: "雀魂麻将", category: "Card", note: "", platform: "PC (Windows)", playSeconds: 726713, source: "Steam" },
        { name: "三国杀", category: "Card", note: "", platform: "PC (Windows)", playSeconds: 2172240, source: "Steam" },
        { name: "三角洲行动", category: "fps", note: "", platform: "PC (Windows)", playSeconds: 1760880, source: "Steam" },
        { name: "生死狙击", category: "fps", note: "时长数据来源于游戏内官方统计", platform: "PC (Windows)", playSeconds: 709200, source: "Other" },
        { name: "双人成行", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 60, source: "Steam" },
        { name: "双影奇境", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 58860, source: "Steam" },
        { name: "糖豆人", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 23873, source: "Epic" },
        { name: "天月麻雀", category: "Card", note: "", platform: "PC (Windows)", playSeconds: 44940, source: "Steam" },
        { name: "王者荣耀", category: "MOBA", note: "1865PC\n时长计算公式：PC*1800（单位：秒）\n王者印记：2", platform: "Mobile（iOS）", playSeconds: 3357000, source: "Other" },
        { name: "英雄联盟手游（台服）", category: "MOBA", note: "182PC\n时长计算公式：PC*1800（单位：秒）", platform: "Mobile（iOS）", playSeconds: 327600, source: "Other" }
    ];

    // 辅助: 秒转小时 (保留1位小数)
    function secondsToHours(seconds) {
        let hours = seconds / 3600;
        return Math.round(hours * 10) / 10;
    }

    // 获取全部分类列表
    function getAllCategories() {
        const cats = new Set();
        GAMES_DATA.forEach(g => cats.add(g.category));
        return Array.from(cats).sort();
    }

    // ---------- 状态 ----------
    let currentCategory = "ALL";
    let currentSortMode = "HIGH_TO_LOW";   // 默认高到低 (原始顺序已移除)

    // 获取筛选+排序后的列表
    function getFilteredAndSortedGames() {
        let filtered = [...GAMES_DATA];
        if (currentCategory !== "ALL") {
            filtered = filtered.filter(g => g.category === currentCategory);
        }
        if (currentSortMode === "HIGH_TO_LOW") {
            filtered.sort((a, b) => b.playSeconds - a.playSeconds);
        } else if (currentSortMode === "LOW_TO_HIGH") {
            filtered.sort((a, b) => a.playSeconds - b.playSeconds);
        }
        return filtered;
    }

    // 计算当前筛选后的总时长(小时)
    function getTotalHoursForFiltered() {
        let filtered = [...GAMES_DATA];
        if (currentCategory !== "ALL") {
            filtered = filtered.filter(g => g.category === currentCategory);
        }
        const totalSec = filtered.reduce((sum, g) => sum + g.playSeconds, 0);
        return secondsToHours(totalSec);
    }

    // 计算各个分类的总时长，并按总时长降序排列 (用于新面板)
    function getCategoryTotalHoursSorted() {
        const catMap = new Map(); // category => totalSeconds
        GAMES_DATA.forEach(game => {
            const cat = game.category;
            const current = catMap.get(cat) || 0;
            catMap.set(cat, current + game.playSeconds);
        });
        // 转换成 [{category, totalHours}]
        let arr = [];
        for (let [cat, sec] of catMap.entries()) {
            arr.push({ category: cat, totalHours: secondsToHours(sec) });
        }
        // 按总时长从高到低排序
        arr.sort((a, b) => b.totalHours - a.totalHours);
        return arr;
    }

    // 渲染分类总时长面板 (白字黑底风格)
    function renderCategorySummary() {
        const container = document.getElementById("categoryTilesContainer");
        if (!container) return;
        const sortedCats = getCategoryTotalHoursSorted();
        if (sortedCats.length === 0) {
            container.innerHTML = '<span style="color:#555;">暂无分类数据</span>';
            return;
        }
        let html = '';
        sortedCats.forEach(catInfo => {
            html += `
                <div class="cat-tile">
                    <strong>${escapeHtml(catInfo.category)}</strong>
                    <span>${catInfo.totalHours.toFixed(1)} h</span>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // 分类下拉框填充
    function populateCategorySelect() {
        const selectEl = document.getElementById("categoryFilter");
        if (!selectEl) return;
        const categories = getAllCategories();
        let options = '<option value="ALL">▸ 全部游戏</option>';
        categories.forEach(cat => {
            const selected = (currentCategory === cat) ? 'selected' : '';
            options += `<option value="${escapeHtml(cat)}" ${selected}>${escapeHtml(cat)}</option>`;
        });
        selectEl.innerHTML = options;
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, c => c);
    }

    // 渲染游戏主列表
    function renderGameList() {
        const container = document.getElementById("gameListContainer");
        if (!container) return;
        const gamesToRender = getFilteredAndSortedGames();
        const totalHrs = getTotalHoursForFiltered();
        document.getElementById("totalHours").innerText = totalHrs.toFixed(1);
        
        if (gamesToRender.length === 0) {
            container.innerHTML = '<div class="empty-message">⚡ 无游戏记录 · 切换分类试试</div>';
            return;
        }
        
        let html = '';
        for (let game of gamesToRender) {
            const hoursVal = secondsToHours(game.playSeconds);
            const displayHours = hoursVal.toFixed(1);
            const categoryLabel = escapeHtml(game.category);
            const gameNameEscaped = escapeHtml(game.name);
            html += `
                <div class="game-row" data-game-name="${escapeHtml(game.name)}">
                    <div class="game-name-area">
                        <span class="game-name">${gameNameEscaped}</span>
                        <span class="game-category">${categoryLabel}</span>
                    </div>
                    <div class="right-section">
                        <span class="game-hours">${displayHours} h</span>
                        <button class="note-btn" data-note-game="${escapeHtml(game.name)}" title="查看备注">📋</button>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        
        // 绑定备注按钮事件
        const noteBtns = document.querySelectorAll('.note-btn');
        noteBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const gameNameAttr = btn.getAttribute('data-note-game');
                if (gameNameAttr) {
                    const targetGame = GAMES_DATA.find(g => g.name === gameNameAttr);
                    if (targetGame) {
                        let finalNote = targetGame.note && targetGame.note.trim() !== "" ? targetGame.note : "（暂无备注信息）";
                        if (targetGame.platform) {
                            finalNote = `🎮 平台：${targetGame.platform}\n\n📝 详细备注：\n${finalNote}`;
                        } else {
                            finalNote = `📝 详细备注：\n${finalNote}`;
                        }
                        showModal(finalNote);
                    } else {
                        showModal("无法找到备注数据");
                    }
                }
            });
        });
    }
    
    // 模态框逻辑
    const modal = document.getElementById("noteModal");
    const modalContent = document.getElementById("modalNoteContent");
    function showModal(contentText) {
        if (!modal || !modalContent) return;
        modalContent.innerHTML = `<p style="white-space: pre-wrap; font-family: monospace;">${escapeHtml(contentText)}</p>`;
        modal.style.display = "flex";
    }
    function closeModal() {
        if (modal) modal.style.display = "none";
    }
    
    // 事件绑定 (移除原始顺序相关)
    function bindUIEvents() {
        const categorySelect = document.getElementById("categoryFilter");
        const sortHighBtn = document.getElementById("sortHighToLow");
        const sortLowBtn = document.getElementById("sortLowToHigh");
        
        if (categorySelect) {
            categorySelect.addEventListener("change", (e) => {
                currentCategory = e.target.value;
                renderGameList();
                // 保持下拉选中同步
                if (categorySelect.value !== currentCategory) categorySelect.value = currentCategory;
                // 分类总时长面板不需要重新渲染？需要更新（但面板数据与筛选无关，显示全部游戏分类时长，保持不变即可，但为了展示总排名刷新也没关系）
                renderCategorySummary(); // 其实不变但刷新无碍
            });
        }
        
        if (sortHighBtn) {
            sortHighBtn.addEventListener("click", () => {
                currentSortMode = "HIGH_TO_LOW";
                renderGameList();
            });
        }
        if (sortLowBtn) {
            sortLowBtn.addEventListener("click", () => {
                currentSortMode = "LOW_TO_HIGH";
                renderGameList();
            });
        }
        
        // 模态关闭
        const closeBtn = document.getElementById("closeModalBtn");
        if (closeBtn) closeBtn.addEventListener("click", closeModal);
        modal?.addEventListener("click", (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && modal && modal.style.display === "flex") closeModal();
        });
    }
    
    // 页面整体刷新: 渲染分类排行+游戏列表
    function refreshAll() {
        renderCategorySummary();
        populateCategorySelect();
        renderGameList();
    }
    
    // 初始化: 默认排序为高到低, 分类ALL
    currentCategory = "ALL";
    currentSortMode = "HIGH_TO_LOW";
    refreshAll();
    bindUIEvents();  // 二次确保绑定（render已调用事件绑定但也会再次执行）
    // 保证分类下拉框值一致
    const catSel = document.getElementById("categoryFilter");
    if (catSel) catSel.value = "ALL";
</script>
</body>
</html>
