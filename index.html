<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>游戏时长档案馆 · 黑白极简</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
            color: #111111;
            padding: 2rem 1rem;
            line-height: 1.4;
        }

        /* 主容器 — 干净窄栏 */
        .container {
            max-width: 880px;
            margin: 0 auto;
            background: #fff;
        }

        /* 头部区域：简洁标题 + 控制栏 */
        .header {
            border-bottom: 2px solid #000;
            padding-bottom: 1rem;
            margin-bottom: 1.8rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }

        .sub {
            font-size: 0.8rem;
            color: #444;
            margin-top: 0.25rem;
            border-left: 2px solid #aaa;
            padding-left: 0.6rem;
        }

        /* 控制栏：双行（flex wrap） */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1rem;
            margin: 1.5rem 0 1rem 0;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem;
            background: #f5f5f5;
            padding: 0.4rem 1rem 0.4rem 1rem;
            border-radius: 24px;
        }

        .filter-group label {
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #1a1a1a;
        }

        select, button {
            background: #fff;
            border: 1px solid #ccc;
            padding: 0.35rem 0.8rem;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.15s ease;
            color: #111;
        }

        select:hover, button:hover {
            border-color: #000;
            background-color: #fefefe;
        }

        button:active {
            background-color: #eaeaea;
        }

        .sort-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .stats-badge {
            background: #f0f0f0;
            padding: 0.3rem 1rem;
            border-radius: 32px;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: monospace;
            letter-spacing: 0.3px;
        }

        .stats-badge span {
            font-weight: 700;
            color: #000;
        }

        /* 游戏列表容器 */
        .game-list {
            margin-top: 1.8rem;
            border-top: 1px solid #eaeaea;
        }

        /* 每一行游戏条目：极简border + flex */
        .game-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 0.5rem;
            border-bottom: 1px solid #eaeaea;
            transition: background 0.1s;
        }

        .game-row:hover {
            background-color: #fafafa;
        }

        .game-name-area {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .game-name {
            font-size: 1rem;
            font-weight: 470;
            letter-spacing: -0.2px;
            word-break: break-word;
        }

        /* 分类小标签 — 极简灰 */
        .game-category {
            font-size: 0.65rem;
            background: #ececec;
            padding: 0.2rem 0.55rem;
            border-radius: 20px;
            color: #2c2c2c;
            text-transform: capitalize;
            font-family: monospace;
        }

        .right-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .game-hours {
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #111;
            background: #fff;
            padding: 0.2rem 0;
            min-width: 85px;
            text-align: right;
        }

        /* 备注按钮：极简符号 */
        .note-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 0.2rem;
            color: #4a4a4a;
            transition: color 0.1s;
            border-radius: 20px;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .note-btn:hover {
            color: #000;
            background: #e6e6e6;
            border: none;
        }

        /* 空状态 */
        .empty-message {
            text-align: center;
            padding: 3rem 1rem;
            color: #888;
            font-size: 0.9rem;
            border-bottom: 1px solid #eee;
        }

        /* 模态框 (备注二级弹窗) 极简黑白 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.65);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }

        .modal-card {
            background: #ffffff;
            max-width: 460px;
            width: 90%;
            border-radius: 16px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            border: 1px solid #eaeaea;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.3rem;
            border-bottom: 1px solid #ddd;
            font-weight: 500;
            background: #fff;
        }

        .modal-header h3 {
            font-size: 1rem;
            font-weight: 500;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            padding: 0 0.3rem;
            color: #333;
            border-radius: 40px;
        }

        .close-modal:hover {
            color: #000;
            background: #f0f0f0;
        }

        .modal-body {
            padding: 1.3rem;
            font-size: 0.85rem;
            line-height: 1.55;
            color: #1e1e1e;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 60vh;
            overflow-y: auto;
            background: #fff;
        }

        .modal-body p {
            margin: 0;
        }

        hr {
            margin: 1rem 0;
            border: 0;
            border-top: 1px solid #eaeaea;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: #aaa;
            border-top: 1px solid #eee;
            padding-top: 1.5rem;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem 0.8rem;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group {
                justify-content: space-between;
            }
            .sort-buttons {
                justify-content: flex-start;
            }
            .game-name {
                font-size: 0.9rem;
            }
            .game-hours {
                font-size: 0.8rem;
                min-width: 70px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>◼ 游戏时长·简录</h1>
        <div class="sub">所有时长基于原始秒数转换 · 单位：小时</div>
    </div>

    <!-- 控制栏：筛选/排序/统计 -->
    <div class="controls">
        <div class="filter-group">
            <label>分类筛选</label>
            <select id="categoryFilter">
                <option value="ALL">▸ 全部游戏</option>
            </select>
            <div class="stats-badge" id="totalDurationBadge">
                ⏱ 总时长 <span id="totalHours">0.0</span> h
            </div>
        </div>
        <div class="sort-buttons">
            <button id="sortHighToLow">↓ 时长 高 → 低</button>
            <button id="sortLowToHigh">↑ 时长 低 → 高</button>
            <button id="resetOrderBtn">⟳ 原始顺序</button>
        </div>
    </div>

    <!-- 游戏列表容器 -->
    <div class="game-list" id="gameListContainer">
        <!-- 动态渲染 -->
        <div class="empty-message">加载列表中...</div>
    </div>
    <footer>点击右侧「📋」查看备注详情 · 黑白极简档案</footer>
</div>

<!-- 备注模态框 (二级展开) -->
<div id="noteModal" class="modal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>📄 游戏备注</h3>
            <button class="close-modal" id="closeModalBtn">✕</button>
        </div>
        <div class="modal-body" id="modalNoteContent">
            <p>备注内容</p>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 原始数据 (基于CSV内容精确构建, 游玩时间单位:秒)
    // --------------------------------------------------------------
    const GAMES_DATA = [
        { name: "4399小游戏", category: "Other", note: "时长来源于游戏内部PC数和粗略计算总和：\n奥奇传说\n摩尔庄园\n美食大战老鼠\n弹弹堂\n森林冰火人\n疯狂小人战斗", platform: "PC (Windows)", playSeconds: 1080000, source: "Other" },

        { name: "Battlefield 5", category: "fps", note: "", platform: "PC (Windows)", playSeconds: 22380, source: "Steam" },
        { name: "Battlefield 6", category: "fps", note: "", platform: "PC (Windows)", playSeconds: 334620, source: "Steam" },
        { name: "CHUNITHM", category: "Music game", note: "国服991PC，RIN服508PC\n时长计算公式：pleynite自动统计RIN+国服PC*3*240（单位：秒）\nB50=O30+N20\n国服B50（中二节奏2026）：16.44（V段）\nRIN服B50（X-VERSE）：16.81（V段）\nB30：16.93", platform: "Arcade", playSeconds: 1398810, source: "Other" },
        { name: "Counter-Strike 2", category: "fps", note: "", platform: "PC (Windows)", playSeconds: 3545460, source: "Steam" },
        { name: "FreshWomen - Season 1", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 12360, source: "Steam" },
        { name: "FreshWomen - Season 2", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 15420, source: "Steam" },
        { name: "Goose Goose Duck", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 39240, source: "Steam" },
        { name: "MAI MAI", category: "Music game", note: "国服10PC\n时长计算公式：国服PC*3*240（单位：秒）\nDX评分=O35+N15：3369\n段位：无", platform: "Arcade", playSeconds: 7200, source: "Other" },
        { name: "Microsoft Solitaire Collection", category: "Card", note: "", platform: "PC (Windows)", playSeconds: 11580, source: "Xbox" },
        { name: "Minecraft Bedrock", category: "Open world", note: "", platform: "PC (Windows)", playSeconds: 526802, source: "Xbox" },
        { name: "Minecraft iOS", category: "Open world", note: "", platform: "Mobile（iOS）", playSeconds: 892080, source: "Xbox" },
        { name: "Phigros", category: "Music game", note: "时长计算公式：时长来源于TapTap，无PC数据\nRKS=P3+B27：14.92\n位次：76144\n课题模式段位：红49", platform: "Mobile（iOS）", playSeconds: 99720, source: "Other" },
        { name: "Project SEKAI", category: "Music game", note: "时长计算公式：时长随iOS统计每周日更新，无PC数据\n国服排位：白金2\n国服位次：6168", platform: "Mobile（iOS）", playSeconds: 58000, source: "Other" },
        { name: "PUBG: BATTLEGROUNDS", category: "fps", note: "", platform: "PC (Windows)", playSeconds: 1277100, source: "Steam" },
        { name: "Riptide GP: Renegade", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 0, source: "Steam" },
        { name: "Riptide GP2", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 92627, source: "Steam" },
        { name: "Wallpaper Engine：壁纸引擎", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 4740, source: "Steam" },
        { name: "Zuma Deluxe", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 16200, source: "Steam" },
        { name: "斗牌魂", category: "Card", note: "", platform: "PC (Windows)", playSeconds: 180601, source: "Steam" },
        { name: "节奏大师", category: "Music game", note: "老版本闯关188关，新版本70PC\n时长计算公式：240*2*188+240*新版本PC\n节奏战力=B50+N25：5.56", platform: "Mobile（iOS）", playSeconds: 107040, source: "Other" },
        { name: "决战！平安京", category: "MOBA", note: "190PC\n时长计算公式：PC*1800（单位：秒）", platform: "Mobile（iOS）", playSeconds: 342000, source: "Other" },
        { name: "狼人杀", category: "Card", note: "网杀108PC，面杀4h\n时长计算公式：PC*25*60+面杀时长", platform: "Mobile（iOS）", playSeconds: 176400, source: "Other" },
        { name: "球球大作战", category: "Other", note: "80PC\n时长计算公式：PC*600（单位：秒）", platform: "Mobile（iOS）", playSeconds: 48000, source: "Other" },
        { name: "雀魂麻将", category: "Card", note: "", platform: "PC (Windows)", playSeconds: 726713, source: "Steam" },
        { name: "三国杀", category: "Card", note: "", platform: "PC (Windows)", playSeconds: 2172240, source: "Steam" },
        { name: "三角洲行动", category: "fps", note: "", platform: "PC (Windows)", playSeconds: 1760880, source: "Steam" },
        { name: "生死狙击", category: "fps", note: "时长数据来源于游戏内官方统计", platform: "PC (Windows)", playSeconds: 709200, source: "Other" },
        { name: "双人成行", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 60, source: "Steam" },
        { name: "双影奇境", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 58860, source: "Steam" },
        { name: "糖豆人", category: "Other", note: "", platform: "PC (Windows)", playSeconds: 23873, source: "Epic" },
        { name: "天月麻雀", category: "Card", note: "", platform: "PC (Windows)", playSeconds: 44940, source: "Steam" },
        { name: "王者荣耀", category: "MOBA", note: "1865PC\n时长计算公式：PC*1800（单位：秒）\n王者印记：2", platform: "Mobile（iOS）", playSeconds: 3357000, source: "Other" },
        { name: "英雄联盟手游（台服）", category: "MOBA", note: "182PC\n时长计算公式：PC*1800（单位：秒）", platform: "Mobile（iOS）", playSeconds: 327600, source: "Other" }
    ];

    // ----- 辅助函数: 秒转小时 (保留1位小数)
    function secondsToHours(seconds) {
        let hours = seconds / 3600;
        return Math.round(hours * 10) / 10;
    }

    // 获取所有不同分类 (去重)
    function getAllCategories() {
        const cats = new Set();
        GAMES_DATA.forEach(game => cats.add(game.category));
        return Array.from(cats).sort();
    }

    // ----- 全局状态
    let currentCategory = "ALL";          // 筛选分类
    let currentSortMode = "DEFAULT";      // "DEFAULT", "HIGH_TO_LOW", "LOW_TO_HIGH"
    let originalOrder = [...GAMES_DATA];   // 原始顺序(不可变)

    // 获取当前筛选+排序后的游戏列表 (不改变原始数据)
    function getFilteredAndSortedGames() {
        // 1. 筛选分类
        let filtered = [...GAMES_DATA];
        if (currentCategory !== "ALL") {
            filtered = filtered.filter(game => game.category === currentCategory);
        }
        // 2. 排序
        if (currentSortMode === "HIGH_TO_LOW") {
            filtered.sort((a, b) => b.playSeconds - a.playSeconds);
        } else if (currentSortMode === "LOW_TO_HIGH") {
            filtered.sort((a, b) => a.playSeconds - b.playSeconds);
        } else if (currentSortMode === "DEFAULT") {
            // 维持原始顺序: 依据原数组索引 (稳定按原始索引)
            filtered.sort((a, b) => {
                const idxA = GAMES_DATA.findIndex(g => g.name === a.name && g.playSeconds === a.playSeconds);
                const idxB = GAMES_DATA.findIndex(g => g.name === b.name && g.playSeconds === b.playSeconds);
                return idxA - idxB;
            });
        }
        return filtered;
    }

    // 计算当前列表(经过筛选)的总时长(小时)
    function getTotalHoursForFiltered() {
        let filtered = [...GAMES_DATA];
        if (currentCategory !== "ALL") {
            filtered = filtered.filter(game => game.category === currentCategory);
        }
        const totalSeconds = filtered.reduce((sum, game) => sum + game.playSeconds, 0);
        return secondsToHours(totalSeconds);
    }

    // 刷新分类下拉框选项 (动态)
    function populateCategorySelect() {
        const selectEl = document.getElementById("categoryFilter");
        if (!selectEl) return;
        const categories = getAllCategories();
        let options = '<option value="ALL">▸ 全部游戏</option>';
        categories.forEach(cat => {
            const selectedAttr = (currentCategory === cat) ? 'selected' : '';
            options += `<option value="${escapeHtml(cat)}" ${selectedAttr}>${escapeHtml(cat)}</option>`;
        });
        selectEl.innerHTML = options;
    }

    // 简易防XSS
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 渲染游戏列表 (核心)
    function renderGameList() {
        const container = document.getElementById("gameListContainer");
        if (!container) return;
        const gamesToRender = getFilteredAndSortedGames();
        
        if (gamesToRender.length === 0) {
            container.innerHTML = '<div class="empty-message">⚡ 暂无游戏 · 换个分类试试</div>';
            document.getElementById("totalHours").innerText = "0.0";
            return;
        }
        
        // 计算并更新当前总时长 (符合分类总时长)
        const totalHrs = getTotalHoursForFiltered();
        document.getElementById("totalHours").innerText = totalHrs.toFixed(1);
        
        // 生成每一行
        let html = '';
        for (let game of gamesToRender) {
            const hoursVal = secondsToHours(game.playSeconds);
            const displayHours = hoursVal.toFixed(1);
            const categoryLabel = escapeHtml(game.category);
            const gameNameEscaped = escapeHtml(game.name);
            // 处理备注：如果没有备注则展示 "无额外备注"
            const noteContent = game.note && game.note.trim() !== "" ? game.note : "（无备注信息）";
            // data属性存储备注文本 (用于模态框)
            // 注意: 使用自定义属性方便传递给弹窗，但为了安全使用转义后的内容但保留换行: 存储原始note 但后面通过JS获取对象数据更可靠。
            // 我们通过游戏名称索引存储备注? 最好的方法: 渲染时绑定点击事件，根据游戏名或唯一索引查找原始game对象。因为存在同名可能性极低，可靠。
            // 为了方便，给行一个 data-game-idx 但是gamesToRender 里是动态顺序，但游戏名称唯一性高，我们直接用名称查找。
            html += `
                <div class="game-row" data-game-name="${escapeHtml(game.name)}">
                    <div class="game-name-area">
                        <span class="game-name">${gameNameEscaped}</span>
                        <span class="game-category">${categoryLabel}</span>
                    </div>
                    <div class="right-section">
                        <span class="game-hours">${displayHours} h</span>
                        <button class="note-btn" data-note-game="${escapeHtml(game.name)}" title="查看备注">📋</button>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        
        // 绑定备注按钮事件 (委托或直接绑定，因为重新渲染后需重新绑定)
        const noteBtns = document.querySelectorAll('.note-btn');
        noteBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const gameNameAttr = btn.getAttribute('data-note-game');
                if (gameNameAttr) {
                    // 根据游戏名在原始数据中查找 (确保拿到完整备注)
                    const targetGame = GAMES_DATA.find(g => g.name === gameNameAttr);
                    if (targetGame) {
                        let finalNote = targetGame.note && targetGame.note.trim() !== "" ? targetGame.note : "（该游戏暂无备注）";
                        // 附加额外信息（平台可选显示，但极简只展示备注内容）
                        if (targetGame.platform) {
                            finalNote = `🎮 平台：${targetGame.platform}\n\n📝 备注详情：\n${finalNote}`;
                        } else {
                            finalNote = `📝 备注详情：\n${finalNote}`;
                        }
                        showModal(finalNote);
                    } else {
                        showModal("无法找到备注信息");
                    }
                }
            });
        });
    }
    
    // 模态框显示 (二级点开)
    const modal = document.getElementById("noteModal");
    const modalContent = document.getElementById("modalNoteContent");
    function showModal(contentText) {
        if (!modal || !modalContent) return;
        // 保留换行格式
        modalContent.innerHTML = `<p style="white-space: pre-wrap; font-family: monospace;">${escapeHtml(contentText)}</p>`;
        modal.style.display = "flex";
    }
    function closeModal() {
        if (modal) modal.style.display = "none";
    }
    
    // 事件绑定 & 初始化
    function bindUIEvents() {
        const categorySelect = document.getElementById("categoryFilter");
        const sortHighBtn = document.getElementById("sortHighToLow");
        const sortLowBtn = document.getElementById("sortLowToHigh");
        const resetBtn = document.getElementById("resetOrderBtn");
        
        if (categorySelect) {
            categorySelect.addEventListener("change", (e) => {
                currentCategory = e.target.value;
                // 切换分类时，保持排序模式不变 (如果之前排序模式保留，但对用户体验友好)
                // 重新渲染
                renderGameList();
                // 更新总时长已自动刷新
                // 注意保持下拉框选中状态在重绘后不会丢失，但render不改变下拉框value因为DOM没有重置categorySelect的选择，外部改变没问题
                // 但如果我们重新填充了分类下拉可能会导致事件重新绑定，目前无需重新填充选项，但其他操作如排序可能改变select选中? 不会
                // 但确保当前选中的值与currentCategory同步
                if (categorySelect.value !== currentCategory) categorySelect.value = currentCategory;
            });
        }
        
        if (sortHighBtn) {
            sortHighBtn.addEventListener("click", () => {
                currentSortMode = "HIGH_TO_LOW";
                renderGameList();
            });
        }
        if (sortLowBtn) {
            sortLowBtn.addEventListener("click", () => {
                currentSortMode = "LOW_TO_HIGH";
                renderGameList();
            });
        }
        if (resetBtn) {
            resetBtn.addEventListener("click", () => {
                currentSortMode = "DEFAULT";
                renderGameList();
            });
        }
        
        // 模态关闭
        const closeBtn = document.getElementById("closeModalBtn");
        if (closeBtn) closeBtn.addEventListener("click", closeModal);
        modal?.addEventListener("click", (e) => {
            if (e.target === modal) closeModal();
        });
        // ESC关闭
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && modal && modal.style.display === "flex") {
                closeModal();
            }
        });
    }
    
    // 启动时初始化分类下拉，渲染
    function init() {
        populateCategorySelect();
        bindUIEvents();
        // 初始默认原始顺序
        currentSortMode = "DEFAULT";
        currentCategory = "ALL";
        renderGameList();
        // 确保下拉框同步
        const catSel = document.getElementById("categoryFilter");
        if (catSel) catSel.value = "ALL";
    }
    
    init();
</script>
</body>
</html>
