let mode='source',selected='ALL',videoType='动画',videoNewFirst=true,gameSort='hours-desc';
function hours(s){return Math.round(s/360)/10}
function palette(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))%360;return [`hsl(${h} 36% 32%)`,`hsl(${(h+48)%360} 28% 13%)`]}
function searchThumb(name){return `https://tse1.mm.bing.net/th?q=${encodeURIComponent(name+' game official key visual')}&w=1000&h=560&c=7&rs=1&p=0&dpr=1&pid=1.7`}
function videoThumb(name){const VIDEO_THUMB_QUERY={'长城':'The Great Wall 2016 Zhang Yimou Matt Damon Jing Tian Chinese fantasy action movie official poster','秒速五厘米':'5 Centimeters per Second 2007 Makoto Shinkai anime film official Japanese poster','缘之空':'Yosuga no Sora 2010 anime official key visual'};const q=VIDEO_THUMB_QUERY[name]||(name==='DARLING in the FRANXX'?'DARLING in the FRANXX Zero Two 02 anime key visual poster':name+' poster');return `https://tse1.mm.bing.net/th?q=${encodeURIComponent(q)}&w=1000&h=560&c=7&rs=1&p=0&dpr=1&pid=1.7`}
function imageOf(g){return g.cover||searchThumb(g.name)}
function frontOf(g){return g.poster||g.icon||imageOf(g)}
function sourceValues(){const order=['Steam','Epic','Xbox','Other'];return ['ALL',...order.filter(v=>GAMES.some(g=>g.source===v)),'DEVICE']}
function categoryValues(){const values=[...new Set(GAMES.map(g=>g.category).filter(Boolean))];const sum=v=>GAMES.filter(g=>g.category===v).reduce((s,g)=>s+g.playSeconds,0);values.sort((a,b)=>sum(b)-sum(a));return ['ALL',...values,'DEVICE']}
function currentValues(){return mode==='source'?sourceValues():categoryValues()}
function label(v){if(v==='ALL')return'全部';if(v==='DEVICE')return'游戏设备';return mode==='category'?(categoryLabels[v]||v):v}
function selectionList(v){if(v==='DEVICE')return[];const list=GAMES.filter(g=>v==='ALL'||(mode==='source'?g.source:g.category)===v);const cmp={
'hours-desc':(a,b)=>b.playSeconds-a.playSeconds,
'hours-asc':(a,b)=>a.playSeconds-b.playSeconds,
'heat-desc':(a,b)=>{const A=onlineOf(a.name),B=onlineOf(b.name),am=A.kind==='na',bm=B.kind==='na';if(am!==bm)return am?1:-1;return (B.sort||0)-(A.sort||0)||b.playSeconds-a.playSeconds},
'heat-asc':(a,b)=>{const A=onlineOf(a.name),B=onlineOf(b.name),am=A.kind==='na',bm=B.kind==='na';if(am!==bm)return am?1:-1;return (A.sort||0)-(B.sort||0)||b.playSeconds-a.playSeconds}
}[gameSort];return list.sort(cmp||((a,b)=>b.playSeconds-a.playSeconds))}
function selectorImage(v){if(mode==='source')return (sourceCards[v]||sourceCards.Other).image;return categoryImages[v]||categoryImages.Other}
function renderSelectors(){const host=document.querySelector('#selectorStrip');host.innerHTML='';for(const v of currentValues()){const list=selectionList(v),sum=list.reduce((a,b)=>a+b.playSeconds,0),week=list.reduce((a,b)=>a+(b.weekSeconds||0),0);const b=document.createElement('button');b.className='selector-card'+(selected===v?' active':'');const img=selectorImage(v);b.style.setProperty('--bgimg',img?`url("${img}")`:'none');b.innerHTML=`<div class="sel-content"><b>${label(v)}</b><small>${v==='DEVICE'?`${devices.length} \u53f0\u8bbe\u5907`:`${list.length} \u6b3e \u00b7 ${hours(sum)} h \u00b7 <span class="selector-week">7\u65e5 ${hours(week)} h</span>`}</small></div>`;b.onclick=()=>{selected=v;renderAll()};host.appendChild(b)}}
function activityOf(name){return ACTIVITY[name]||{value:'—',kind:'na',label:'暂无公开实时值',detail:'暂无可直接观测的实时人数',sort:0}}
function estimateOf(name){return Object.prototype.hasOwnProperty.call(ESTIMATE,name)?ESTIMATE[name]:null}
function onlineOf(name){
  if(name==='各种小游戏')return {value:'—',kind:'na',label:'多游戏合集',detail:'由大量不同作品构成，无法定义统一在线人数。',sort:0,confidence:''};
  const a=activityOf(name),e=estimateOf(name);
  if(a.kind==='live')return {value:a.value,kind:'exact',label:a.label||'实时数据',detail:a.detail||'',sort:a.sort||0,confidence:'精确'};
  if(name==='斗牌魂'&&e&&e.sort===0)return {value:e.value,kind:'exact',label:'已停服',detail:e.detail||'',sort:0,confidence:'精确'};
  if(e){const high=e.confidence==='高'||e.confidence==='中高';return {value:e.value,kind:high?'precise':'model',label:e.label||'综合预估',detail:e.detail||'',sort:e.sort||0,confidence:e.confidence||''};}
  if(a.kind==='estimate')return {value:a.value,kind:'model',label:a.label||'计算预估',detail:a.detail||'',sort:a.sort||0,confidence:'低'};
  return {value:'—',kind:'na',label:'暂无可信口径',detail:'暂无足够数据形成可信在线人数估算。',sort:0,confidence:''};
}
function gameCard(g,max){const [c1,c2]=palette(g.name),cat=categoryLabels[g.category]||g.category,o=onlineOf(g.name);const el=document.createElement('article');el.className='media-card';el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-label','查看 '+g.name+' 详情');el.style.setProperty('--c1',c1);el.style.setProperty('--c2',c2);const bg=imageOf(g),front=frontOf(g),frontClass=g.posterType==='square'||(!g.poster&&g.icon)?' square':'';const icon=g.icon&&g.icon!==front?`<img class="game-icon" src="${g.icon}" alt="" loading="lazy">`:'';
const onlineRow=`<div class="online-row ${o.kind}"><span class="online-dot"></span><span class="online-value">${o.value}</span><span class="online-label">${o.label}</span></div>`;
el.innerHTML=`<div class="art game-art"><div class="art-fallback">${g.name}</div><img class="game-bg" src="${bg}" alt="" loading="lazy" onerror="this.style.display='none'"><img class="game-poster${frontClass}" src="${front}" alt="" loading="lazy" onerror="this.style.display='none'">${icon}</div><div class="card-body"><div class="name">${g.name}</div><div class="sub">${cat} · ${g.platform}</div>${onlineRow}<div class="bottomline"><div class="hours">${hours(g.playSeconds)} h</div><div class="src">${g.source}</div></div><div class="progress"><i style="width:${Math.max(1.5,g.playSeconds/max*100)}%"></i></div></div>`;el.addEventListener('click',()=>openGameModal(g));el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openGameModal(g)}});return el}
function renderDevices(){const host=document.querySelector('#gameLibrary');host.innerHTML='';devices.forEach(d=>{const el=document.createElement('article');el.className='media-card device-card';el.style.setProperty('--dc1',d.c1);el.style.setProperty('--dc2',d.c2);const visual=d.image?`<img src="${d.image}" alt="" loading="lazy">`:`<div class="device-visual">${d.badge}</div>`;el.innerHTML=`<div class="art">${visual}<span class="device-badge">${d.badge}</span></div><div class="card-body"><div class="name">${d.name}</div><div class="sub">${d.detail}</div><div class="device-spec">${d.spec}</div><div class="bottomline"><div class="hours">${d.platform}</div><div class="src">游戏设备</div></div></div>`;host.appendChild(el)})}
function updateSortButtons(disabled=false){const h=document.querySelector('#sortHours'),w=document.querySelector('#sortWeek');[h,w].filter(Boolean).forEach(x=>x.disabled=disabled);if(disabled){[h,w].filter(Boolean).forEach(x=>x.classList.remove('active'));return}const [kind,dir]=String(gameSort||'hours-desc').split('-');if(h){h.classList.toggle('active',kind==='hours');h.textContent='\u603b\u65f6\u957f '+(kind==='hours'?(dir==='desc'?'\u2193':'\u2191'):'\u2193')}if(w){w.classList.toggle('active',kind==='week');w.textContent='\u8fd17\u65e5 '+(kind==='week'?(dir==='desc'?'\u2193':'\u2191'):'\u2193')}}
function renderGames(){const host=document.querySelector('#gameLibrary');if(selected==='DEVICE'){document.querySelector('#libraryTitle').textContent='\u6e38\u620f\u8bbe\u5907';document.querySelector('#libraryMeta').textContent=devices.length+' \u53f0';updateSortButtons(true);renderDevices();return}updateSortButtons(false);const list=selectionList(selected),total=list.reduce((a,b)=>a+b.playSeconds,0),week=list.reduce((a,b)=>a+(b.weekSeconds||0),0);document.querySelector('#libraryTitle').textContent=selected==='ALL'?'\u5168\u90e8\u6e38\u620f':label(selected);const sortNames={'hours-desc':'\u603b\u65f6\u957f\u4ece\u9ad8\u5230\u4f4e','hours-asc':'\u603b\u65f6\u957f\u4ece\u4f4e\u5230\u9ad8','week-desc':'\u8fd17\u65e5\u4ece\u9ad8\u5230\u4f4e','week-asc':'\u8fd17\u65e5\u4ece\u4f4e\u5230\u9ad8'};document.querySelector('#libraryMeta').textContent=list.length+' \u6b3e \u00b7 \u603b '+hours(total)+' h \u00b7 \u8fd17\u65e5 '+hours(week)+' h \u00b7 '+(sortNames[gameSort]||sortNames['hours-desc']);host.innerHTML='';if(!list.length){host.innerHTML='<div class="empty">\u6682\u65e0\u5185\u5bb9</div>';return}const max=Math.max(...GAMES.map(g=>g.playSeconds));list.forEach(g=>host.appendChild(gameCard(g,max)))}
function renderAll(){renderSelectors();renderGames()}

<script id="ymkf-library-return-position">
(function(){
  const KEY='ymkfLibraryReturnState',PENDING='ymkfLibraryReturnPending';
  function readState(){try{return JSON.parse(sessionStorage.getItem(KEY)||'null')}catch(_){return null}}
  function closeModalSnapshot(){
    try{
      document.querySelectorAll('.game-modal.open').forEach(function(m){m.classList.remove('open')});
      document.body.style.overflow='';
    }catch(_){ }
  }
  function writeState(){
    try{
      const state={
        mode:(typeof mode!=='undefined'?mode:null),
        selected:(typeof selected!=='undefined'?selected:null),
        gameSort:(typeof gameSort!=='undefined'?gameSort:null),
        detailFilter:(document.querySelector('#detailFilter')||{}).value||'all',
        scrollY:Number(window.scrollY||0)
      };
      sessionStorage.setItem(KEY,JSON.stringify(state));
      sessionStorage.setItem(PENDING,'1');
    }catch(_){ }
  }
  document.addEventListener('click',function(e){
    const a=e.target.closest&&e.target.closest('a.detail-record-btn[href]');
    if(a)writeState();
  });
  function restore(){
    try{
      if(sessionStorage.getItem(PENDING)!=='1')return;
      const s=readState();if(!s)return;
      closeModalSnapshot();
      if(s.mode!=null&&typeof mode!=='undefined')mode=s.mode;
      if(s.selected!=null&&typeof selected!=='undefined')selected=s.selected;
      if(s.gameSort!=null&&typeof gameSort!=='undefined')gameSort=s.gameSort;
      document.querySelectorAll('[data-mode]').forEach(function(b){b.classList.toggle('active',b.dataset.mode===s.mode)});
      const filter=document.querySelector('#detailFilter');
      if(filter&&s.detailFilter){filter.value=s.detailFilter;filter.dispatchEvent(new Event('change',{bubbles:true}))}
      if(typeof renderAll==='function')renderAll();
      closeModalSnapshot();
      const y=Number(s.scrollY||0),scroll=function(){window.scrollTo(0,isFinite(y)?y:0)};
      requestAnimationFrame(function(){requestAnimationFrame(function(){closeModalSnapshot();scroll()})});
      setTimeout(function(){closeModalSnapshot();scroll()},140);setTimeout(scroll,380);
      setTimeout(function(){sessionStorage.removeItem(PENDING);sessionStorage.removeItem(KEY)},900);
    }catch(_){ }
  }
  window.addEventListener('pageshow',restore);
})();

<script id="ymkf-detail-note-only-v1" data-build="1.15.0-hf12">
(function(){

  function cleanRetiredUi(){
    ['sortHeat','sortSteamHeat'].forEach(id=>{const el=document.getElementById(id);if(el)el.remove()});

    if(typeof gameSort!=='undefined'&&String(gameSort).toLowerCase().includes('heat'))gameSort='hours-desc';

  cleanRetiredUi();

  let ymkfDetailFilter='all';

    sortPair.insertAdjacentElement('afterend',wrap);

    select.value=ymkfDetailFilter;
    select.addEventListener('change',()=>{ymkfDetailFilter=select.value;renderGames()});
    return select;
  }
  function ymkfApplyDetailFilter(list){
    const mode=(ymkfEnsureDetailFilter()||{}).value||ymkfDetailFilter||'all';
    if(mode==='with')return list.filter(g=>!!gameDetailUrl(g));
    if(mode==='without')return list.filter(g=>!gameDetailUrl(g));
    return list;
  }

  selectionList=function(v){
    if(v==='DEVICE')return[];
    const list=GAMES.filter(g=>v==='ALL'||(mode==='source'?g.source:g.category)===v);

      'hours-desc':(a,b)=>(b.playSeconds||0)-(a.playSeconds||0),
