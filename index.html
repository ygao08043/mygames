<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的游戏数据站</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: "Segoe UI","PingFang SC",sans-serif;
    background:
        radial-gradient(circle at top left,#312e81 0%,transparent 30%),
        radial-gradient(circle at top right,#7c3aed 0%,transparent 25%),
        linear-gradient(180deg,#0f172a 0%,#020617 100%);
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 950px;
    margin: auto;
}

.header {
    margin-bottom: 28px;
}

.title {
    font-size: 2.4rem;
    font-weight: 800;
}

.subtitle {
    color: #94a3b8;
    margin-top: 8px;
}

.controls {
    position: sticky;
    top: 10px;
    z-index: 100;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px;
    margin-bottom: 24px;
    border-radius: 22px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(14px);
}

select {
    background: rgba(15,23,42,0.9);
    color: white;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.95rem;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap: 14px;
    margin-bottom: 28px;
}

.stat {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    padding: 18px;
    backdrop-filter: blur(10px);
}

.stat-label {
    color: #94a3b8;
    font-size: 0.9rem;
}

.stat-value {
    margin-top: 8px;
    font-size: 1.45rem;
    font-weight: bold;
}

.games {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.card {
    overflow: hidden;
    border-radius: 24px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(16px);
    transition: 0.25s ease;
}

.card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.18);
}

.banner {
    height: 10px;
    background: linear-gradient(90deg,#38bdf8,#8b5cf6,#ec4899);
}

.content {
    padding: 20px;
}

.top {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
}

.name {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 10px;
}

.tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.tag {
    background: rgba(255,255,255,0.08);
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    color: #cbd5e1;
}

.time {
    text-align: right;
}

.time-main {
    font-size: 1.5rem;
    font-weight: bold;
}

.time-sub {
    margin-top: 6px;
    font-size: 0.82rem;
    color: #94a3b8;
}

.remark {
    margin-top: 16px;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(0,0,0,0.2);
}

.remark-btn {
    width: 100%;
    border: none;
    background: transparent;
    color: white;
    text-align: left;
    padding: 14px 16px;
    cursor: pointer;
    font-size: 0.92rem;
}

.remark-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
    padding: 0 16px;
    color: #cbd5e1;
    line-height: 1.7;
    white-space: pre-wrap;
}

.remark-content.open {
    max-height: 1200px;
    padding-bottom: 16px;
}

@media (max-width:700px) {
    .time {
        text-align: left;
    }

    .title {
        font-size: 1.9rem;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="title">🎮 我的游戏数据站</div>
<div class="subtitle">完整导入 CSV 数据 · 支持筛选 / 排序 / 备注展开</div>
</div>

<div class="controls">
<select id="categoryFilter">
<option value="all">全部分类</option>
</select>

<select id="platformFilter">
<option value="all">全部平台</option>
</select>

<select id="sortSelect">
<option value="desc">时长从高到低</option>
<option value="asc">时长从低到高</option>
</select>
</div>

<div class="stats">
<div class="stat">
<div class="stat-label">游戏总数</div>
<div class="stat-value" id="totalGames"></div>
</div>

<div class="stat">
<div class="stat-label">总游玩时长</div>
<div class="stat-value" id="totalTime"></div>
</div>

<div class="stat">
<div class="stat-label">当前显示</div>
<div class="stat-value" id="visibleGames"></div>
</div>

<div class="stat">
<div class="stat-label">当前显示游戏时长</div>
<div class="stat-value" id="visibleTime"></div>
</div>
</div>

<div class="games" id="games"></div>

</div>

 "分类": "Other", "备注": "", "平台": "PC (Windows)", "游玩时间": 60, "来源": "Steam"}, {"名称": "双影奇境", "分类": "Other", "备注": "", "平台": "PC (Windows)", "游玩时间": 58860, "来源": "Steam"}, {"名称": "糖豆人", "分类": "Other", "备注": "", "平台": "PC (Windows)", "游玩时间": 23873, "来源": "Epic"}, {"名称": "天月麻雀", "分类": "Card", "备注": "", "平台": "PC (Windows)", "游玩时间": 44940, "来源": "Steam"}, {"名称": "王者荣耀", "分类": "MOBA", "备注": "1865PC\r\n时长计算公式：PC*1800（单位：秒）\r\n王者印记：2", "平台": "Mobile（iOS）", "游玩时间": 3357000, "来源": "Other"}, {"名称": "英雄联盟手游（台服）", "分类": "MOBA", "备注": "182PC\r\n时长计算公式：PC*1800（单位：秒）", "平台": "Mobile（iOS）", "游玩时间": 327600, "来源": "Other"}];

function formatTime(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);

    if (h <= 0) {
        return `${m}分钟`;
    }

    return `${h}小时 ${m}分钟`;
}

function initFilters() {
    const categorySet = [...new Set(games.map(g => g["分类"]))];
    const platformSet = [...new Set(games.map(g => g["平台"]))];

    const categoryFilter = document.getElementById("categoryFilter");
    const platformFilter = document.getElementById("platformFilter");

    categorySet.forEach(c => {
        const op = document.createElement("option");
        op.value = c;
        op.textContent = c;
        categoryFilter.appendChild(op);
    });

    platformSet.forEach(p => {
        const op = document.createElement("option");
        op.value = p;
        op.textContent = p;
        platformFilter.appendChild(op);
    });
}

function render() {

    const category = document.getElementById("categoryFilter").value;
    const platform = document.getElementById("platformFilter").value;
    const sort = document.getElementById("sortSelect").value;

    let filtered = [...games];

    if (category !== "all") {
        filtered = filtered.filter(g => g["分类"] === category);
    }

    if (platform !== "all") {
        filtered = filtered.filter(g => g["平台"] === platform);
    }

    filtered.sort((a,b) => {
        return sort === "desc"
            ? b["游玩时间"] - a["游玩时间"]
            : a["游玩时间"] - b["游玩时间"];
    });

    document.getElementById("totalGames").textContent = games.length;
    document.getElementById("visibleGames").textContent = filtered.length;

    const totalTime = games.reduce((sum,g)=>sum + Number(g["游玩时间"] || 0),0);
    const visibleTime = filtered.reduce((sum,g)=>sum + Number(g["游玩时间"] || 0),0);

    document.getElementById("totalTime").textContent = formatTime(totalTime);
    document.getElementById("visibleTime").textContent = formatTime(visibleTime);

    const container = document.getElementById("games");
    container.innerHTML = "";

    filtered.forEach((game,index)=>{

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
        <div class="banner"></div>

        <div class="content">

            <div class="top">

                <div>

                    <div class="name">${game["名称"]}</div>

                    <div class="tags">
                        <div class="tag">${game["分类"]}</div>
                        <div class="tag">${game["平台"]}</div>
                        <div class="tag">${game["来源"]}</div>
                    </div>

                </div>

                <div class="time">
                    <div class="time-main">${formatTime(Number(game["游玩时间"]))}</div>
                    <div class="time-sub">${Number(game["游玩时间"]).toLocaleString()} 秒</div>
                </div>

            </div>

            ${game["备注"] ? `
            <div class="remark">
                <button class="remark-btn" onclick="toggleRemark(${index})">
                    查看备注 ▼
                </button>

                <div class="remark-content" id="remark-${index}">
                    ${game["备注"]}
                </div>
            </div>
            ` : ""}

        </div>
        `;

        container.appendChild(card);

    });

}

function toggleRemark(index) {
    document.getElementById(`remark-${index}`).classList.toggle("open");
}

document.getElementById("categoryFilter").addEventListener("change", render);
document.getElementById("platformFilter").addEventListener("change", render);
document.getElementById("sortSelect").addEventListener("change", render);

initFilters();
render();

</script>

</body>
</html>
