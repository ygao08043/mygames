<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUBG 武器数据 · YMKF</title>
<style>
:root{color-scheme:dark;--bg:#0a0d12;--panel:#121721;--panel2:#181f2b;--line:#2a3443;--text:#edf2f7;--muted:#95a0af;--accent:#f2c94c;--ok:#70d6a3}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080b10,#101620);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:26px 0 50px}.back{display:inline-flex;text-decoration:none;color:var(--muted);margin-bottom:18px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;padding:24px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#151a23,#22200f)}h1{font-size:30px;line-height:1.1;margin:0 0 8px}.sub{color:var(--muted)}.pill{display:inline-flex;border:1px solid var(--line);background:#10151e;color:var(--muted);border-radius:999px;padding:5px 10px}.pill.ok{color:var(--ok);border-color:#2e6a50}.status{margin-top:14px}.section{margin-top:20px}.note{background:#141820;border-left:3px solid var(--accent);padding:12px 14px;border-radius:8px;color:#c8ced7}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--muted);font-weight:650;background:var(--panel2);position:sticky;top:0;z-index:1}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#161d28}.weapon{font-weight:700;font-size:15px}.sortBtn{appearance:none;border:0;background:none;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:5px}.sortBtn:hover{color:var(--text)}.sortMark{display:inline-block;min-width:12px;color:var(--accent)}.empty{padding:30px!important;color:var(--muted);text-align:center!important}.footer{margin-top:22px;color:var(--muted);font-size:12px}
@media(max-width:700px){.hero{align-items:flex-start;flex-direction:column}h1{font-size:25px}.wrap{width:min(100% - 18px,1080px)}}
</style>
<!-- YMKF site icon hf26 -->
<link rel="icon" type="image/svg+xml" href="../assets/playnite/site-icon.svg">
<link rel="shortcut icon" href="../assets/playnite/site-icon.svg">
<link rel="apple-touch-icon" href="../assets/playnite/site-icon.svg">
<link rel="manifest" href="../assets/playnite/site.webmanifest">
<meta name="theme-color" content="#10131d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YMKF">
<!-- /YMKF site icon hf26 -->
</head>
<body>
<main class="wrap">
<a class="back" href="../index.html">← 返回游戏库</a>
<section class="hero">
  <div>
    <h1>PUBG: BATTLEGROUNDS</h1>
    <div id="playerName" class="sub">PIANOYMKF · 官方 Weapon Mastery</div>
    <div class="status"><span id="bindPill" class="pill">读取中</span></div>
  </div>
  <div class="sub">仅显示仍可读取的武器历史数据</div>
</section>
<div id="notice"></div>
<section class="section">
  <div class="tableWrap">
    <table>
      <thead><tr>
        <th>武器</th>
        <th><button class="sortBtn" data-sort="level">武器等级 <span class="sortMark"></span></button></th>
        <th><button class="sortBtn" data-sort="kills">总击杀 <span class="sortMark"></span></button></th>
        <th><button class="sortBtn" data-sort="roundMostKills">单场最高 <span class="sortMark"></span></button></th>
        <th><button class="sortBtn" data-sort="longestKill">最远击杀距离 <span class="sortMark"></span></button></th>
      </tr></thead>
      <tbody id="weaponBody"></tbody>
    </table>
  </div>
</section>
<section class="section"><div class="note">数据只读取 PUBG 官方 Weapon Mastery。总战绩、模式统计、最近比赛和逐局历史均不再显示。Weapon Mastery 在 18.2 更新时发生过统计重置/拆分，本页会兼容可用的旧 StatsTotal 与之后的官方/竞技统计桶。</div></section>
<div class="footer">Build v1.16.12</div>
</main>
<script>
const DATA='../data/pubg.json?v=1.16.8';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>Number.isFinite(Number(v))?Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2}):'—';
const dist=m=>Number(m)>0?`${Number(m).toFixed(Number(m)>=100?0:1)} m`:'—';
let D=null;
let sortKey='level';
let sortDir='desc';

function renderSortMarks(){
  document.querySelectorAll('.sortBtn').forEach(b=>{
    const mark=b.querySelector('.sortMark');
    mark.textContent=b.dataset.sort===sortKey?(sortDir==='desc'?'▼':'▲'):'↕';
  });
}
function renderWeapons(){
  const rows=Array.isArray(D?.weapons)?[...D.weapons]:[];
  rows.sort((a,b)=>{
    const av=Number(a?.[sortKey]||0),bv=Number(b?.[sortKey]||0);
    if(av!==bv)return sortDir==='desc'?bv-av:av-bv;
    return String(a?.name||'').localeCompare(String(b?.name||''),'zh-CN');
  });
  $('#weaponBody').innerHTML=rows.length?rows.map(w=>`<tr>
    <td class="weapon">${esc(w.name||w.id||'—')}</td>
    <td>${fmt(w.level)}</td>
    <td>${fmt(w.kills)}</td>
    <td>${fmt(w.roundMostKills)}</td>
    <td>${dist(w.longestKill)}</td>
  </tr>`).join(''):'<tr><td colspan="5" class="empty">官方 API 当前没有返回可用的武器统计。</td></tr>';
  renderSortMarks();
}
function render(x){
  D=x;
  const bound=!!D.binding?.bound;
  $('#playerName').textContent=(D.profile?.name||'PIANOYMKF')+' · 官方 Weapon Mastery';
  const pill=$('#bindPill');
  pill.textContent=bound?'PUBG 官方 API 已绑定':'PUBG 官方 API 未绑定';
  pill.classList.toggle('ok',bound);
  if(!bound)$('#notice').innerHTML='<div class="note" style="margin-top:16px">尚未绑定。请在本机运行 <b>BIND_PUBG.cmd</b>。</div>';
  else if(D.status==='cached')$('#notice').innerHTML='<div class="note" style="margin-top:16px">本次官方 API 刷新失败，当前显示上一次成功缓存的武器数据。</div>';
  else if(D.status==='bound_no_cache')$('#notice').innerHTML='<div class="note" style="margin-top:16px">账号已绑定，但 Weapon Mastery 尚未成功取得。</div>';
  renderWeapons();
}
document.querySelectorAll('.sortBtn').forEach(b=>b.addEventListener('click',()=>{
  const key=b.dataset.sort;
  if(sortKey===key)sortDir=sortDir==='desc'?'asc':'desc';
  else{sortKey=key;sortDir='desc'}
  renderWeapons();
}));
fetch(DATA,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(render).catch(e=>{$('#notice').innerHTML=`<div class="note" style="margin-top:16px">PUBG 数据尚未生成：${esc(e.message)}</div>`});
</script>
</body>
</html>
