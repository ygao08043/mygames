<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUBG 生涯数据 · YMKF</title>
<style>
:root{color-scheme:dark;--bg:#0a0d12;--panel:#121721;--panel2:#181f2b;--line:#2a3443;--text:#edf2f7;--muted:#95a0af;--accent:#f2c94c;--ok:#70d6a3}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080b10,#101620);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}a{color:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:26px 0 50px}.back{display:inline-flex;text-decoration:none;color:var(--muted);margin-bottom:18px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;padding:24px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#151a23,#22200f)}h1{font-size:30px;line-height:1.1;margin:0 0 8px}.sub{color:var(--muted)}.pill{display:inline-flex;border:1px solid var(--line);background:#10151e;color:var(--muted);border-radius:999px;padding:5px 10px}.pill.ok{color:var(--ok);border-color:#2e6a50}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}.label{color:var(--muted);font-size:12px}.value{font-size:22px;font-weight:750;margin-top:4px;word-break:break-word}.section{margin-top:24px}.section h2{font-size:18px;margin:0 0 10px}.note{background:#141820;border-left:3px solid var(--accent);padding:12px 14px;border-radius:8px;color:#c8ced7}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:940px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--muted);font-weight:650;background:var(--panel2);position:sticky;top:0}tbody tr:last-child td{border-bottom:0}.status{margin-top:14px}.empty{padding:24px;color:var(--muted);text-align:center}.footer{margin-top:22px;color:var(--muted);font-size:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.wrap{width:min(100% - 18px,1180px)}.grid{grid-template-columns:1fr 1fr}.card{padding:12px}.value{font-size:18px}h1{font-size:25px}}
</style>
<!-- YMKF site icon hf26 -->
<link rel="icon" type="image/svg+xml" href="../assets/playnite/site-icon.svg">
<link rel="shortcut icon" href="../assets/playnite/site-icon.svg">
<link rel="apple-touch-icon" href="../assets/playnite/site-icon.svg">
<link rel="manifest" href="../assets/playnite/site.webmanifest">
<meta name="theme-color" content="#10131d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YMKF">
<!-- /YMKF site icon hf26 -->
</head>
<body>
<main class="wrap">
<a class="back" href="../index.html">← 返回游戏库</a>
<section class="hero"><div><h1>PUBG: BATTLEGROUNDS</h1><div id="playerName" class="sub">PIANOYMKF · 官方 Lifetime 生涯数据</div><div class="status"><span id="bindPill" class="pill">读取中</span></div></div><div class="sub">只保存累计统计 · 不抓逐局历史</div></section>
<div id="notice"></div>
<div id="summaryGrid" class="grid"></div>
<section class="section"><h2>模式统计</h2><div class="tableWrap"><table><thead><tr><th>模式</th><th>对局</th><th>吃鸡</th><th>Top 10</th><th>击杀</th><th>K/D</th><th>场均伤害</th><th>平均存活</th><th>最远击杀</th></tr></thead><tbody id="modeBody"></tbody></table></div></section>
<section class="section"><h2>其他累计</h2><div id="extraGrid" class="grid"></div></section>
<section class="section"><div class="note">数据来自 PUBG 官方 Developer API 的 Lifetime 统计。PC Lifetime 口径从 Survival Title 系统启用后开始累计；本页不会尝试恢复已经超过官方保留期的逐局战报。</div></section>
<div class="footer">Build v1.16.7</div>
</main>
<script>
const DATA='../data/pubg.json?v=1.16.7';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v||0);
const fmt=v=>Number.isFinite(Number(v))?Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2}):'—';
const pct=(a,b)=>b>0?(a/b*100).toFixed(1)+'%':'—';
const hours=s=>s>0?(s/3600).toFixed(1)+' h':'—';
const distance=m=>m>0?(m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m'):'—';
const duration=s=>{s=n(s);if(!s)return '—';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h?`${h}h ${m}m`:`${m}m`};
const kd=m=>{const d=n(m.losses)||Math.max(0,n(m.roundsPlayed)-n(m.wins));return d>0?(n(m.kills)/d).toFixed(2):(n(m.kills)>0?'∞':'0.00')};
const card=(label,value)=>`<div class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`;
const modeName=x=>({'solo':'单排 TPP','solo-fpp':'单排 FPP','duo':'双排 TPP','duo-fpp':'双排 FPP','squad':'四排 TPP','squad-fpp':'四排 FPP'}[x]||x);
function render(D){
 const bound=!!D.binding?.bound, s=D.lifetime?.summary||{}, modes=Array.isArray(D.lifetime?.modes)?D.lifetime.modes:[];
 $('#playerName').textContent=(D.profile?.name||'PIANOYMKF')+' · 官方 Lifetime 生涯数据';
 const pill=$('#bindPill');pill.textContent=bound?'PUBG 官方 API 已绑定':'PUBG 官方 API 未绑定';pill.classList.toggle('ok',bound);
 if(!bound)$('#notice').innerHTML='<div class="note" style="margin-top:16px">尚未绑定。请在本机运行 <b>BIND_PUBG.cmd</b>，使用 PUBG Developer API Key 绑定。</div>';
 else if(D.status==='cached')$('#notice').innerHTML='<div class="note" style="margin-top:16px">本次官方 API 暂时刷新失败，页面正在显示上一次成功缓存的数据。</div>';
 else if(D.status==='bound_no_cache')$('#notice').innerHTML='<div class="note" style="margin-top:16px">账号已绑定，但还没有成功取得 Lifetime 数据。</div>';
 $('#summaryGrid').innerHTML=[
  card('总时长',hours(D.playniteSeconds)),card('累计对局',fmt(s.roundsPlayed)),card('吃鸡',fmt(s.wins)),card('胜率',pct(n(s.wins),n(s.roundsPlayed))),
  card('Top 10',fmt(s.top10s)),card('Top 10率',pct(n(s.top10s),n(s.roundsPlayed))),card('击杀',fmt(s.kills)),card('K/D',kd(s)),
  card('总伤害',fmt(s.damageDealt)),card('场均伤害',n(s.roundsPlayed)?(n(s.damageDealt)/n(s.roundsPlayed)).toFixed(1):'—'),card('爆头击杀',fmt(s.headshotKills)),card('爆头占比',pct(n(s.headshotKills),n(s.kills))),
  card('最远击杀',distance(s.longestKill)),card('单局最多击杀',fmt(s.roundMostKills)),card('平均存活',n(s.roundsPlayed)?duration(n(s.timeSurvived)/n(s.roundsPlayed)):'—'),card('助攻',fmt(s.assists))
 ].join('');
 $('#modeBody').innerHTML=modes.filter(m=>n(m.roundsPlayed)>0).map(m=>`<tr><td>${esc(modeName(m.mode))}</td><td>${fmt(m.roundsPlayed)}</td><td>${fmt(m.wins)}</td><td>${fmt(m.top10s)}</td><td>${fmt(m.kills)}</td><td>${kd(m)}</td><td>${n(m.roundsPlayed)?(n(m.damageDealt)/n(m.roundsPlayed)).toFixed(1):'—'}</td><td>${n(m.roundsPlayed)?duration(n(m.timeSurvived)/n(m.roundsPlayed)):'—'}</td><td>${distance(m.longestKill)}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">暂无官方 Lifetime 模式数据。</td></tr>';
 const totalDistance=n(s.walkDistance)+n(s.rideDistance)+n(s.swimDistance);
 $('#extraGrid').innerHTML=[card('总移动距离',distance(totalDistance)),card('步行距离',distance(s.walkDistance)),card('载具距离',distance(s.rideDistance)),card('游泳距离',distance(s.swimDistance)),card('救援',fmt(s.revives)),card('击倒',fmt(s.dBNOs)),card('治疗',fmt(s.heals)),card('能量道具',fmt(s.boosts)),card('载具摧毁',fmt(s.vehicleDestroys)),card('载具击杀',fmt(s.roadKills)),card('获得武器',fmt(s.weaponsAcquired)),card('队友击杀',fmt(s.teamKills))].join('');
}
fetch(DATA,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(render).catch(e=>{$('#notice').innerHTML=`<div class="note" style="margin-top:16px">PUBG 数据尚未生成：${esc(e.message)}</div>`});
</script>
</body></html>
