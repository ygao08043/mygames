<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUBG 武器数据 · YMKF</title><style>
:root{color-scheme:dark;--panel:#121721;--panel2:#181f2b;--line:#2a3443;--text:#edf2f7;--muted:#95a0af;--accent:#f2c94c;--ok:#70d6a3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080b10,#101620);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:26px 0 50px}.back{display:inline-flex;text-decoration:none;color:var(--muted);margin-bottom:18px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;padding:24px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#151a23,#22200f)}h1{font-size:30px;line-height:1.1;margin:0 0 8px}.sub{color:var(--muted)}.pill{display:inline-flex;border:1px solid #2e6a50;color:var(--ok);border-radius:999px;padding:5px 10px}.section{margin-top:20px}.note{background:#141820;border-left:3px solid var(--accent);padding:12px 14px;border-radius:8px;color:#c8ced7}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--muted);background:var(--panel2);position:sticky;top:0}tbody tr:last-child td{border-bottom:0}.weapon{font-weight:700;font-size:15px}.sortBtn{border:0;background:none;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:0;display:inline-flex;gap:5px}.sortMark{min-width:12px;color:var(--accent)}.footer{margin-top:22px;color:var(--muted);font-size:12px}@media(max-width:700px){.hero{align-items:flex-start;flex-direction:column}h1{font-size:25px}}</style><!-- YMKF site icon hf26 -->

</head><body><main class="wrap">
<a class="back" href="../index.html">← 返回游戏库</a><section class="hero"><div><h1>PUBG: BATTLEGROUNDS</h1><div id="playerName" class="sub">PIANOYMKF · PUBG 武器熟练度</div><div style="margin-top:14px"><span class="pill">小黑盒校准 + API补全</span></div></div><div class="sub">2026-08-24</div></section>
<section class="section"><div class="tableWrap"><table><thead><tr><th>武器</th><th><button class="sortBtn" data-sort="level">武器等级 <span class="sortMark"></span></button></th><th><button class="sortBtn" data-sort="kills">总击杀 <span class="sortMark"></span></button></th><th><button class="sortBtn" data-sort="roundMostKills">单场最高 <span class="sortMark"></span></button></th><th><button class="sortBtn" data-sort="longestKill">最远击杀距离 <span class="sortMark"></span></button></th></tr></thead><tbody id="weaponBody"></tbody></table></div></section>
<section class="section"><div class="note">截图覆盖到的武器严格采用你 2026-08-24 提供的小黑盒数值；截图之外的 PUBG Weapon Mastery 武器继续保留，所以原来 0 击杀但已存在的武器不会再被删掉。</div></section><div class="footer">Build v1.19.2</div></main><script>
const DATA='../data/pubg.json?v=1.16.14',$=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>Number(v).toLocaleString('zh-CN'),dist=m=>Number(m)>0?`${fmt(m)} m`:'—';let D=null,sortKey='level',sortDir='desc';
function renderMarks(){document.querySelectorAll('.sortBtn').forEach(b=>b.querySelector('.sortMark').textContent=b.dataset.sort===sortKey?(sortDir==='desc'?'▼':'▲'):'↕')}
function render(){const rows=Array.isArray(D?.weapons)?[...D.weapons]:[];rows.sort((a,b)=>{const av=Number(a?.[sortKey]||0),bv=Number(b?.[sortKey]||0);if(av!==bv)return sortDir==='desc'?bv-av:av-bv;return String(a.name||'').localeCompare(String(b.name||''),'zh-CN')});$('#playerName').textContent=(D?.profile?.name||'PIANOYMKF')+' · PUBG 武器熟练度';$('#weaponBody').innerHTML=rows.map(w=>`<tr><td class="weapon">${esc(w.name)}</td><td>${fmt(w.level)}</td><td>${fmt(w.kills)}</td><td>${fmt(w.roundMostKills)}</td><td>${dist(w.longestKill)}</td></tr>`).join('');renderMarks()}
document.querySelectorAll('.sortBtn').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.sort;if(sortKey===k)sortDir=sortDir==='desc'?'asc':'desc';else{sortKey=k;sortDir='desc'}render()}));fetch(DATA,{cache:'no-store'}).then(r=>r.json()).then(x=>{D=x;render()});
</script></body></html>
