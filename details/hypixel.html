<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hypixel · PIANOYMKF</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#121722;--panel2:#0b0f16;--line:#283245;--line2:#202a39;--text:#f4f7fb;--muted:#8f9aab;--gold:#f5c04a;--good:#6ce0a8;--blue:#7db7ff;--warn:#ffcf70}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% -10%,#233357 0,#0b0e14 35%,#07090d 100%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1240px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.back{color:#d9e2f0;text-decoration:none}.brand{font-size:28px;font-weight:900;letter-spacing:.4px}.brand b{color:var(--gold)}.sub{color:var(--muted);margin-top:4px}.hero,.card,.modePanel{background:linear-gradient(180deg,rgba(23,30,44,.96),rgba(13,17,25,.96));border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.hero{padding:22px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.who{display:flex;gap:16px;align-items:center}.head{width:72px;height:72px;border-radius:14px;image-rendering:pixelated;background:#202938}.name{font-size:26px;font-weight:900}.rank{color:var(--gold);font-weight:800}.status{padding:8px 12px;border-radius:999px;background:#222b3a;color:#aeb8c7;font-weight:800}.status.on{background:#163c2c;color:#8bf0ba}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.metric{padding:15px;border:1px solid var(--line);border-radius:14px;background:rgba(8,11,17,.45)}.metric strong{display:block;font-size:22px}.metric small{color:var(--muted)}h2{font-size:17px;margin:26px 2px 12px}.card{padding:18px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.stat{background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:11px;min-width:0}.stat b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis}.stat span{font-size:11px;color:var(--muted)}button{border:0;border-radius:10px;padding:8px 12px;font-weight:800;background:#222b3a;color:#dfe7f3;cursor:pointer}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.filters button.active{background:#e9b83f;color:#14110a}.modeButtons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.modeBtn{position:relative;text-align:left;padding:11px 12px;border:1px solid var(--line2);background:#101620;color:#e5ebf5;border-radius:12px;min-height:58px}.modeBtn:hover{border-color:#50627d}.modeBtn.active{border-color:#d9aa36;background:#2a2415;box-shadow:inset 0 0 0 1px rgba(245,192,74,.25)}.modeBtn .n{display:block;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modeBtn .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}.badge{display:inline-flex;align-items:center;border:1px solid #33425a;border-radius:999px;padding:1px 6px;font-size:9px;color:#aebbd0}.badge.played{color:#8ce8b5;border-color:#285f49}.badge.legacy{color:#ffd681;border-color:#66542d}.badge.retired{color:#f0a2a2;border-color:#643636}.modePanel{padding:20px;margin-top:14px}.modeHead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.modeTitle{font-size:23px;font-weight:900}.modeKey{font:11px ui-monospace,Consolas,monospace;color:var(--muted);margin-top:3px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chip{padding:5px 8px;border-radius:999px;border:1px solid #2b374b;background:#0b1018;color:#bac6d8;font-size:11px}.hint{padding:18px;border:1px dashed #354257;border-radius:13px;color:var(--muted);background:#0b0f16;margin-top:13px}.sectionTitle{font-size:13px;font-weight:850;margin:18px 0 9px;color:#ced8e8}.genericGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.field{padding:10px;border-radius:10px;background:#0b0f16;border:1px solid #202a39;min-width:0}.field b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis}.field span{display:block;margin-top:3px;color:#8694a8;font-size:10px;word-break:break-word}.recent{overflow:auto}.recent table{width:100%;border-collapse:collapse}.recent th,.recent td{text-align:left;border-bottom:1px solid #202838;padding:10px 8px;white-space:nowrap}.recent th{color:var(--muted);font-size:11px}.empty{padding:30px;text-align:center;color:var(--muted)}details{margin-top:14px}summary{cursor:pointer;color:#aab7cb}.raw{max-height:520px;overflow:auto;margin-top:10px;background:#080b10;border:1px solid #1f2734;border-radius:12px;padding:12px;font:11px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}.foot{color:var(--muted);font-size:11px;text-align:center;margin:26px 0}.count{font-size:11px;color:var(--muted);font-weight:600}.skyProfiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.skyProfile{padding:12px;border:1px solid #26334a;background:#0b0f16;border-radius:12px}.skyProfile b{display:block;font-size:16px}.skyProfile span{color:var(--muted);font-size:11px}.search{width:100%;max-width:360px;background:#0b0f16;border:1px solid #26334a;border-radius:10px;color:#e8eef7;padding:9px 11px;outline:none}.search:focus{border-color:#526884}@media(max-width:1000px){.modeButtons{grid-template-columns:repeat(4,1fr)}}@media(max-width:800px){.grid,.stats,.genericGrid{grid-template-columns:repeat(2,1fr)}.modeButtons{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.wrap{padding:15px}.skyProfiles{grid-template-columns:1fr}.modeHead{display:block}}
</style>
<!-- YMKF site icon hf26 -->
<link rel="icon" type="image/svg+xml" href="../assets/playnite/site-icon.svg">
<link rel="shortcut icon" href="../assets/playnite/site-icon.svg">
<link rel="apple-touch-icon" href="../assets/playnite/site-icon.svg">
<link rel="manifest" href="../assets/playnite/site.webmanifest">
<meta name="theme-color" content="#10131d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YMKF">
<!-- /YMKF site icon hf26 -->
</head>
<body>
<div class="wrap">
  <div class="top"><div><a class="back" href="../index.html">← 返回游戏库</a><div class="brand"><b>HYPIXEL</b> 战绩</div><div class="sub">Minecraft · 两个 Minecraft 条目共用此详情页 · Build v1.16.0</div></div><button onclick="location.reload()">刷新页面</button></div>
  <div id="app" class="empty">正在读取 Hypixel 数据…</div>
  <div class="foot">数据来自 Hypixel Public API v2 · 游戏目录来自官方 resources/games · 仅在 RUN_SYNC 时刷新 · 本站与 Hypixel 无隶属或背书关系</div>
</div>
<script>
const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('zh-CN'),ratio=n=>(Number(n||0)).toFixed(2),dt=x=>x?new Date(Number(x)).toLocaleString('zh-CN',{hour12:false}):'—';
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const gameName=x=>String(x||'').replaceAll('_',' ');
const labels={wins:'胜场',losses:'负场',kills:'击杀',deaths:'死亡',games:'场次',games_played:'游玩场次',coins:'Coins',experience:'经验',score:'分数',assists:'助攻',damage:'伤害',heads:'爆头',shots_fired:'射击',shots_hit:'命中',wins_bedwars:'胜场',losses_bedwars:'负场',final_kills_bedwars:'最终击杀',final_deaths_bedwars:'最终死亡',beds_broken_bedwars:'拆床',beds_lost_bedwars:'丢床'};
function metric(v,l){return `<div class="metric"><strong>${v}</strong><small>${l}</small></div>`}
function stat(v,l){return `<div class="stat"><b>${v}</b><span>${l}</span></div>`}
function human(k){if(labels[k])return labels[k];return String(k).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function scalarEntries(o){if(!o||typeof o!=='object')return[];return Object.entries(o).filter(([,v])=>['number','string','boolean'].includes(typeof v)&&v!==''&&v!==null).sort(([a,av],[b,bv])=>{const rank=k=>/^(wins?|kills?|deaths?|games?|score|coins?|experience|assists?)/i.test(k)?0:1;return rank(a)-rank(b)||a.localeCompare(b)});}
function rawBlock(obj,label='完整原始统计'){return `<details><summary>${label}</summary><pre class="raw">${esc(JSON.stringify(obj||{},null,2))}</pre></details>`}
function knownStats(db,d){
  if(db==='Bedwars'){const o=d.bedwars||{};return `<div class="stats">${[['level','星级',fmt],['wins','胜场'],['losses','负场'],['wlr','W/L',ratio],['finalKills','最终击杀'],['finalDeaths','最终死亡'],['fkdr','FKDR',ratio],['bedsBroken','拆床'],['bedsLost','丢床'],['bblr','BBLR',ratio],['kills','击杀'],['deaths','死亡'],['kdr','K/D',ratio],['games','场次'],['coins','Coins'],['experience','Experience']].map(([k,l,f])=>stat((f||fmt)(o[k]),l)).join('')}</div>`}
  if(db==='SkyWars'){const o=d.skywars||{};return `<div class="stats">${[['wins','胜场'],['losses','负场'],['wlr','W/L',ratio],['kills','击杀'],['deaths','死亡'],['kdr','K/D',ratio],['coins','Coins'],['experience','Experience']].map(([k,l,f])=>stat((f||fmt)(o[k]),l)).join('')}</div>`}
  if(db==='Duels'){const o=d.duels||{};return `<div class="stats">${[['wins','胜场'],['losses','负场'],['wlr','W/L',ratio],['kills','击杀'],['deaths','死亡'],['kdr','K/D',ratio],['currentWinstreak','当前连胜'],['bestWinstreak','最高连胜']].map(([k,l,f])=>stat((f||fmt)(o[k]),l)).join('')}</div>`}
  if(db==='MurderMystery'){const o=d.murderMystery||{};return `<div class="stats">${[['wins','胜场'],['games','场次'],['kills','击杀'],['deaths','死亡'],['murdererWins','杀手胜场'],['detectiveWins','侦探胜场']].map(([k,l,f])=>stat((f||fmt)(o[k]),l)).join('')}</div>`}
  return '';
}
function genericStats(raw){const arr=scalarEntries(raw);if(!arr.length)return '';const shown=arr.slice(0,32);return `<div class="sectionTitle">主要统计字段 <span class="count">显示 ${shown.length}/${arr.length}</span></div><div class="genericGrid">${shown.map(([k,v])=>`<div class="field"><b>${typeof v==='number'?fmt(v):esc(v)}</b><span>${esc(human(k))}</span></div>`).join('')}</div>`}
function skyblockExtra(d){const ps=d.skyblockProfiles||[];if(!ps.length)return '';return `<div class="sectionTitle">SkyBlock Profiles</div><div class="skyProfiles">${ps.map(p=>`<div class="skyProfile"><b>${esc(p.cuteName||'Unnamed')}</b><span>${p.selected?'当前选中 · ':''}${esc(p.profileId||'')}</span></div>`).join('')}</div>${rawBlock(ps,'SkyBlock Profiles 完整数据')}`}
let DATA=null,CATALOG=[],FILTER='all',ACTIVE='';
function badge(g){return `${g.hasStats?'<span class="badge played">有数据</span>':'<span class="badge">未游玩</span>'}${g.legacy?'<span class="badge legacy">Legacy</span>':''}${g.retired?'<span class="badge retired">Retired</span>':''}`}
function filtered(){const q=($('#modeSearch')?.value||'').trim().toLowerCase();return CATALOG.filter(g=>{if(FILTER==='played'&&!g.hasStats)return false;if(FILTER==='unplayed'&&g.hasStats)return false;if(FILTER==='legacy'&&!g.legacy)return false;if(FILTER==='retired'&&!g.retired)return false;if(q&&!`${g.name} ${g.key} ${g.databaseName}`.toLowerCase().includes(q))return false;return true})}
function renderButtons(){const box=$('#modeButtons');if(!box)return;const list=filtered();box.innerHTML=list.map(g=>`<button class="modeBtn ${g.key===ACTIVE?'active':''}" data-key="${esc(g.key)}"><span class="n">${esc(g.name)}</span><span class="meta">${badge(g)}</span></button>`).join('')||'<div class="hint">没有匹配的模式</div>';box.querySelectorAll('.modeBtn').forEach(b=>b.onclick=()=>{ACTIVE=b.dataset.key;renderButtons();renderMode();});$('#modeCount').textContent=`${list.length}/${CATALOG.length} 个游戏`}
function renderMode(){const g=CATALOG.find(x=>x.key===ACTIVE)||CATALOG[0];if(!g)return;ACTIVE=g.key;const raw=(DATA.rawStats||{})[g.databaseName]||null;const modes=(g.modes||[]);const titleBadges=badge(g);let body='';const rich=knownStats(g.databaseName,DATA);if(rich)body+=`<div class="sectionTitle">核心统计</div>${rich}`;body+=genericStats(raw);if(g.databaseName==='SkyBlock')body+=skyblockExtra(DATA);if(!raw&&!body)body+=`<div class="hint">这个账号目前没有 ${esc(g.name)} 的 player.stats 数据。模式按钮仍然保留，因为它存在于 Hypixel 官方游戏目录中。</div>`;if(modes.length)body+=`<div class="sectionTitle">官方子模式 <span class="count">${modes.length} 个</span></div><div class="chips">${modes.map(m=>`<span class="chip" title="${esc(m.key)}">${esc(m.name)}</span>`).join('')}</div>`;if(raw)body+=rawBlock(raw,`${esc(g.name)} 完整原始统计`);$('#modePanel').innerHTML=`<div class="modeHead"><div><div class="modeTitle">${esc(g.name)}</div><div class="modeKey">${esc(g.key)} · databaseName: ${esc(g.databaseName||'—')}</div></div><div>${titleBadges}</div></div>${body}`}
function setFilter(f){FILTER=f;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));renderButtons()}
fetch('../data/hypixel.json?v='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{
  DATA=d;const p=d.profile||{},s=d.status||{},recent=d.recentGames||[];
  CATALOG=(d.gameCatalog||[]).slice().sort((a,b)=>(Number(b.hasStats)-Number(a.hasStats))||(Number(a.retired)-Number(b.retired))||(Number(a.legacy)-Number(b.legacy))||String(a.name).localeCompare(String(b.name)));
  if(!CATALOG.length){CATALOG=Object.keys(d.rawStats||{}).map((db,i)=>({key:db,id:i,name:db,databaseName:db,legacy:false,retired:false,hasStats:true,modes:[]}))}
  ACTIVE=(CATALOG.find(g=>g.databaseName==='Bedwars'&&g.hasStats)||CATALOG.find(g=>g.hasStats)||CATALOG[0]||{}).key||'';
  document.title=`Hypixel · ${d.username||'PIANOYMKF'}`;$('#app').className='';$('#app').innerHTML=`
  <section class="hero"><div class="who"><img class="head" src="https://mc-heads.net/avatar/${encodeURIComponent(d.uuid||d.username||'PIANOYMKF')}/144" alt=""><div><div class="name">${esc(d.username||'PIANOYMKF')}</div><div class="rank">${esc(p.rank||'Default')} · Network Lv.${ratio(p.networkLevel)}</div><div class="sub">UUID ${esc(d.uuid||'—')} · 更新 ${new Date(d.updatedAt).toLocaleString('zh-CN',{hour12:false})}</div></div></div><div class="status ${s.online?'on':''}">${s.online?'● 在线 · '+esc(gameName(s.gameType||s.mode)):'○ 离线'}</div></section>
  <div class="grid">${metric(fmt(p.karma),'Karma')}${metric(fmt(p.achievementPoints),'Achievement Points')}${metric(dt(p.firstLogin),'首次登录')}${metric(dt(p.lastLogin),'最后登录')}</div>
  <h2>全部 Hypixel 游戏模式</h2>
  <div class="card"><div class="filters"><button class="active" data-filter="all">全部</button><button data-filter="played">有数据</button><button data-filter="unplayed">未游玩</button><button data-filter="legacy">Legacy</button><button data-filter="retired">Retired</button><input id="modeSearch" class="search" placeholder="搜索游戏模式…"><span id="modeCount" class="count"></span></div><div id="modeButtons" class="modeButtons"></div></div>
  <div id="modePanel" class="modePanel"></div>
  <h2>最近游戏</h2><div class="card recent">${recent.length?`<table><thead><tr><th>时间</th><th>游戏</th><th>模式</th><th>地图</th><th>结束</th></tr></thead><tbody>${recent.map(g=>`<tr><td>${dt(g.date)}</td><td>${esc(gameName(g.gameType))}</td><td>${esc(gameName(g.mode)||'—')}</td><td>${esc(g.map||'—')}</td><td>${dt(g.ended)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">最近 3 天没有 Hypixel 游戏记录</div>'}</div>`;
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));$('#modeSearch').oninput=renderButtons;renderButtons();renderMode();
}).catch(e=>{$('#app').innerHTML=`<div class="card empty"><b>Hypixel 数据尚未生成</b><br><br>先运行 SET_HYPIXEL_API.cmd，再运行 RUN_SYNC.cmd。<br><br>${esc(e.message||e)}</div>`})
</script>
</body>
</html>
