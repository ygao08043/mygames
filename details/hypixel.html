<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hypixel · PIANOYMKF</title><style>
:root{color-scheme:dark;--bg:#090b10;--panel:#121722;--line:#283245;--text:#f4f7fb;--muted:#8f9aab;--gold:#f5c04a;--good:#6ce0a8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% -10%,#233357 0,#0b0e14 35%,#07090d 100%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.back{color:#d9e2f0;text-decoration:none}.brand{font-size:28px;font-weight:900;letter-spacing:.4px}.brand b{color:var(--gold)}.sub{color:var(--muted);margin-top:4px}.hero,.card{background:linear-gradient(180deg,rgba(23,30,44,.96),rgba(13,17,25,.96));border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.hero{padding:22px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.who{display:flex;gap:16px;align-items:center}.head{width:72px;height:72px;border-radius:14px;image-rendering:pixelated;background:#202938}.name{font-size:26px;font-weight:900}.rank{color:var(--gold);font-weight:800}.status{padding:8px 12px;border-radius:999px;background:#222b3a;color:#aeb8c7;font-weight:800}.status.on{background:#163c2c;color:#8bf0ba}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.metric{padding:15px;border:1px solid var(--line);border-radius:14px;background:rgba(8,11,17,.45)}.metric strong{display:block;font-size:22px}.metric small{color:var(--muted)}h2{font-size:17px;margin:26px 2px 12px}.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:18px}.card h3{margin:0 0 12px;font-size:18px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.stat{background:#0b0f16;border:1px solid #202a39;border-radius:11px;padding:11px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}table{width:100%;border-collapse:collapse}.recent{overflow:auto}.recent th,.recent td{text-align:left;border-bottom:1px solid #202838;padding:10px 8px;white-space:nowrap}.recent th{color:var(--muted);font-size:11px}.empty{padding:30px;text-align:center;color:var(--muted)}details{margin-top:14px}summary{cursor:pointer;color:#aab7cb}.raw{max-height:460px;overflow:auto;margin-top:10px;background:#080b10;border:1px solid #1f2734;border-radius:12px;padding:12px;font:11px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}.foot{color:var(--muted);font-size:11px;text-align:center;margin:26px 0}button{border:0;border-radius:10px;padding:8px 12px;font-weight:800;background:#222b3a;color:#dfe7f3;cursor:pointer}@media(max-width:800px){.grid,.stats{grid-template-columns:repeat(2,1fr)}.modes{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.wrap{padding:15px}}

</head><body><div class="wrap"><div class="top"><div><a class="back" href="../index.html">← 返回游戏库</a><div class="brand"><b>HYPIXEL</b> 战绩</div><div class="sub">Minecraft · 两个 Minecraft 条目共用此详情页 · Build v1.15.0</div></div><button onclick="location.reload()">刷新页面</button></div><div id="app" class="empty">正在读取 Hypixel 数据…</div><div class="foot">数据来自 Hypixel Public API v2 · 仅在 RUN_SYNC 时刷新</div></div><script>
const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('zh-CN'),ratio=n=>(Number(n||0)).toFixed(2),dt=x=>x?new Date(Number(x)).toLocaleString('zh-CN',{hour12:false}):'—';
function metric(v,l){return `<div class="metric"><strong>${v}</strong><small>${l}</small></div>`}function stat(v,l){return `<div class="stat"><b>${v}</b><span>${l}</span></div>`}
function mode(title,o,defs){return `<div class="card"><h3>${title}</h3><div class="stats">${defs.map(([k,l,f])=>stat((f||fmt)(o?.[k]),l)).join('')}</div></div>`}
function gameName(x){return String(x||'').replaceAll('_',' ')}
fetch('../data/hypixel.json?v='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{const p=d.profile||{},s=d.status||{},bw=d.bedwars||{},recent=d.recentGames||[];document.title=`Hypixel · ${d.username||'PIANOYMKF'}`;$('#app').className='';$('#app').innerHTML=`<section class="hero"><div class="who"><img class="head" src="https://mc-heads.net/avatar/${encodeURIComponent(d.uuid||d.username||'PIANOYMKF')}/144" alt=""><div><div class="name">${d.username||'PIANOYMKF'}</div><div class="rank">${p.rank||'Default'} · Network Lv.${ratio(p.networkLevel)}</div><div class="sub">UUID ${d.uuid||'—'} · 更新 ${new Date(d.updatedAt).toLocaleString('zh-CN',{hour12:false})}</div></div></div><div class="status ${s.online?'on':''}">${s.online?'● 在线 · '+gameName(s.gameType||s.mode):'○ 离线'}</div></section><div class="grid">${metric(fmt(p.karma),'Karma')}${metric(fmt(p.achievementPoints),'Achievement Points')}${metric(dt(p.firstLogin),'首次登录')}${metric(dt(p.lastLogin),'最后登录')}</div><h2>主要模式</h2><div class="modes">${mode('🛏 Bed Wars',bw,[['level','星级',fmt],['wins','胜场'],['losses','负场'],['wlr','W/L',ratio],['finalKills','最终击杀'],['finalDeaths','最终死亡'],['fkdr','FKDR',ratio],['bedsBroken','拆床'],['bedsLost','丢床'],['bblr','BBLR',ratio],['kills','击杀'],['deaths','死亡'],['kdr','K/D',ratio],['games','场次'],['coins','Coins'],['experience','Experience']])}${mode('☁ SkyWars',d.skywars,[['wins','胜场'],['losses','负场'],['wlr','W/L',ratio],['kills','击杀'],['deaths','死亡'],['kdr','K/D',ratio],['coins','Coins'],['experience','Experience']])}${mode('⚔ Duels',d.duels,[['wins','胜场'],['losses','负场'],['wlr','W/L',ratio],['kills','击杀'],['deaths','死亡'],['kdr','K/D',ratio],['currentWinstreak','当前连胜'],['bestWinstreak','最高连胜']])}${mode('🔪 Murder Mystery',d.murderMystery,[['wins','胜场'],['games','场次'],['kills','击杀'],['deaths','死亡'],['murdererWins','杀手胜场'],['detectiveWins','侦探胜场']])}</div><h2>最近游戏</h2><div class="card recent">${recent.length?`<table><thead><tr><th>时间</th><th>游戏</th><th>模式</th><th>地图</th><th>结束</th></tr></thead><tbody>${recent.map(g=>`<tr><td>${dt(g.date)}</td><td>${gameName(g.gameType)}</td><td>${gameName(g.mode)||'—'}</td><td>${g.map||'—'}</td><td>${dt(g.ended)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">最近 3 天没有 Hypixel 游戏记录</div>'}</div><details><summary>完整原始模式统计（用于核对/以后继续扩展）</summary><pre class="raw">${JSON.stringify(d.rawStats||{},null,2).replaceAll('&','&amp;').replaceAll('<','&lt;')}</pre></details>`}).catch(e=>{$('#app').innerHTML=`<div class="card empty"><b>Hypixel 数据尚未生成</b><br><br>先运行 SET_HYPIXEL_API.cmd，再运行 RUN_SYNC.cmd。<br><br>${String(e.message||e)}</div>`})
</script></body></html>
