<script>

const DEF={
 overview:{title:'总览'},

let DATA=null,GA=null,current='overview';const SORTS={};
const $=s=>document.querySelector(s);function fixMojibake(v){let t=String(v??'');if(!/[ÃÂâ]/.test(t))return t;const chars=[...t];if(chars.some(ch=>ch.charCodeAt(0)>255))return t;try{const bytes=Uint8Array.from(chars.map(ch=>ch.charCodeAt(0)));const d=new TextDecoder('utf-8',{fatal:true}).decode(bytes);return d||t}catch{return t}}const esc=s=>fixMojibake(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function n(v){if(v==null||v==='')return null;const x=Number(v);return Number.isFinite(x)?x:null} function fmt(v,d=0){const x=n(v);return x==null?'—':x.toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d})} function pct(v){const x=n(v);return x==null?'—':`${x.toFixed(x<10?2:1)}%`} function hours(sec){const x=n(sec);return x==null?'—':`${(x/3600).toFixed(x>=360000?0:1)} h`} function dur(sec){const x=n(sec);if(x==null)return'—';const h=Math.floor(x/3600),m=Math.floor((x%3600)/60),s=Math.floor(x%60);return h?`${h}h ${m}m`:m?`${m}m ${s}s`:`${s}s`} function kd(k,d){k=n(k)||0;d=n(d)||0;return d?fmt(k/d,2):k?fmt(k,2):'—'}
function norm(s){return String(s||'').toLowerCase().normalize('NFKC').replace(/[^a-z0-9\u4e00-\u9fff]+/g,'')}
function gameKeyByName(name){const k=norm(name);for(const id of ['bf1','bfv','bf2042','bf6'])if(DEF[id].aliases.some(a=>k.includes(norm(a))))return id;return null}
function prop(o,names){if(!o||typeof o!=='object')return null;const keys=Object.keys(o);for(const nm of names){const key=keys.find(k=>k===nm);if(key!=null)return o[key]}for(const nm of names){const key=keys.find(k=>k.toLowerCase()===nm.toLowerCase());if(key!=null)return o[key]}return null}
function deepProp(o,names,depth=0,seen=new Set()){if(o==null||typeof o!=='object'||depth>4||seen.has(o))return null;seen.add(o);const direct=prop(o,names);if(direct!=null)return direct;for(const v of Object.values(o)){if(v&&typeof v==='object'&&!Array.isArray(v)){const hit=deepProp(v,names,depth+1,seen);if(hit!=null)return hit}}return null}
function flattenArray(v){if(!Array.isArray(v))return[];const out=[];for(const x of v){if(Array.isArray(x))out.push(...flattenArray(x));else if(x&&typeof x==='object'){const nested=prop(x,['items','weapons','vehicles','classes','gamemodes','gadgets','maps','levels']);if(Array.isArray(nested))out.push(...flattenArray(nested));else out.push(x)}}return out}
function findArray(raw,names){let v=deepProp(raw,names);if(Array.isArray(v))return flattenArray(v);if(v&&typeof v==='object'){const inner=deepProp(v,names);if(Array.isArray(inner))return flattenArray(inner);const items=deepProp(v,['items','data','results','result']);if(Array.isArray(items))return flattenArray(items)}return[]}
function itemName(x){return prop(x,['name','weaponName','vehicleName','className','kitName','modeName','gamemodeName','mapName','levelName','displayName','description','id'])||'未命名'}
function itemImg(x){return prop(x,['image','imageUrl','imageURL','img','icon','iconUrl','picture','asset'])||''}
function itemVal(x,names){return prop(x,names)}
function dateText(v){if(v==null)return'—';let d;if(typeof v==='number'||/^\d{10,13}$/.test(String(v))){let z=Number(v);if(z<2e10)z*=1000;d=new Date(z)}else d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function node(id){return DATA?.games?.[id]||{}}
function rawNode(id){const g=node(id);if(g.__parsedRaw!==undefined)return g.__parsedRaw;let r=g.raw;if(typeof r==='string'){let t=r.trim();for(let i=0;i<3&&typeof t==='string';i++){try{const q=JSON.parse(t);t=q}catch{break}}r=t}g.__parsedRaw=(r&&typeof r==='object')?r:{};return g.__parsedRaw}
function normalizeRawProfile(raw){const val=names=>deepProp(raw,names),num=names=>n(val(names));const kills=num(['kills','killCount','totalKills']),deaths=num(['deaths','deathCount','totalDeaths']);let ratio=num(['killDeath','killDeathRatio','kd','kdr']);if(ratio==null&&kills!=null&&deaths>0)ratio=kills/deaths;const wins=num(['wins','winCount']),losses=num(['loses','losses','lossCount']);let wp=num(['winPercent','winPercentage','winRate']);if(wp==null&&wins!=null&&losses!=null&&wins+losses>0)wp=100*wins/(wins+losses);return{userName:val(['userName','username','name','eaid','eaId'])||'',avatar:val(['avatar','avatarUrl','avatarURL'])||'',rank:num(['rank','level','playerRank']),secondsPlayed:num(['secondsPlayed','playtimeSeconds','timeSeconds','timePlayed']),kills,deaths,kd:ratio,wins,losses,rounds:num(['roundsPlayed','rounds','gamesPlayed','matchesPlayed','matches']),winPercent:wp,kpm:num(['kpm','killsPerMinute','killPerMinute']),spm:num(['spm','scorePerMinute']),accuracy:num(['accuracy','accuracyRatio','accuracyPercent']),headshots:num(['headShots','headshotKills','headshots']),longestHeadshot:num(['longestHeadShot','longestHeadshot']),score:num(['score','totalScore'])}}
function profile(id){const g=node(id),p=g.profile||{};if([p.kills,p.deaths,p.rank,p.secondsPlayed].some(v=>v!=null))return p;const recovered=normalizeRawProfile(rawNode(id));return [recovered.kills,recovered.deaths,recovered.rank,recovered.secondsPlayed].some(v=>v!=null)?recovered:p}
function playniteSeconds(id){return n(node(id).playniteSeconds)}
function sumPlaynite(){const direct=n(DATA?.playniteTotalSeconds);if(direct!=null)return direct;let total=0,seen=0;for(const id of ['bf1','bfv','bf2042','bf6']){const x=playniteSeconds(id);if(x!=null){total+=x;seen++}}return seen?total:null}
function sumProfile(){let r={kills:0,deaths:0,wins:0,losses:0,rounds:0};for(const id of ['bf1','bfv','bf2042','bf6']){const p=profile(id);for(const k of Object.keys(r))r[k]+=n(p[k])||0}return r}
function availableAvatar(){for(const id of ['bf1','bfv','bf2042','bf6']){const a=profile(id).avatar;if(a)return a}return''}

function lastPlayedDate(id){const rows=Array.isArray(GA?.lastPlayedGames)?GA.lastPlayedGames:[];const hit=rows.find(x=>gameKeyByName(x.name)===id||String(x.id||'')===String(node(id)?.playniteId||''));if(hit?.date)return hit.date;if(hit?.lastPlayed)return String(hit.lastPlayed).slice(0,10);return'—'}
function renderGameActivityChart(id){const c=document.getElementById('activityChart');if(!c)return;const rows=monthlyByGame(id),box=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=Math.max(1,box.width*dpr);c.height=Math.max(1,box.height*dpr);const ctx=c.getContext('2d');ctx.scale(dpr,dpr);const W=box.width,H=box.height,pad={l:46,r:14,t:16,b:34};ctx.clearRect(0,0,W,H);if(!rows.some(x=>x.seconds>0)){ctx.fillStyle='#8d9aab';ctx.font='12px sans-serif';ctx.fillText('暂无该作 GameActivity 月度记录',20,35);return}const vals=rows.map(x=>x.seconds/3600),max=Math.max(1,...vals),cw=(W-pad.l-pad.r)/Math.max(1,rows.length),bw=Math.max(8,Math.min(38,cw*.58));ctx.strokeStyle='#273142';ctx.fillStyle='#738094';ctx.font='10px sans-serif';for(let i=0;i<=4;i++){const y=pad.t+(H-pad.t-pad.b)*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillText(`${(max*(1-i/4)).toFixed(max>=10?0:1)}h`,4,y+3)}rows.forEach((m,i)=>{const h=vals[i]/max*(H-pad.t-pad.b);ctx.fillStyle=COLORS[id];ctx.fillRect(pad.l+i*cw+(cw-bw)/2,H-pad.b-h,bw,h);ctx.save();ctx.translate(pad.l+i*cw+cw/2,H-pad.b+14);ctx.rotate(-.38);ctx.fillStyle='#8d9aab';ctx.textAlign='right';ctx.fillText(String(m.month||'').slice(2),0,0);ctx.restore()})}
function renderGameActivity(hostId,id){const host=document.getElementById(hostId);if(!host)return;const rows=monthlyByGame(id),used=rows.filter(x=>x.seconds>0),total=used.reduce((a,b)=>a+b.seconds,0),cur=used.find(x=>x.month===GA?.currentMonth)?.seconds||0,last=lastPlayedDate(id),tableRows=[...used].reverse();host.innerHTML=`<div class="card span-12"><div class="section-title">Game Activity</div><div class="section-note">来自 Playnite GameActivity 的本机真实日期记录。覆盖 ${esc(GA?.coverageStart||'—')} ～ ${esc(GA?.coverageEnd||'—')}；不会拿 Playnite 累计时长反推月份。</div><div class="stats"><div class="stat"><small>可回溯时长</small><b class="accent">${hours(total)}</b></div><div class="stat"><small>本月记录</small><b>${hours(cur)}</b></div><div class="stat"><small>最近游玩日期</small><b>${esc(last)}</b></div></div><div class="chart-wrap activity-chart"><canvas id="activityChart"></canvas></div><div class="section-title" style="margin-top:16px">按月明细</div><div id="activityTableHost"></div></div>`;pagedTable('activityTableHost','activity',tableRows,1,'GameActivity 月度累计');requestAnimationFrame(()=>renderGameActivityChart(id))}
function sectionNote(id,k,arr){if(id==='bf2042')return '当前 GameTools / EA 上游返回 hasResults=false 或全零数据，本页只保留接口结构用于诊断，不把 0 当成真实成绩。';if(id==='bf1'&&k==='classes')return 'BF1 公共 classes 接口提供击杀、分数、KPM、兵种时长，但不提供累计兵种死亡；缺失项显示“—”。';if(id==='bf1'&&k==='vehicles')return 'BF1 公共 vehicles 接口提供击杀、摧毁、KPM、载具时长；累计载具分数未由该接口提供，缺失项显示“—”。';if(id==='bf1'&&k==='gamemodes')return 'BF1 公共 gamemode 接口提供胜/负、分数、胜率；累计模式击杀与模式时长未由该接口提供。';if(k==='maps'&&!arr.length)return id==='bf1'||id==='bfv'?'GameTools 当前公开玩家接口没有返回这一代的累计地图统计；地图页已预留，后续接入可验证的战报源后会自动使用。':'当前接口没有返回地图统计。';return '按上游接口返回的累计统计展示；没有的字段显示“—”，不会用 0 冒充缺失值。'}
function renderGame(id){const g=node(id),p=profile(id),raw=rawNode(id),cols={weapons:findArray(raw,['weapons','weaponStats']),classes:findArray(raw,['classes','kits','classStats']),vehicles:findArray(raw,['vehicles','vehicleStats']),gamemodes:findArray(raw,['gamemodes','gameModes','modes']),maps:findArray(raw,['maps','levels','mapStats','levelStats']),gadgets:findArray(raw,['gadgets','gadgetStats'])};const rawSessions=findArray(raw,['sessions','playerSessions']),savedSessions=Array.isArray(g.trueSessions)?g.trueSessions:[],sessions=savedSessions.length?savedSessions:rawSessions;const avail={history:(sessions.length?sessions:(g.intervals||[])).length,weapons:cols.weapons.length,classes:cols.classes.length,vehicles:cols.vehicles.length,gamemodes:cols.gamemodes.length,maps:cols.maps.length,gadgets:cols.gadgets.length};const broken=g.status==='upstream_broken';$('#mainContent').innerHTML=`<section class="content active"><div class="game-head"><div><h2>${DEF[id].title}</h2><div class="game-meta">${statusLabel(g)} · ${dateText(g.updatedAt)}${p.rank!=null?` · Rank ${fmt(p.rank)}`:''}</div></div><span class="status ${esc(g.status||'error')}">${statusLabel(g)}</span></div>${broken?`<div class="card span-12 warning-card" style="margin-bottom:12px"><div class="warning-title">官方数据损坏 · 待修复</div><div class="section-note">GameTools 当前仍能返回 BF2042 的数据结构，但该账号响应为 hasResults=false / 全零。为避免把坏数据当成真实战绩，本版将其标为上游异常；Playnite 总时长仍正常保留。</div></div>`:''}${sectionNav(id,avail)}<div class="game-section active" data-panel="overview"><div class="grid"><div class="card span-12"><div class="section-title">核心数据</div><div class="stats">${statCells(id,p,g)}</div></div><div id="overviewActivityHost" class="span-12"></div></div></div><div class="game-section" data-panel="history"><div class="card"><div class="section-title">对局 / 战报记录</div><div id="historyHost"></div></div></div>${['weapons','classes','vehicles','gamemodes','maps','gadgets'].map(k=>`<div class="game-section" data-panel="${k}"><div class="card"><div class="section-title">${{weapons:'武器数据',classes:'兵种数据',vehicles:'载具数据',gamemodes:'游戏模式',maps:'地图数据',gadgets:'装备 / Gadget'}[k]}</div><div id="${k}Host"></div></div></div>`).join('')}</section>`;renderGameActivity('overviewActivityHost',id);document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-sub]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('active',x.dataset.panel===b.dataset.sub));const k=b.dataset.sub;if(k==='overview'){renderGameActivity('overviewActivityHost',id)}else if(k==='history')renderHistory('historyHost',id);else if(cols[k])pagedTable(k+'Host',k,cols[k],1,sectionNote(id,k,cols[k]))})}
function render(){renderTabs();setIdentity();if(current==='overview')renderOverview();else renderGame(current)}
async function load(){try{const [d,g]=await Promise.all([fetch('../data/battlefield.json?v='+BUILD,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),fetch('../data/gameactivity-stats.json?v='+BUILD,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]);DATA=d||{games:{}};GA=g||{};const q=new URLSearchParams(location.search).get('game');if(q&&DEF[q])current=q;render();window.addEventListener('resize',()=>{if(current==='overview')renderMonthlyChart();else if(document.querySelector('.game-section.active')?.dataset.panel==='overview')renderGameActivityChart(current)})}catch(e){DATA={games:{}};GA={};render();$('#sourceInfo').textContent='读取数据失败：'+e.message}}
$('#backBtn').onclick=()=>{if(history.length>1)history.back();else location.href='../index.html'};load();
</script>
