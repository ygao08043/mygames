<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#0f141c;--panel2:#141b25;--panel3:#1a2330;--line:#263142;--text:#f3f6fa;--muted:#8d9aab;--faint:#5e6a7a;--orange:#ff8b36;--blue:#68a9ff;--cyan:#60d7d1;--green:#67d690;--red:#ff6c75;--shadow:0 18px 55px rgba(0,0,0,.32)}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 12% -10%,#16253a 0,transparent 36%),radial-gradient(circle at 100% 0,#29190e 0,transparent 28%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100%}button{font:inherit}.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:20px 0 72px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;border:1px solid var(--line);background:rgba(15,20,28,.78);padding:9px 13px;border-radius:11px;cursor:pointer}.back:hover{color:var(--text)}.build{font-size:11px;color:var(--faint)}

.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0;padding:4px;background:#0b1017b8;border:1px solid var(--line);border-radius:15px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:0;background:transparent;color:var(--muted);padding:10px 16px;border-radius:11px;cursor:pointer;font-weight:780;white-space:nowrap}.tab.active{background:linear-gradient(135deg,#f0f3f7,#d7dde6);color:#11161e}.content{display:none}.content.active{display:block}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,23,32,.96),rgba(11,15,21,.96));border-radius:18px;padding:17px;box-shadow:0 9px 30px rgba(0,0,0,.13);min-width:0}.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.section-title{font-size:16px;font-weight:850;letter-spacing:-.02em}.section-note{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:13px}.stat{border:1px solid #ffffff0e;background:#ffffff05;border-radius:13px;padding:12px;min-width:0}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{display:block;margin-top:5px;font-size:20px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat b.accent{color:var(--orange)}
.series-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.series-card{border:1px solid var(--line);background:linear-gradient(145deg,#151d29,#0d121a);border-radius:16px;padding:15px;cursor:pointer;transition:.18s}.series-card:hover{transform:translateY(-2px);border-color:#53647d}.series-card .game-title{font-weight:880}.series-card .play{font-size:24px;font-weight:900;margin:15px 0 4px}.series-card .mini{color:var(--muted);font-size:11px;line-height:1.65}.status{display:inline-flex;margin-top:10px;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:800;background:#1f2b38;color:var(--muted)}.status.ok{background:#173427;color:#80e2a4}.status.cached{background:#3a2d18;color:#ffc86c}.status.error{background:#3c1d24;color:#ff929a}
.chart-wrap{height:290px;margin-top:13px;position:relative}.chart-wrap canvas{width:100%;height:100%;display:block}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}.empty{padding:32px 15px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;margin-top:12px}.setup{border-color:#6e4a2d;background:linear-gradient(145deg,#251b13,#101318)}.setup code{color:#ffc085}
.game-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:13px}.game-head h2{font-size:28px;margin:0;letter-spacing:-.045em}.game-meta{color:var(--muted);font-size:11px;margin-top:6px}.subtabs{display:flex;gap:6px;overflow:auto;margin:13px 0 12px;scrollbar-width:none}.subtabs::-webkit-scrollbar{display:none}.subtab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:8px 12px;white-space:nowrap;cursor:pointer;font-size:11px;font-weight:750}.subtab.active{background:#e6ebf2;color:#11161e;border-color:#e6ebf2}.game-section{display:none}.game-section.active{display:block}
.table-wrap{overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th,.data-table td{padding:11px 12px;border-bottom:1px solid #ffffff0b;text-align:left;font-size:11px;vertical-align:middle}.data-table th{position:sticky;top:0;background:#151c26;color:var(--muted);font-size:10px;z-index:1}.data-table tr:last-child td{border-bottom:0}.data-table tbody tr:hover{background:#ffffff04}.item-name{display:flex;align-items:center;gap:10px;min-width:210px;font-weight:760}.item-img{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#222b37;border:1px solid #ffffff10;flex:0 0 auto}.item-img-fallback{width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,#26384f,#4d3729);flex:0 0 auto}.num{font-variant-numeric:tabular-nums;font-weight:700}.muted{color:var(--muted)}.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:11px}.pager button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:7px 10px;cursor:pointer}.pager button:disabled{opacity:.35;cursor:default}.pager span{font-size:10px;color:var(--muted)}.history-badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:8px;background:#203044;color:#8fc3ff}.history-badge.real{background:#17382a;color:#84e5aa}.raw-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.raw-chip{background:#ffffff05;border:1px solid #ffffff0c;border-radius:10px;padding:9px;min-width:0}.raw-chip small{display:block;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.raw-chip b{display:block;font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer{color:var(--faint);font-size:10px;text-align:center;margin-top:30px;line-height:1.6}
@media(max-width:850px){.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}.series-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-row{align-items:flex-start;flex-direction:column}.source-pill{white-space:normal}.raw-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.shell{width:calc(100% - 16px);padding-top:10px}.hero{padding:20px;border-radius:20px}.avatar,.avatar-fallback{width:60px;height:60px}.player-name{font-size:23px}.series-grid{grid-template-columns:1fr 1fr}.series-card{padding:12px}.series-card .play{font-size:19px}.game-head h2{font-size:24px}.chart-wrap{height:240px}.raw-grid{grid-template-columns:1fr}.stats{gap:7px}.stat b{font-size:18px}}
</style>

<body>
<div class="shell">
  <div class="top"><button class="back" id="backBtn">← 返回游戏库</button><div class="build">Battlefield Hub · Build v1.14.4</div></div>
  <header class="hero">
    <div class="brand">YMKF // Battlefield Combat Record</div>
    <div class="hero-row">
      <div class="identity" id="identity"></div>
      <div class="source-pill" id="sourceInfo">正在读取战绩…</div>
    </div>
  </header>
  <nav class="tabs" id="mainTabs"></nav>
  <main id="mainContent"></main>
  <div class="footer">数据：GameTools Network 公共 Battlefield Stats API + Playnite 总时长 + GameActivity 月度时间线。Battlefield V / 2042 / 6 若公共接口不提供逐局历史，会明确显示为“同步区间记录”，不会伪造成单局战报。</div>
</div>
<script>
const BUILD='1.14.4';
const DEF={
 overview:{title:'总览'},
 bf1:{title:'Battlefield 1',aliases:['battlefield1','战地1']},
 bfv:{title:'Battlefield V',aliases:['battlefieldv','battlefield5','战地v','战地5']},
 bf2042:{title:'Battlefield 2042',aliases:['battlefield2042','战地2042']},
 bf6:{title:'Battlefield 6',aliases:['battlefield6','战地6']}
};
const COLORS={bf1:'#e5954d',bfv:'#68a9ff',bf2042:'#60d7d1',bf6:'#b08cff'};
let DATA=null,GA=null,current='overview';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function n(v){if(v==null||v==='')return null;const x=Number(v);return Number.isFinite(x)?x:null} function fmt(v,d=0){const x=n(v);return x==null?'—':x.toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d})} function pct(v){const x=n(v);return x==null?'—':`${x.toFixed(x<10?2:1)}%`} function hours(sec){const x=n(sec);return x==null?'—':`${(x/3600).toFixed(x>=360000?0:1)} h`} function dur(sec){const x=n(sec);if(x==null)return'—';const h=Math.floor(x/3600),m=Math.floor((x%3600)/60),s=Math.floor(x%60);return h?`${h}h ${m}m`:m?`${m}m ${s}s`:`${s}s`} function kd(k,d){k=n(k)||0;d=n(d)||0;return d?fmt(k/d,2):k?fmt(k,2):'—'}
function norm(s){return String(s||'').toLowerCase().normalize('NFKC').replace(/[^a-z0-9\u4e00-\u9fff]+/g,'')}
function gameKeyByName(name){const k=norm(name);for(const id of ['bf1','bfv','bf2042','bf6'])if(DEF[id].aliases.some(a=>k.includes(norm(a))))return id;return null}
function prop(o,names){if(!o||typeof o!=='object')return null;for(const nm of names){const key=Object.keys(o).find(k=>k.toLowerCase()===nm.toLowerCase());if(key!=null)return o[key]}return null}
function deepProp(o,names,depth=0,seen=new Set()){if(o==null||typeof o!=='object'||depth>4||seen.has(o))return null;seen.add(o);const direct=prop(o,names);if(direct!=null)return direct;for(const v of Object.values(o)){if(v&&typeof v==='object'&&!Array.isArray(v)){const hit=deepProp(v,names,depth+1,seen);if(hit!=null)return hit}}return null}
function flattenArray(v){if(!Array.isArray(v))return[];const out=[];for(const x of v){if(Array.isArray(x))out.push(...flattenArray(x));else if(x&&typeof x==='object'){const nested=prop(x,['items','weapons','vehicles','classes','gamemodes','gadgets']);if(Array.isArray(nested))out.push(...flattenArray(nested));else out.push(x)}}return out}
function findArray(raw,names){let v=deepProp(raw,names);if(Array.isArray(v))return flattenArray(v);if(v&&typeof v==='object'){const inner=deepProp(v,names);if(Array.isArray(inner))return flattenArray(inner);const items=deepProp(v,['items','data','results','result']);if(Array.isArray(items))return flattenArray(items)}return[]}
function itemName(x){return prop(x,['name','weaponName','vehicleName','className','kitName','modeName','gamemodeName','displayName','description','id'])||'未命名'}
function itemImg(x){return prop(x,['image','imageUrl','imageURL','img','icon','iconUrl','picture','asset'])||''}
function itemVal(x,names){return prop(x,names)}
function dateText(v){if(v==null)return'—';let d;if(typeof v==='number'||/^\d{10,13}$/.test(String(v))){let z=Number(v);if(z<2e10)z*=1000;d=new Date(z)}else d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function node(id){return DATA?.games?.[id]||{}}
function rawNode(id){const g=node(id);if(g.__parsedRaw!==undefined)return g.__parsedRaw;let r=g.raw;if(typeof r==='string'){let t=r.trim();for(let i=0;i<3&&typeof t==='string';i++){try{const q=JSON.parse(t);t=q}catch{break}}r=t}g.__parsedRaw=(r&&typeof r==='object')?r:{};return g.__parsedRaw}
function normalizeRawProfile(raw){const val=names=>deepProp(raw,names),num=names=>n(val(names));const kills=num(['kills','killCount','totalKills']),deaths=num(['deaths','deathCount','totalDeaths']);let ratio=num(['killDeath','killDeathRatio','kd','kdr']);if(ratio==null&&kills!=null&&deaths>0)ratio=kills/deaths;const wins=num(['wins','winCount']),losses=num(['loses','losses','lossCount']);let wp=num(['winPercent','winPercentage','winRate']);if(wp==null&&wins!=null&&losses!=null&&wins+losses>0)wp=100*wins/(wins+losses);return{userName:val(['userName','username','name','eaid','eaId'])||'',avatar:val(['avatar','avatarUrl','avatarURL'])||'',rank:num(['rank','level','playerRank']),secondsPlayed:num(['secondsPlayed','playtimeSeconds','timeSeconds']),kills,deaths,kd:ratio,wins,losses,rounds:num(['roundsPlayed','rounds','gamesPlayed','matchesPlayed']),winPercent:wp,kpm:num(['kpm','killsPerMinute','killPerMinute']),spm:num(['spm','scorePerMinute']),accuracy:num(['accuracy','accuracyRatio','accuracyPercent']),headshots:num(['headshots','headShots','headshotKills']),longestHeadshot:num(['longestHeadShot','longestHeadshot']),score:num(['score','totalScore'])}}
function profile(id){const g=node(id),p=g.profile||{};if([p.kills,p.deaths,p.rank,p.secondsPlayed].some(v=>v!=null))return p;const recovered=normalizeRawProfile(rawNode(id));return [recovered.kills,recovered.deaths,recovered.rank,recovered.secondsPlayed].some(v=>v!=null)?recovered:p}
function playniteSeconds(id){return n(node(id).playniteSeconds)}
function sumPlaynite(){const direct=n(DATA?.playniteTotalSeconds);if(direct!=null)return direct;let total=0,seen=0;for(const id of ['bf1','bfv','bf2042','bf6']){const x=playniteSeconds(id);if(x!=null){total+=x;seen++}}return seen?total:null}
function sumProfile(){let r={kills:0,deaths:0,wins:0,losses:0,rounds:0};for(const id of ['bf1','bfv','bf2042','bf6']){const p=profile(id);for(const k of Object.keys(r))r[k]+=n(p[k])||0}return r}
function availableAvatar(){for(const id of ['bf1','bfv','bf2042','bf6']){const a=profile(id).avatar;if(a)return a}return''}
function setIdentity(){const ea=DATA?.eaId||'未配置 EAID',av=availableAvatar();$('#identity').innerHTML=`${av?`<img class="avatar" src="${esc(av)}" alt="">`:'<div class="avatar-fallback">BF</div>'}<div style="min-width:0"><div class="player-name">${esc(ea)}</div><div class="player-sub">EA / PC · Battlefield 1 · V · 2042 · 6</div></div>`;const good=Object.values(DATA?.games||{}).filter(x=>x?.status==='ok').length;$('#sourceInfo').textContent=DATA?.eaId?`GameTools Network · ${good}/4 已刷新 · ${dateText(DATA.generatedAt)}`:'未配置 EAID · 先运行 SET_BATTLEFIELD_EAID.cmd'}
function renderTabs(){const keys=['overview','bf1','bfv','bf2042','bf6'];$('#mainTabs').innerHTML=keys.map(k=>`<button class="tab ${current===k?'active':''}" data-tab="${k}">${DEF[k].title}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;history.replaceState(null,'',current==='overview'?'battlefield.html':`battlefield.html?game=${current}`);render()})}
function overviewCard(id){const p=profile(id),g=node(id),play=playniteSeconds(id);return `<div class="series-card" data-jump="${id}"><div class="game-title">${DEF[id].title}</div><div class="play">${hours(play)}</div><div class="mini">击杀 ${fmt(p.kills)} · 死亡 ${fmt(p.deaths)} · K/D ${p.kd!=null?fmt(p.kd,2):kd(p.kills,p.deaths)}<br>胜场 ${fmt(p.wins)} · 回合 ${fmt(p.rounds)}</div><span class="status ${esc(g.status||'error')}">${g.status==='ok'?'实时刷新':g.status==='cached'?'缓存':'暂无数据'}</span></div>`}
function monthlyRows(){return Array.isArray(GA?.monthlyGames)?GA.monthlyGames:[]}
function monthlyByGame(id){return monthlyRows().map(m=>{let s=0;for(const g of (m.games||[]))if(gameKeyByName(g.name)===id)s+=n(g.seconds)||0;return{month:m.month,seconds:s}})}
function monthlyTotal(id){return monthlyByGame(id).reduce((a,b)=>a+b.seconds,0)}
function renderMonthlyChart(){const c=$('#monthlyChart');if(!c)return;const box=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=Math.max(1,box.width*dpr);c.height=Math.max(1,box.height*dpr);const ctx=c.getContext('2d');ctx.scale(dpr,dpr);const W=box.width,H=box.height,pad={l:46,r:14,t:16,b:34},rows=monthlyRows();ctx.clearRect(0,0,W,H);if(!rows.length){ctx.fillStyle='#8d9aab';ctx.font='12px sans-serif';ctx.fillText('暂无 GameActivity 月度数据',20,35);return}const vals=rows.map(m=>{const x={};for(const id of ['bf1','bfv','bf2042','bf6'])x[id]=0;for(const g of (m.games||[])){const id=gameKeyByName(g.name);if(id)x[id]+=Number(g.seconds||0)/3600}return x});const max=Math.max(1,...vals.map(x=>Object.values(x).reduce((a,b)=>a+b,0)));const cw=(W-pad.l-pad.r)/rows.length,bw=Math.max(8,Math.min(34,cw*.58));ctx.strokeStyle='#273142';ctx.fillStyle='#738094';ctx.font='10px sans-serif';for(let i=0;i<=4;i++){const y=pad.t+(H-pad.t-pad.b)*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();const h=max*(1-i/4);ctx.fillText(`${h.toFixed(h>=10?0:1)}h`,4,y+3)}rows.forEach((m,i)=>{let y=H-pad.b;for(const id of ['bf1','bfv','bf2042','bf6']){const h=(vals[i][id]/max)*(H-pad.t-pad.b);ctx.fillStyle=COLORS[id];ctx.fillRect(pad.l+i*cw+(cw-bw)/2,y-h,bw,h);y-=h}ctx.save();ctx.translate(pad.l+i*cw+cw/2,H-pad.b+14);ctx.rotate(-.38);ctx.fillStyle='#8d9aab';ctx.textAlign='right';ctx.fillText(String(m.month||'').slice(2),0,0);ctx.restore()})}
function renderOverview(){const t=sumProfile(),pt=sumPlaynite(),noCfg=!DATA?.eaId,totalGames=t.wins+t.losses;$('#mainContent').innerHTML=`<section class="content active"><div class="grid">${noCfg?`<div class="card span-12 setup"><div class="section-title">先配置一次 EAID</div><div class="section-note">双击根目录 <code>SET_BATTLEFIELD_EAID.cmd</code>，输入 EA 玩家名；之后每次 RUN_SYNC 会自动刷新四代战绩，不需要账号密码。</div></div>`:''}<div class="card span-12"><div class="section-title">系列总览</div><div class="section-note">总游玩时长读取 Playnite；击杀、死亡、K/D 等累计战绩读取 Battlefield API。</div><div class="stats"><div class="stat"><small>总游玩时长</small><b class="accent">${hours(pt)}</b></div><div class="stat"><small>总击杀</small><b>${fmt(t.kills)}</b></div><div class="stat"><small>总死亡</small><b>${fmt(t.deaths)}</b></div><div class="stat"><small>K/D</small><b>${kd(t.kills,t.deaths)}</b></div><div class="stat"><small>总胜场</small><b>${fmt(t.wins)}</b></div><div class="stat"><small>总负场</small><b>${fmt(t.losses)}</b></div><div class="stat"><small>总回合</small><b>${fmt(t.rounds)}</b></div><div class="stat"><small>综合胜率</small><b>${totalGames?pct(100*t.wins/totalGames):'—'}</b></div></div><div class="series-grid">${['bf1','bfv','bf2042','bf6'].map(overviewCard).join('')}</div></div><div class="card span-12"><div class="section-title">每月各战地游玩时长</div><div class="section-note">按本站 GameActivity 的真实日期记录分配到月份；顶部总游玩时长仍以 Playnite 累计值为准。</div><div class="chart-wrap"><canvas id="monthlyChart"></canvas></div><div class="legend">${['bf1','bfv','bf2042','bf6'].map(id=>`<span><i style="background:${COLORS[id]}"></i>${DEF[id].title}</span>`).join('')}</div></div></div></section>`;document.querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>{current=x.dataset.jump;render()});requestAnimationFrame(renderMonthlyChart)}
function statCells(p,g){return[{k:'总游玩时长',v:hours(n(g?.playniteSeconds)),a:1},{k:'击杀',v:fmt(p.kills)},{k:'死亡',v:fmt(p.deaths)},{k:'K/D',v:p.kd!=null?fmt(p.kd,2):kd(p.kills,p.deaths)},{k:'实际战斗时长',v:hours(p.secondsPlayed)},{k:'KPM',v:fmt(p.kpm,2)},{k:'SPM',v:fmt(p.spm,1)},{k:'胜率',v:p.winPercent!=null?pct(p.winPercent):'—'},{k:'胜 / 负',v:`${fmt(p.wins)} / ${fmt(p.losses)}`},{k:'回合',v:fmt(p.rounds)},{k:'命中率',v:p.accuracy!=null?pct(p.accuracy):'—'},{k:'爆头',v:fmt(p.headshots)},{k:'最远爆头',v:p.longestHeadshot!=null?`${fmt(p.longestHeadshot,1)} m`:'—'}].map(x=>`<div class="stat"><small>${x.k}</small><b class="${x.a?'accent':''}">${x.v}</b></div>`).join('')}
function sectionNav(id,available){const all=[['overview','概览'],['history','记录'],['weapons','武器'],['classes','兵种'],['vehicles','载具'],['gamemodes','模式'],['gadgets','装备']];return `<div class="subtabs">${all.map(([k,l],i)=>`<button class="subtab ${i===0?'active':''}" data-sub="${k}">${l}${available[k]!=null?` · ${available[k]}`:''}</button>`).join('')}</div>`}
function simpleRaw(p){const rows=[];for(const [k,v] of Object.entries(p||{})){if(v==null||typeof v==='object')continue;rows.push(`<div class="raw-chip"><small>${esc(k)}</small><b>${esc(v)}</b></div>`)}return rows.slice(0,18).join('')}
function collectionRows(kind,arr){return arr.map(x=>{const img=itemImg(x),name=itemName(x);const kills=itemVal(x,['kills','killCount']),deaths=itemVal(x,['deaths','deathCount']),time=itemVal(x,['seconds','secondsPlayed','timePlayed','time']),kpm=itemVal(x,['kpm','killsPerMinute']),acc=itemVal(x,['accuracy','accuracyPercent']),hs=itemVal(x,['headshots','headShots']),score=itemVal(x,['score','totalScore']),wins=itemVal(x,['wins']),losses=itemVal(x,['loses','losses']),destroyed=itemVal(x,['destroyed','vehiclesDestroyed','destroyedVehicles']);let cells='';if(kind==='weapons')cells=`<td class="num">${fmt(kills)}</td><td>${fmt(kpm,2)}</td><td>${acc!=null?pct(acc):'—'}</td><td>${fmt(hs)}</td><td>${time!=null?dur(time):'—'}</td>`;else if(kind==='classes')cells=`<td class="num">${fmt(kills)}</td><td>${fmt(deaths)}</td><td>${kd(kills,deaths)}</td><td>${fmt(score)}</td><td>${time!=null?dur(time):'—'}</td>`;else if(kind==='vehicles')cells=`<td class="num">${fmt(kills)}</td><td>${fmt(destroyed)}</td><td>${fmt(kpm,2)}</td><td>${time!=null?dur(time):'—'}</td><td>${fmt(score)}</td>`;else cells=`<td>${fmt(wins)}</td><td>${fmt(losses)}</td><td>${fmt(kills)}</td><td>${fmt(score)}</td><td>${time!=null?dur(time):'—'}</td>`;return `<tr><td><div class="item-name">${img?`<img class="item-img" src="${esc(img)}" alt="" onerror="this.outerHTML='<span class=&quot;item-img-fallback&quot;></span>'">`:'<span class="item-img-fallback"></span>'}<span>${esc(name)}</span></div></td>${cells}</tr>`})}
function tableHead(kind){if(kind==='weapons')return['武器','击杀','KPM','命中率','爆头','使用时长'];if(kind==='classes')return['兵种','击杀','死亡','K/D','分数','时长'];if(kind==='vehicles')return['载具','击杀','摧毁','KPM','时长','分数'];return[kind==='gamemodes'?'模式':'装备','胜','负','击杀','分数','时长']}
function pagedTable(hostId,kind,arr,page=1){const host=document.getElementById(hostId);if(!host)return;const per=12,pages=Math.max(1,Math.ceil(arr.length/per));page=Math.min(Math.max(1,page),pages);if(!arr.length){host.innerHTML='<div class="empty">接口暂未返回这一分类的数据。</div>';return}const slice=arr.slice((page-1)*per,page*per),heads=tableHead(kind);host.innerHTML=`<div class="table-wrap"><table class="data-table"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${collectionRows(kind,slice).join('')}</tbody></table></div><div class="pager"><button ${page<=1?'disabled':''} data-p="${page-1}">上一页</button><span>${page} / ${pages} · ${arr.length} 条</span><button ${page>=pages?'disabled':''} data-p="${page+1}">下一页</button></div>`;host.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>pagedTable(hostId,kind,arr,Number(b.dataset.p)))}
function sessionStats(s){return prop(s,['stats','sessionStats'])||s}
function renderHistory(hostId,id,page=1){const host=document.getElementById(hostId);if(!host)return;const g=node(id),rawSessions=findArray(rawNode(id),['sessions','playerSessions']),savedSessions=Array.isArray(g.trueSessions)?g.trueSessions:[],sessions=savedSessions.length?savedSessions:rawSessions,real=id==='bf1'&&sessions.length;const arr=real?[...sessions].reverse():[...(g.intervals||[])].reverse(),per=10,pages=Math.max(1,Math.ceil(arr.length/per));page=Math.min(Math.max(1,page),pages);if(!arr.length){host.innerHTML=`<div class="empty">${id==='bf1'?'当前 API 没有返回可显示的最近战局。':'从本版开始，每次 RUN_SYNC 若累计战绩发生变化，会在这里留下同步区间差值。'}</div>`;return}const rows=arr.slice((page-1)*per,page*per).map(s=>{const z=sessionStats(s),tm=real?(prop(s,['timeStamp','timestamp','date','createdAt'])||''):(s.endAt||''),server=real?(prop(s,['serverName','server','name'])||'—'):'同步区间',sec=prop(z,['timePlayed','secondsPlayed','duration','seconds']),kills=prop(z,['kills']),deaths=prop(z,['deaths']),wins=prop(z,['wins']),losses=prop(z,['losses']),score=prop(z,['score']);return `<tr><td>${dateText(tm)}</td><td>${esc(server)}</td><td>${sec!=null?dur(sec):'—'}</td><td>${fmt(kills)}</td><td>${fmt(deaths)}</td><td>${kd(kills,deaths)}</td><td>${fmt(wins)} / ${fmt(losses)}</td><td>${fmt(score)}</td></tr>`}).join('');host.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:10px"><div class="section-note">${real?'GameTools 返回的 Battlefield 1 真实 session。':'相邻两次 RUN_SYNC 的累计数据差值，可用于看阶段变化；不是伪造的单局战报。'}</div><span class="history-badge ${real?'real':''}">${real?'真实战局':'同步区间'}</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>时间</th><th>${real?'服务器':'类型'}</th><th>时长</th><th>击杀</th><th>死亡</th><th>K/D</th><th>胜 / 负</th><th>分数</th></tr></thead><tbody>${rows}</tbody></table></div><div class="pager"><button ${page<=1?'disabled':''} data-hp="${page-1}">上一页</button><span>${page} / ${pages} · ${arr.length} 条</span><button ${page>=pages?'disabled':''} data-hp="${page+1}">下一页</button></div>`;host.querySelectorAll('[data-hp]').forEach(b=>b.onclick=()=>renderHistory(hostId,id,Number(b.dataset.hp)))}
function renderGame(id){const g=node(id),p=profile(id),raw=rawNode(id),cols={weapons:findArray(raw,['weapons','weaponStats']),classes:findArray(raw,['classes','kits','classStats']),vehicles:findArray(raw,['vehicles','vehicleStats']),gamemodes:findArray(raw,['gamemodes','gameModes','modes']),gadgets:findArray(raw,['gadgets','gadgetStats'])};const bf1Sessions=(Array.isArray(g.trueSessions)&&g.trueSessions.length)?g.trueSessions:findArray(raw,['sessions','playerSessions']);const avail={history:(id==='bf1'?bf1Sessions:(g.intervals||[])).length,weapons:cols.weapons.length,classes:cols.classes.length,vehicles:cols.vehicles.length,gamemodes:cols.gamemodes.length,gadgets:cols.gadgets.length};$('#mainContent').innerHTML=`<section class="content active"><div class="game-head"><div><h2>${DEF[id].title}</h2><div class="game-meta">${g.status==='ok'?'实时刷新':g.status==='cached'?'当前使用缓存':'暂无在线数据'} · ${dateText(g.updatedAt)}${p.rank!=null?` · Rank ${fmt(p.rank)}`:''}</div></div><span class="status ${esc(g.status||'error')}">${esc(g.status||'error')}</span></div>${sectionNav(id,avail)}<div class="game-section active" data-panel="overview"><div class="grid"><div class="card span-12"><div class="section-title">核心数据</div><div class="stats">${statCells(p,g)}</div></div><div class="card span-7"><div class="section-title">时长口径</div><div class="section-note">Playnite 负责“总共玩了多久”；Battlefield API 的时长是实际战斗时长；GameActivity 负责按月份还原游玩时间。</div><div class="stats"><div class="stat"><small>Playnite 总时长</small><b class="accent">${hours(n(g.playniteSeconds))}</b></div><div class="stat"><small>实际战斗时长</small><b>${hours(p.secondsPlayed)}</b></div><div class="stat"><small>GameActivity 统计时长</small><b>${hours(monthlyTotal(id))}</b></div></div></div><div class="card span-5"><div class="section-title">接口附加字段</div><div class="raw-grid">${simpleRaw(p)||'<div class="section-note">暂无</div>'}</div></div></div></div><div class="game-section" data-panel="history"><div class="card"><div class="section-title">${id==='bf1'?'最近战局':'同步区间记录'}</div><div id="historyHost"></div></div></div>${['weapons','classes','vehicles','gamemodes','gadgets'].map(k=>`<div class="game-section" data-panel="${k}"><div class="card"><div class="section-title">${{weapons:'武器数据',classes:'兵种数据',vehicles:'载具数据',gamemodes:'游戏模式',gadgets:'装备 / Gadget'}[k]}</div><div class="section-note">按接口返回的累计统计展示，每页 12 条。</div><div id="${k}Host"></div></div></div>`).join('')}</section>`;document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-sub]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('active',x.dataset.panel===b.dataset.sub));const k=b.dataset.sub;if(k==='history')renderHistory('historyHost',id);else if(cols[k])pagedTable(k+'Host',k,cols[k])})}
function render(){renderTabs();setIdentity();if(current==='overview')renderOverview();else renderGame(current)}
async function load(){try{const [d,g]=await Promise.all([fetch('../data/battlefield.json?v='+BUILD,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),fetch('../data/gameactivity-stats.json?v='+BUILD,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]);DATA=d||{games:{}};GA=g||{};const q=new URLSearchParams(location.search).get('game');if(q&&DEF[q])current=q;render();window.addEventListener('resize',()=>{if(current==='overview')renderMonthlyChart()})}catch(e){DATA={games:{}};GA={};render();$('#sourceInfo').textContent='读取数据失败：'+e.message}}
$('#backBtn').onclick=()=>{if(history.length>1)history.back();else location.href='../index.html'};load();
</script>
