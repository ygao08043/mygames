<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>osu! · 战绩详情</title>
<style>
:root{color-scheme:dark;--bg:#080a10;--panel:#111521;--panel2:#161b29;--line:#262d3e;--text:#f5f7fb;--muted:#98a3b8;--pink:#ff66aa;--blue:#67b7ff;--good:#83e6bd;--gold:#ffd37a;--bad:#ff8d9b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#29172b 0,transparent 32%),radial-gradient(circle at 5% 10%,#10213a 0,transparent 30%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:1320px;margin:0 auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{color:#d8dfef;text-decoration:none}.build{font-size:11px;color:var(--muted)}.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);gap:14px}.card{background:linear-gradient(180deg,rgba(20,25,38,.96),rgba(13,17,27,.96));border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 45px rgba(0,0,0,.25)}.profile{padding:22px;display:flex;align-items:center;gap:18px;min-height:150px}.avatar{width:92px;height:92px;border-radius:22px;object-fit:cover;background:#202737;border:1px solid #394158}.profile h1{font-size:30px;margin:0 0 3px}.sub{color:var(--muted)}.modebar{display:flex;gap:8px;margin-top:14px}.modebtn,.tabbtn,.sortbtn,.keybtn{appearance:none;border:1px solid var(--line);background:#111827;color:#cfd6e6;border-radius:999px;padding:8px 13px;cursor:pointer}.modebtn.active,.tabbtn.active,.keybtn.active{background:linear-gradient(135deg,#ff5fa2,#a65cff);border-color:transparent;color:white}.summary{padding:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:15px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}.metric .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.metric .value{font-size:24px;font-weight:750;margin-top:4px}.metric .small{font-size:12px;color:var(--muted)}.section{margin-top:14px;padding:18px}.section h2{margin:0;font-size:18px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.muted{color:var(--muted)}.trendbox{height:220px;padding:8px 4px 0}.trendbox canvas{width:100%;height:100%}.trendcontrols{display:flex;gap:7px;flex-wrap:wrap}.tabrow{display:flex;gap:8px;margin-top:16px}.panel{display:none}.panel.active{display:block}.bestcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.scorecard{overflow:hidden;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:15px}.cover{height:85px;background:#202633 center/cover no-repeat;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(5,7,12,.8))}.rankno{position:absolute;left:10px;bottom:7px;z-index:1;font-size:18px;font-weight:800}.scorebody{padding:11px}.song{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.diff{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pp{font-size:19px;font-weight:800;color:#ffaed2;margin-top:7px}.line{display:flex;gap:8px;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}.controls{display:grid;grid-template-columns:minmax(180px,1.3fr) auto auto auto;gap:8px;margin-bottom:12px}.controls input,.controls select{border:1px solid var(--line);background:#0e1320;color:#e8edf7;border-radius:10px;padding:9px 11px;outline:none}.keys{display:flex;gap:6px;flex-wrap:wrap}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:930px}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid #232a39;white-space:nowrap}th{font-size:11px;color:var(--muted);background:#111725;position:sticky;top:0;z-index:1}td.titlecell{max-width:290px;white-space:normal}.badge{display:inline-flex;padding:2px 7px;border-radius:999px;background:#232b3d;color:#dce3f1;font-size:11px}.badge.pink{background:#4a2138;color:#ffb4d5}.badge.good{background:#143d35;color:#9cf1d1}.empty{padding:35px;text-align:center;color:var(--muted)}.note{font-size:12px;color:var(--muted);margin-top:10px}@media(max-width:1000px){.hero{grid-template-columns:1fr}.bestcards{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{grid-template-columns:1fr 1fr}}@media(max-width:620px){.wrap{padding:14px}.profile{align-items:flex-start}.avatar{width:72px;height:72px}.profile h1{font-size:24px}.summary{grid-template-columns:1fr 1fr}.bestcards{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.section{padding:13px}}

/* v1.13.14 · song jacket thumbnails */
.song-jacket{width:50px;height:50px;border-radius:9px;object-fit:cover;display:block;flex:0 0 auto;background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.025));border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.jacket-placeholder{display:grid;place-items:center;color:var(--muted);font-size:17px;font-weight:900}
.cover-cell{width:66px;min-width:66px;padding:7px 6px 7px 10px!important}.cover-head{width:66px;min-width:66px;text-align:center!important}.cover-cell .song-jacket{margin:auto}
.score-card.has-jacket{position:relative;padding-left:78px;min-height:118px}.score-card .card-jacket{position:absolute;left:14px;top:14px;width:52px;height:52px}
@media(max-width:620px){.song-jacket{width:44px;height:44px;border-radius:8px}.cover-cell,.cover-head{width:56px;min-width:56px}.score-card.has-jacket{padding-left:70px}.score-card .card-jacket{left:12px;top:12px;width:46px;height:46px}}
</style>
</head>
<body><main class="wrap">
<div class="topbar"><a class="back" href="../index.html">← 返回游戏库</a><div class="build">Build v1.13.14</div></div>
<div class="hero">
  <section class="card profile"><img id="avatar" class="avatar" alt=""><div><h1 id="username">osu!</h1><div id="userMeta" class="sub">等待同步</div><div class="modebar"><button class="modebtn active" data-mode="mania">osu!mania</button><button class="modebtn" data-mode="osu">osu!standard</button></div></div></section>
  <section class="card summary"><div class="metric"><div class="label">Performance</div><div class="value" id="mPP">—</div><div class="small">PP</div></div><div class="metric"><div class="label">Global Rank</div><div class="value" id="mGlobal">—</div></div><div class="metric"><div class="label">Country Rank</div><div class="value" id="mCountry">—</div></div><div class="metric"><div class="label">Accuracy</div><div class="value" id="mAcc">—</div></div></section>
</div>

<section class="card section">
 <div class="sectionhead"><div><h2 id="trendTitle">osu!mania 趋势</h2><div class="muted" id="trendSub">每次 RUN_SYNC 自动记录当天快照</div></div><div class="trendcontrols"><button class="tabbtn active" data-trend="pp">PP</button><button class="tabbtn" data-trend="globalRank">全球排名</button><button class="tabbtn" data-trend="accuracy">Accuracy</button></div></div>
 <div class="trendbox"><canvas id="trendCanvas"></canvas></div>
</section>

<div class="tabrow"><button class="tabbtn active" data-panel="best">Best 100</button><button class="tabbtn" data-panel="recent">最近成绩</button></div>

<section class="panel active" id="panel-best">
 <section class="card section"><div class="sectionhead"><div><h2>Best Performance</h2><div class="muted">官方 API 返回的当前 Best，最多 100 条</div></div><div id="bestCount" class="muted"></div></div><div class="bestcards" id="bestCards"></div></section>
 <section class="card section"><div class="controls"><input id="search" placeholder="搜索曲名 / 谱师 / 难度"><div class="keys" id="keyFilters"></div><select id="rankFilter"><option value="">全部 Rank</option><option>SSH</option><option>SS</option><option>SH</option><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option><option>F</option></select><select id="sort"><option value="pp">PP ↓</option><option value="accuracy">ACC ↓</option><option value="stars">星数 ↓</option><option value="score">Score ↓</option><option value="date">时间 ↓</option></select></div><div class="tablewrap"><table><thead><tr><th class="cover-head">曲绘</th><th>#</th><th>曲目</th><th>Key</th><th>星数</th><th>PP</th><th>ACC</th><th>Score</th><th>Rank</th><th>Mods</th><th>时间</th></tr></thead><tbody id="bestBody"></tbody></table></div></section>
</section>

<section class="panel" id="panel-recent"><section class="card section"><div class="sectionhead"><div><h2>最近成绩</h2><div class="muted">仅显示通过成绩，最多 50 条</div></div><div id="recentCount" class="muted"></div></div><div class="tablewrap"><table><thead><tr><th class="cover-head">曲绘</th><th>时间</th><th>曲目</th><th>Key</th><th>星数</th><th>PP</th><th>ACC</th><th>Score</th><th>Rank</th><th>Mods</th><th>状态</th></tr></thead><tbody id="recentBody"></tbody></table></div></section></section>
<div class="note" id="sourceNote"></div>
</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let DATA=null, MODE='mania', TREND='pp', KEY='', PANEL='best';
const fmt=n=>n==null||Number.isNaN(Number(n))?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:4});
const pp=n=>n==null?'—':`${Number(n).toFixed(2)} pp`;
const acc=n=>n==null?'—':`${Number(n).toFixed(2)}%`;
const dt=s=>{if(!s)return '—';const d=new Date(s);return Number.isNaN(d.getTime())?s:d.toLocaleString('zh-CN',{hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function modeData(){return DATA?.modes?.[MODE]||{statistics:{},best:[],recent:[],trend:[]}}
function modText(s){return (s.mods&&s.mods.length)?s.mods.join(' '):'NM'}
function keyText(s){return MODE==='mania'?(s.keyCount?`${s.keyCount}K`:'—'):'—'}
function updateHero(){const d=modeData(), st=d.statistics||{}, u=DATA.user||{};$('#username').textContent=u.username||'osu!';$('#avatar').src=u.avatarUrl||'https://osu.ppy.sh/images/layout/avatar-guest.png';$('#userMeta').textContent=`UID ${u.id??'—'} · ${u.countryCode||'—'} · ${MODE==='mania'?'osu!mania':'osu!standard'} · ${fmt(st.playCount)} plays`;$('#mPP').textContent=st.pp==null?'—':fmt(st.pp);$('#mGlobal').textContent=st.globalRank?`#${fmt(st.globalRank)}`:'—';$('#mCountry').textContent=st.countryRank?`#${fmt(st.countryRank)}`:'—';$('#mAcc').textContent=acc(st.accuracy);$('#trendTitle').textContent=`${MODE==='mania'?'osu!mania':'osu!standard'} 趋势`;}
function drawTrend(){const canvas=$('#trendCanvas'), box=canvas.parentElement, rect=box.getBoundingClientRect(), dpr=Math.max(1,window.devicePixelRatio||1);canvas.width=Math.max(300,Math.floor(rect.width*dpr));canvas.height=Math.max(160,Math.floor(rect.height*dpr));const c=canvas.getContext('2d');c.scale(dpr,dpr);const w=canvas.width/dpr,h=canvas.height/dpr;c.clearRect(0,0,w,h);const rawTrend=modeData().trend;let rows=(Array.isArray(rawTrend)?rawTrend:(rawTrend&&typeof rawTrend==='object'?[rawTrend]:[])).filter(x=>x&&x[TREND]!=null);if(!rows.length){c.fillStyle='#98a3b8';c.font='13px system-ui';c.textAlign='center';c.fillText('暂无历史快照，运行同步后会开始记录',w/2,h/2);return;}const vals=rows.map(x=>Number(x[TREND]));let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=Math.max(1,Math.abs(lo)*.02);hi+=Math.max(1,Math.abs(hi)*.02)}const pad={l:55,r:18,t:16,b:34};const inv=TREND==='globalRank';const y=v=>pad.t+(inv?(v-lo):(hi-v))/(hi-lo)*(h-pad.t-pad.b), x=i=>pad.l+(rows.length===1?.5:i/(rows.length-1))*(w-pad.l-pad.r);c.strokeStyle='#242c3d';c.lineWidth=1;for(let i=0;i<4;i++){const yy=pad.t+i*(h-pad.t-pad.b)/3;c.beginPath();c.moveTo(pad.l,yy);c.lineTo(w-pad.r,yy);c.stroke()}c.strokeStyle='#ff66aa';c.lineWidth=2.5;c.beginPath();rows.forEach((r,i)=>{const xx=x(i),yy=y(Number(r[TREND]));i?c.lineTo(xx,yy):c.moveTo(xx,yy)});c.stroke();rows.forEach((r,i)=>{c.fillStyle='#ffd4e7';c.beginPath();c.arc(x(i),y(Number(r[TREND])),3,0,Math.PI*2);c.fill()});c.fillStyle='#98a3b8';c.font='11px system-ui';c.textAlign='center';const labels=[0,Math.floor((rows.length-1)/2),rows.length-1].filter((v,i,a)=>a.indexOf(v)===i);labels.forEach(i=>c.fillText(rows[i].date||'',x(i),h-10));c.textAlign='right';c.fillText(TREND==='accuracy'?`${hi.toFixed(2)}%`:fmt(hi),pad.l-8,pad.t+4);c.fillText(TREND==='accuracy'?`${lo.toFixed(2)}%`:fmt(lo),pad.l-8,h-pad.b+4);}
function renderCards(){const best=modeData().best||[];$('#bestCount').textContent=`${best.length} 条`;$('#bestCards').innerHTML=best.slice(0,10).map((s,i)=>`<article class="scorecard"><div class="cover" style="background-image:url('${esc(s.cover)}')"><div class="rankno">#${i+1}</div></div><div class="scorebody"><div class="song">${esc(s.title||'[deleted beatmap]')}</div><div class="diff">${esc(s.artist)} · ${esc(s.difficulty)} ${MODE==='mania'&&s.keyCount?`· ${s.keyCount}K`:''}</div><div class="pp">${pp(s.pp)}</div><div class="line"><span>${acc(s.accuracy)}</span><span>${s.stars==null?'—':Number(s.stars).toFixed(2)+'★'}</span></div><div class="line"><span>${esc(s.rank||'—')}</span><span>${esc(modText(s))}</span></div></div></article>`).join('')||'<div class="empty">暂无 Best 数据</div>';}
function renderKeyFilters(){const el=$('#keyFilters');if(MODE!=='mania'){el.innerHTML='';return;}const best=modeData().best||[], keys=[...new Set(best.map(x=>x.keyCount).filter(Boolean))].sort((a,b)=>a-b);el.innerHTML=[['','全部'],...keys.map(k=>[String(k),`${k}K`])].map(([v,t])=>`<button class="keybtn ${KEY===v?'active':''}" data-key="${v}">${t}</button>`).join('');$$('[data-key]').forEach(b=>b.onclick=()=>{KEY=b.dataset.key;renderBestTable();renderKeyFilters()})}
function filteredBest(){let rows=[...(modeData().best||[])], q=$('#search').value.trim().toLowerCase(), rank=$('#rankFilter').value, sort=$('#sort').value;if(q)rows=rows.filter(s=>`${s.title} ${s.artist} ${s.creator} ${s.difficulty}`.toLowerCase().includes(q));if(KEY)rows=rows.filter(s=>String(s.keyCount||'')===KEY);if(rank)rows=rows.filter(s=>String(s.rank||'').toUpperCase()===rank);const val=(s,k)=>k==='pp'?Number(s.pp??-1):k==='accuracy'?Number(s.accuracy??-1):k==='stars'?Number(s.stars??-1):k==='score'?Number(s.totalScore??-1):new Date(s.endedAt||0).getTime();rows.sort((a,b)=>val(b,sort)-val(a,sort));return rows;}
function jacketHtml(s){const u=s.cover||'';return u?`<img class="song-jacket" src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;song-jacket jacket-placeholder&quot;>♫</div>'">`:`<div class="song-jacket jacket-placeholder">♫</div>`}
function rowHtml(s,i,recent=false){return `<tr><td class="cover-cell">${jacketHtml(s)}</td><td>${recent?dt(s.endedAt):i+1}</td><td class="titlecell"><b>${esc(s.title||'[deleted beatmap]')}</b><div class="muted">${esc(s.artist)} · ${esc(s.difficulty)}</div></td><td>${MODE==='mania'&&s.keyCount?`<span class="badge pink">${s.keyCount}K</span>`:'—'}</td><td>${s.stars==null?'—':Number(s.stars).toFixed(2)+'★'}</td><td>${pp(s.pp)}</td><td>${acc(s.accuracy)}</td><td>${fmt(s.totalScore)}</td><td><span class="badge">${esc(s.rank||'—')}</span></td><td>${esc(modText(s))}</td><td>${recent?`<span class="badge ${s.passed?'good':''}">${s.passed?'PASS':'FAIL'}</span>`:dt(s.endedAt)}</td></tr>`}
function renderBestTable(){const rows=filteredBest();$('#bestBody').innerHTML=rows.map((s,i)=>rowHtml(s,i,false)).join('')||'<tr><td colspan="11" class="empty">没有符合筛选条件的成绩</td></tr>'}
function renderRecent(){const rows=modeData().recent||[];$('#recentCount').textContent=`${rows.length} 条`;$('#recentBody').innerHTML=rows.map((s,i)=>rowHtml(s,i,true)).join('')||'<tr><td colspan="11" class="empty">暂无最近成绩</td></tr>'}
function render(){KEY='';updateHero();renderCards();renderKeyFilters();renderBestTable();renderRecent();drawTrend();$$('.modebtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===MODE));}
$$('.modebtn').forEach(b=>b.onclick=()=>{MODE=b.dataset.mode;render()});$$('[data-trend]').forEach(b=>b.onclick=()=>{TREND=b.dataset.trend;$$('[data-trend]').forEach(x=>x.classList.toggle('active',x===b));drawTrend()});$$('[data-panel]').forEach(b=>b.onclick=()=>{PANEL=b.dataset.panel;$$('[data-panel]').forEach(x=>x.classList.toggle('active',x===b));$$('.panel').forEach(x=>x.classList.toggle('active',x.id===`panel-${PANEL}`))});['search','rankFilter','sort'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',renderBestTable));window.addEventListener('resize',()=>drawTrend());
fetch(`../data/rhythm/osu.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(d=>{DATA=d;$('#sourceNote').textContent=`数据源：${d.source?.provider||'osu! API v2'} · API ${d.source?.apiVersion||''} · Best 每模式最多 ${d.source?.bestLimitPerMode||100} 条 · 最近每模式最多 ${d.source?.recentLimitPerMode||50} 条 · ${d.generatedAt?`最后同步 ${dt(d.generatedAt)}`:'尚未完成首次同步'}`;render()}).catch(e=>{$('#username').textContent='osu! 数据加载失败';$('#userMeta').textContent=e.message;drawTrend()});
</script>

<script id="ymkf-return-to-library">
(function(){
  const a=document.querySelector('a.back[href="../index.html"]');
  if(!a)return;
  a.addEventListener('click',function(e){
    try{
      if(sessionStorage.getItem('ymkfLibraryReturnPending')==='1'&&history.length>1){e.preventDefault();history.back();return}
    }catch(_){ }
    // Direct/opened-alone detail pages keep the normal ../index.html fallback.
  });
})();
</script>
</body></html>
