<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goose Goose Duck · 战绩</title>
<style>
:root{color-scheme:dark;--bg:#0b1016;--panel:#121a24;--panel2:#182331;--line:#283748;--text:#edf4fa;--muted:#91a4b7;--cyan:#6dd8ff;--green:#65e69a;--yellow:#ffd978;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1118,#080c11 45%,#0a0f15);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.back{color:var(--muted);text-decoration:none}.hero{display:flex;gap:18px;align-items:center;margin:20px 0}.avatar{width:78px;height:78px;border-radius:18px;object-fit:cover;background:#1d2a38;border:1px solid var(--line)}h1{font-size:30px;margin:0}.sub{color:var(--muted);margin-top:4px}.pill{display:inline-flex;padding:4px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.pill.ok{color:var(--green);border-color:#2f7350}
.nav{display:flex;gap:8px;overflow-x:auto;margin:18px 0}.nav button,.sortBtn,.pageBtn,select{border:1px solid var(--line);background:#111a24;color:var(--muted);border-radius:10px;padding:9px 13px}.nav button,.sortBtn,.pageBtn{cursor:pointer}.nav button.active{background:#1b2b39;color:#fff;border-color:#40718a}.page{display:none}.page.active{display:block}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 10px}.notice{background:#171d24;border:1px solid #5c5034;color:#eadca9;border-radius:12px;padding:12px;margin:14px 0}.muted{color:var(--muted)}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--muted);background:var(--panel2);position:sticky;top:0;z-index:1}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#16202c}.roleCell{display:flex;align-items:center;gap:10px;font-weight:700}.roleIcon{width:38px;height:38px;object-fit:contain}.sortBtn{border:0;background:transparent;padding:0;font-weight:700;display:inline-flex;gap:5px;align-items:center}.sortBtn.active{color:var(--text)}.sortMark{color:var(--cyan);min-width:12px}.filters{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;margin:10px 0 14px}.filters select{min-width:130px;color:var(--text);cursor:pointer}
.matches{display:grid;gap:10px}.match{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.matchHead{display:grid;grid-template-columns:minmax(230px,2fr) .75fr .8fr .75fr .75fr;gap:10px;align-items:center;padding:12px 14px}.player{display:flex;align-items:center;gap:12px;min-width:0}.matchRoleIcon{width:48px;height:48px;object-fit:contain;flex:0 0 48px}.playerMain{min-width:0}.playerMain b{display:block;font-size:16px}.playerMain span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result{font-weight:700}.result.win{color:var(--green)}.result.loss{color:var(--red)}.metric .label{display:block;color:var(--muted);font-size:12px}.detailBox{border-top:1px solid var(--line)}details{background:#101720}details>summary{cursor:pointer;list-style:none;padding:11px 14px;color:var(--cyan);font-weight:700}details>summary::-webkit-details-marker{display:none}.detailInner{padding:0 14px 16px}.detailFields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:8px 0}.field{background:#151f2b;border:1px solid var(--line);border-radius:10px;padding:9px}.field .k{font-size:11px;color:var(--muted)}.field .v{margin-top:2px;font-weight:650;white-space:normal;word-break:break-word}.detailSection{margin-top:14px}.detailSection h3{font-size:14px;margin:0 0 8px}.miniCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.miniCard{background:#151f2b;border:1px solid var(--line);border-radius:10px;padding:9px;white-space:pre-wrap;word-break:break-word}.detailTable{overflow:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0}.detailTable table{min-width:520px}.raw{max-height:360px;overflow:auto;background:#0c1219;border:1px solid var(--line);border-radius:10px;padding:11px;white-space:pre-wrap;word-break:break-word;color:#c8d3de;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.noDetail{border-top:1px solid var(--line);padding:10px 14px;color:var(--muted);font-size:12px}.pages{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0}.pageBtn:disabled{opacity:.45;cursor:default}.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px}.count{color:var(--muted);font-size:12px;margin-left:7px}
@media(max-width:760px){.matchHead{grid-template-columns:1fr 1fr}.player{grid-column:1/-1}.hero{align-items:flex-start}.wrap{padding:16px}.avatar{width:64px;height:64px}h1{font-size:25px}}
</style>
<!-- YMKF site icon hf26 -->
<link rel="icon" type="image/svg+xml" href="../assets/playnite/site-icon.svg">
<link rel="shortcut icon" href="../assets/playnite/site-icon.svg">
<link rel="apple-touch-icon" href="../assets/playnite/site-icon.svg">
<link rel="manifest" href="../assets/playnite/site.webmanifest">
<meta name="theme-color" content="#10131d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YMKF">
<!-- /YMKF site icon hf26 -->
</head>
<body><main class="wrap">
<a class="back" href="../index.html">← 返回游戏库</a>
<div class="hero"><img id="avatar" class="avatar" alt=""><div><h1>Goose Goose Duck</h1><div id="profileName" class="sub">鹅鸭杀战绩</div><div style="margin-top:8px"><span id="bindPill" class="pill">读取中</span></div></div></div>
<div class="nav"><button class="active" data-page="roles">身份统计</button><button data-page="matches">全部对局记录</button></div>
<section id="roles" class="page active"><div class="section"><h2>身份统计 <span id="roleCount" class="count"></span></h2><div class="tableWrap"><table><thead><tr><th>身份</th><th><button class="sortBtn active" data-sort="uses">使用次数 <span class="sortMark"></span></button></th><th><button class="sortBtn" data-sort="wins">胜场 <span class="sortMark"></span></button></th><th><button class="sortBtn" data-sort="losses">败场 <span class="sortMark"></span></button></th><th><button class="sortBtn" data-sort="winRate">胜率 <span class="sortMark"></span></button></th></tr></thead><tbody id="roleBody"></tbody></table></div></div><div class="section"><div class="notice">身份统计按当前已缓存的官方对局记录汇总；同步程序会持续合并以后能从 Gaggle 官方页面取得的对局，不会因为页面只显示近期记录而删除旧缓存。</div></div></section>
<section id="matches" class="page"><div id="matchNotice"></div><div class="section"><h2>全部对局记录 <span id="matchCount" class="count"></span></h2><div class="muted" style="margin-bottom:8px">默认按时间：新 → 旧</div><div class="filters"><select id="roleFilter"><option value="">全部身份</option></select><select id="resultFilter"><option value="">全部结果</option><option value="win">胜利</option><option value="loss">失败</option></select><select id="modeFilter"><option value="">全部模式</option></select><select id="playerFilter"><option value="">全部玩家人数</option></select><select id="roundFilter"><option value="">全部存活回合</option></select></div><div id="matchList" class="matches"></div><div id="matchPages" class="pages"></div></div></section>
<div class="sub" style="margin-top:22px">Build v1.16.14</div>
</main>
<script>
const DATA='../data/goose-goose-duck.json?v=1.16.14';
let D=null,page=1;const PAGE=20;let roleSort='uses',roleDir='desc';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>v==null?'—':Number(v).toLocaleString('zh-CN');const pct=v=>v==null?'—':(Number(v)*100).toFixed(1)+'%';
function sortRoles(){const rows=Array.isArray(D?.roleStats)?[...D.roleStats]:[];rows.sort((a,b)=>{const av=Number(a?.[roleSort]||0),bv=Number(b?.[roleSort]||0);if(av!==bv)return roleDir==='desc'?bv-av:av-bv;return String(a.role||'').localeCompare(String(b.role||''),'zh-CN')});return rows}
function renderRoleSort(){document.querySelectorAll('.sortBtn').forEach(b=>{const on=b.dataset.sort===roleSort;b.classList.toggle('active',on);b.querySelector('.sortMark').textContent=on?(roleDir==='desc'?'▼':'▲'):'↕'})}
function renderRoles(){const rows=sortRoles();$('#roleCount').textContent=`${rows.length} 个身份`;$('#roleBody').innerHTML=rows.length?rows.map(r=>`<tr><td><div class="roleCell">${r.roleIcon?`<img class="roleIcon" src="${esc(r.roleIcon)}" alt="">`:''}<span>${esc(r.role||'—')}</span></div></td><td>${num(r.uses)}</td><td>${num(r.wins)}</td><td>${num(r.losses)}</td><td>${pct(r.winRate)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">暂无可汇总的身份记录。</td></tr>';renderRoleSort()}
function matchTime(m){const s=String(m?.date||'').trim();let x=Date.parse(s);if(!Number.isFinite(x)){const q=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(q)x=Date.UTC(Number(q[3]),Number(q[2])-1,Number(q[1]))}return Number.isFinite(x)?x:0}
function filteredMatches(){const all=Array.isArray(D?.matches)?[...D.matches]:[];const role=$('#roleFilter').value,res=$('#resultFilter').value,mode=$('#modeFilter').value,players=$('#playerFilter').value,rounds=$('#roundFilter').value;return all.filter(m=>{if(role&&String(m.roleName)!==role)return false;if(mode&&String(m.mode)!==mode)return false;if(res==='win'&&!m.won)return false;if(res==='loss'&&m.won)return false;if(players&&String(m.playerCount)!==players)return false;if(rounds&&String(m.survivalRounds)!==rounds)return false;return true}).sort((a,b)=>{const d=matchTime(b)-matchTime(a);if(d)return d;const ai=Number(a?.sourceIndex??9999),bi=Number(b?.sourceIndex??9999);if(ai!==bi)return ai-bi;return String(b?.id||'').localeCompare(String(a?.id||''))})}
function renderTable(t){if(!Array.isArray(t)||!t.length)return'';return `<div class="detailTable"><table><tbody>${t.map(r=>`<tr>${(Array.isArray(r)?r:[]).map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function cards(title,rows){if(!Array.isArray(rows)||!rows.length)return'';return `<div class="detailSection"><h3>${esc(title)}</h3><div class="miniCards">${rows.map(x=>{const o=typeof x==='string'?{text:x}:x||{};const img=o.image||o.imageData||'';return `<div class="miniCard">${img?`<img src="${esc(img)}" alt="${esc(o.alt||'')}" style="width:36px;height:36px;object-fit:contain;vertical-align:middle;margin-right:8px">`:''}${esc(o.text||'')}</div>`}).join('')}</div></div>`}
function apiDetails(rows){if(!Array.isArray(rows)||!rows.length)return'';return rows.map((r,i)=>{let body=String(r?.body||'').trim(),shown=body;try{shown=JSON.stringify(JSON.parse(body),null,2)}catch(_){}return `<div class="detailSection"><h3>比赛接口数据 ${i+1}</h3><div class="muted">${esc(r?.url||'')}</div><pre class="raw">${esc(shown)}</pre></div>`}).join('')}
function renderDetail(d){if(!d||!d.available)return'';const fields=Array.isArray(d.fields)?d.fields:[];const tables=Array.isArray(d.tables)?d.tables:[];const heads=Array.isArray(d.headings)?d.headings.filter(Boolean):[];const lists=Array.isArray(d.lists)?d.lists:[];let out='';if(d.title)out+=`<div class="detailSection"><h3>${esc(d.title)}</h3></div>`;if(fields.length)out+=`<div class="detailFields">${fields.map(f=>`<div class="field"><div class="k">${esc(f.label)}</div><div class="v">${esc(f.value)}</div></div>`).join('')}</div>`;out+=cards('玩家 / 参与者',d.participants);out+=cards('事件 / 回合记录',d.events);if(tables.length)out+=`<div class="detailSection"><h3>表格数据</h3>${tables.map(renderTable).join('')}</div>`;if(lists.length)out+=cards('其他明细',lists.map(text=>({text})));if(heads.length)out+=`<div class="detailSection"><h3>详情章节</h3><div class="miniCards">${heads.map(h=>`<div class="miniCard">${esc(h)}</div>`).join('')}</div></div>`;out+=apiDetails(d.apiResponses);if(d.text)out+=`<div class="detailSection"><h3>完整详情文本</h3><pre class="raw">${esc(d.text)}</pre></div>`;return out||'<div class="muted">详情页已取得，但没有可显示字段。</div>'}
function matchHtml(m){const basic=`<div class="matchHead"><div class="player">${m.roleIcon?`<img class="matchRoleIcon" src="${esc(m.roleIcon)}" alt="">`:''}<div class="playerMain"><b>${esc(m.roleName||'历史详情')}</b><span>${esc(m.modeMap||[m.mode,m.map].filter(Boolean).join(' · ')||m.source||'—')}</span></div></div><div class="result ${m.won?'win':'loss'}">${esc(m.result||'—')}</div><div class="metric"><span class="label">日期</span><strong>${esc(m.date||'—')}</strong></div><div class="metric"><span class="label">玩家人数</span><strong>${num(m.playerCount)}</strong></div><div class="metric"><span class="label">存活回合</span><strong>${num(m.survivalRounds)}</strong></div></div>`;const detail=m.detailAvailable?`<div class="detailBox"><details><summary>展开详情</summary><div class="detailInner">${renderDetail(m.detail)}</div></details></div>`:`<div class="noDetail">该局目前没有从 Gaggle 官方页面取得可展开详情。</div>`;return `<article class="match">${basic}${detail}</article>`}
function renderMatches(){const all=filteredMatches(),pages=Math.max(1,Math.ceil(all.length/PAGE));page=Math.min(page,pages);const rows=all.slice((page-1)*PAGE,page*PAGE);$('#matchCount').textContent=`${all.length} 场`;$('#matchNotice').innerHTML=D?.binding?.bound?'':`<div class="notice">尚未绑定 Gaggle 官方战绩。请运行 <b>BIND_GGD.cmd</b>。</div>`;$('#matchList').innerHTML=rows.length?rows.map(matchHtml).join(''):'<div class="empty">当前筛选下没有对局记录。</div>';$('#matchPages').innerHTML=all.length>PAGE?`<button class="pageBtn" ${page<=1?'disabled':''} id="prev">上一页</button><span>${page} / ${pages}</span><button class="pageBtn" ${page>=pages?'disabled':''} id="next">下一页</button>`:'';$('#prev')?.addEventListener('click',()=>{page--;renderMatches()});$('#next')?.addEventListener('click',()=>{page++;renderMatches()})}
function fillFilters(){const all=Array.isArray(D?.matches)?D.matches:[];const roles=[...new Set(all.map(x=>x.roleName).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));const modes=[...new Set(all.map(x=>x.mode).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));const players=[...new Set(all.map(x=>x.playerCount).filter(x=>x!=null&&x!==''))].sort((a,b)=>Number(a)-Number(b));const rounds=[...new Set(all.map(x=>x.survivalRounds).filter(x=>x!=null&&x!==''))].sort((a,b)=>Number(a)-Number(b));$('#roleFilter').innerHTML='<option value="">全部身份</option>'+roles.map(x=>`<option>${esc(x)}</option>`).join('');$('#modeFilter').innerHTML='<option value="">全部模式</option>'+modes.map(x=>`<option>${esc(x)}</option>`).join('');$('#playerFilter').innerHTML='<option value="">全部玩家人数</option>'+players.map(x=>`<option value="${esc(x)}">${esc(x)} 人</option>`).join('');$('#roundFilter').innerHTML='<option value="">全部存活回合</option>'+rounds.map(x=>`<option value="${esc(x)}">${esc(x)} 回合</option>`).join('');['#roleFilter','#resultFilter','#modeFilter','#playerFilter','#roundFilter'].forEach(id=>$(id).addEventListener('change',()=>{page=1;renderMatches()}))}
function render(){const p=D?.profile||{};if(p.avatar)$('#avatar').src=p.avatar;else $('#avatar').style.visibility='hidden';$('#profileName').textContent=p.name||'鹅鸭杀战绩';const pill=$('#bindPill');pill.textContent=D?.binding?.bound?'Gaggle 已绑定':'Gaggle 未绑定';pill.classList.toggle('ok',!!D?.binding?.bound);renderRoles();fillFilters();renderMatches()}
document.querySelectorAll('.sortBtn').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.sort;if(roleSort===k)roleDir=roleDir==='desc'?'asc':'desc';else{roleSort=k;roleDir='desc'}renderRoles()}));document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(v=>v.classList.toggle('active',v.id===b.dataset.page))}));
fetch(DATA,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(x=>{D=x;render()}).catch(e=>{$('#roles').innerHTML=`<div class="notice">鹅鸭杀数据尚未生成：${esc(e.message)}</div>`});
</script></body></html>
