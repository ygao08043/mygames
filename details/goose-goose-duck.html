.sortBtn{border:0;background:transparent;padding:0;font-weight:700;display:inline-flex;gap:5px;align-items:center}.sortBtn.active{color:var(--text)}.sortMark{color:var(--cyan);min-width:12px}.seg{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.seg button{padding:7px 12px}.filters{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;margin:10px 0 14px}.filters select{min-width:130px;color:var(--text);cursor:pointer}
.matches{display:grid;gap:10px}.match{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.matchHead{display:grid;grid-template-columns:minmax(230px,2fr) .75fr .8fr .75fr .75fr;gap:10px;align-items:center;padding:12px 14px}.player{display:flex;align-items:center;gap:12px;min-width:0}.matchRoleIcon{width:48px;height:48px;object-fit:contain;flex:0 0 48px}.playerMain{min-width:0}.playerMain b{display:block;font-size:16px}.playerMain span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result{font-weight:700}.result.win{color:var(--green)}.result.loss{color:var(--red)}.metric .label{display:block;color:var(--muted);font-size:12px}
.detailBox{border-top:1px solid var(--line)}details{background:#101720}details>summary{cursor:pointer;list-style:none;padding:11px 14px;color:var(--cyan);font-weight:700}details>summary::-webkit-details-marker{display:none}.detailInner{padding:0 14px 16px}.detailFields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:8px 0}.field{background:#151f2b;border:1px solid var(--line);border-radius:10px;padding:9px}.field .k{font-size:11px;color:var(--muted)}.field .v{margin-top:2px;font-weight:650;white-space:normal;word-break:break-word}.detailSection{margin-top:14px}.detailSection h3{font-size:14px;margin:0 0 8px}.miniCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.miniCard{background:#151f2b;border:1px solid var(--line);border-radius:10px;padding:9px;white-space:pre-wrap;word-break:break-word}.board{overflow:auto;border:1px solid var(--line);border-radius:12px}.board table{min-width:720px}.board td,.board th{text-align:center}.board td:nth-child(2),.board th:nth-child(2){text-align:left}.replayDetails{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0f1720}.replayDetails>summary{display:flex;align-items:center;justify-content:space-between;background:#151f2b}.replayDetails>summary:after{content:'展开';font-size:11px;color:var(--muted);font-weight:500}.replayDetails[open]>summary:after{content:'收起'}.replay{display:grid;gap:10px;padding:0 12px 12px}.roundBlock{background:#111a24;border:1px solid var(--line);border-radius:12px;overflow:hidden}.roundTitle{padding:9px 11px;font-weight:800;background:#182331;border-bottom:1px solid var(--line)}.eventList{display:grid;gap:7px;padding:9px}.eventRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#151f2b;border:1px solid #263747;border-radius:9px;padding:7px 9px}.eventAction{font-weight:800;color:#dfeaf4;white-space:nowrap}.eventAction.kill{color:var(--red)}.eventAction.ability{color:#f6cf72}.eventAction.infect{color:#86df92}.eventAction.swallow{color:#72d9b0}.eventAction.disconnect{color:var(--muted)}.inferTag{font-size:10px;color:#d7bc72;border:1px solid #6a5d36;border-radius:999px;padding:1px 5px}.personChip{display:inline-flex;align-items:center;gap:6px;min-width:0;background:#111b26;border:1px solid #2a3a4c;border-radius:8px;padding:4px 7px}.personChip img{width:28px;height:28px;object-fit:contain;flex:0 0 28px}.personText{display:flex;flex-direction:column;line-height:1.15;min-width:0}.personName{font-weight:750;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.personRole{font-size:10px;color:var(--muted);margin-top:2px}.meetingPanel{margin:9px;border:1px solid #33445a;border-radius:10px;overflow:hidden;background:#121a24}.meetingHead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;background:#1a2533;font-weight:800}.meetingGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:9px}.meetingPlayer{background:#151f2b;border:1px solid #2b3d50;border-radius:10px;padding:9px;min-width:0}.meetingPlayer.dead{background:#171a20;border-color:#4b3c42}.meetingPlayer.votedOut{background:#2b2026;border-color:#8e4e59}.meetingPlayer.balloon{border-color:#9c6a58}.meetingPlayer .personChip{background:transparent;border:0;padding:0}.meetingPlayerTop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.meetingStatus{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:48%}.deathTag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:800;color:#ffd8dc;background:#3b2027;border:1px solid #7f3e4a;white-space:nowrap}.deathTag.balloon{color:#ffe0cf;background:#3b2922;border-color:#875641}.deathTag.disconnect{color:#c0cad3;background:#202832;border-color:#465666}.deathSource{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px}.deathSource img{width:18px;height:18px;object-fit:contain}.voteReceived{margin-top:8px;padding-top:8px;border-top:1px solid #28394a}.voteReceivedLabel{font-size:10px;color:var(--muted);margin-bottom:5px}.voterList{display:flex;gap:5px;flex-wrap:wrap}.voterList .personChip{background:#111b26;border:1px solid #2a3a4c;padding:3px 5px}.voterList .personChip img{width:22px;height:22px;flex-basis:22px}.voterList .personName{font-size:11px;max-width:96px}.noVotes{font-size:11px;color:#64778a}.skipVote{color:var(--muted);font-weight:700;padding:5px 8px;border:1px solid #39495a;border-radius:7px}.skipBlock{margin:0 9px 9px;padding:8px 9px;border:1px dashed #3b4d60;border-radius:9px;background:#111922}.meetingResult{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 9px 9px;color:#dce7f1}.meetingEvents{border-top:1px solid var(--line);padding:8px 9px}.meetingEventsTitle{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:5px}.meetingEvents .eventList{padding:0}.endSummary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px;padding:10px;border:1px solid #355841;background:#14241d;border-radius:10px}.endSummary strong{color:var(--green);font-size:15px}.peopleLine{display:flex;gap:6px;flex-wrap:wrap}.raw{max-height:360px;overflow:auto;background:#0c1219;border:1px solid var(--line);border-radius:10px;padding:11px;white-space:pre-wrap;word-break:break-word;color:#c8d3de;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.noDetail{border-top:1px solid var(--line);padding:10px 14px;color:var(--muted);font-size:12px}.pages{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0}.pageBtn:disabled{opacity:.45;cursor:default}.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px}.count{color:var(--muted);font-size:12px;margin-left:7px}

<body><main class="wrap">
<a class="back" href="../index.html">← 返回游戏库</a>
<div class="hero"><img id="avatar" class="avatar" alt=""><div><h1>Goose Goose Duck</h1><div id="profileName" class="sub">鹅鸭杀战绩</div><div style="margin-top:8px"><span id="bindPill" class="pill">读取中</span></div></div></div>

<div class="nav">
  <button class="active" data-page="overviewPage">总览</button>
  <button data-page="roles">身份统计</button>
  <button data-page="matches">全部对局记录</button>
</div>

<section id="overviewPage" class="page active">
  <div class="section">
    <h2>总览</h2>
    <div class="overviewTop">
      <div class="metricCard"><div id="ovTime" class="value">—</div><div class="label">游戏时间</div></div>
      <div class="metricCard"><div id="ovMatches" class="value">—</div><div class="label">总场次</div></div>
      <div class="metricCard"><div id="ovWinRate" class="value">—</div><div class="label">总胜率</div></div>
      <div class="metricCard"><div id="ovAchievements" class="value">—</div><div class="label">成就完成</div></div>
    </div>
  </div>
  <div class="section">
    <h2>阵营表现</h2>
    <div id="factionOverview" class="factionGrid"></div>
  </div>
  <div class="section">
    <h2>近 50 场比赛</h2>
    <div class="muted" style="margin-bottom:8px">失败为透明；鸭胜红色、鹅胜绿色、中立胜黄色。按时间新 → 旧。</div>
    <div id="recent50" class="recentGrid"></div>
  </div>
</section>

<section id="roles" class="page">
  <div class="section">
    <h2>身份统计 <span id="roleCount" class="count"></span></h2>
    <div id="factionSeg" class="seg">
      <button class="active" data-faction="">全部</button>
      <button data-faction="鹅">鹅</button>
      <button data-faction="鸭">鸭</button>
      <button data-faction="中立">中立</button>
    </div>
    <div class="tableWrap"><table><thead><tr>
      <th>身份</th>
      <th><button class="sortBtn active" data-sort="uses">使用次数 <span class="sortMark"></span></button></th>
      <th><button class="sortBtn" data-sort="wins">胜场 <span class="sortMark"></span></button></th>
      <th><button class="sortBtn" data-sort="losses">败场 <span class="sortMark"></span></button></th>
      <th><button class="sortBtn" data-sort="winRate">胜率 <span class="sortMark"></span></button></th>
    </tr></thead><tbody id="roleBody"></tbody></table></div>
  </div>
</section>

<section id="matches" class="page">
  <div id="matchNotice"></div>
  <div class="section">
    <h2>全部对局记录 <span id="matchCount" class="count"></span></h2>
    <div class="muted" style="margin-bottom:8px">默认按时间：新 → 旧</div>
    <div class="filters">
      <select id="roleFilter"><option value="">全部身份</option></select>
      <select id="resultFilter"><option value="">全部结果</option><option value="win">胜利</option><option value="loss">失败</option></select>
      <select id="modeFilter"><option value="">全部模式</option></select>
      <select id="playerFilter"><option value="">全部玩家人数</option></select>
      <select id="roundFilter"><option value="">全部存活回合</option></select>
    </div>
    <div id="matchList" class="matches"></div>
    <div id="matchPages" class="pages"></div>
  </div>
</section>

<div class="sub" style="margin-top:22px">Build v1.19.0</div>
</main>
<script>
const DATA='../data/goose-goose-duck.json?v=1.16.20';
let D=null,page=1;const PAGE=20;let roleSort='uses',roleDir='desc',roleFaction='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v==null||v===''?'—':Number(v).toLocaleString('zh-CN');
const pct=v=>v==null||!Number.isFinite(Number(v))?'—':(Number(v)*100).toFixed(1)+'%';
const factionClass=f=>f==='鹅'?'goose':f==='鸭'?'duck':f==='中立'?'neutral':'';

function matchTime(m){
  const s=String(m?.date||'').trim();let x=Date.parse(s);
  if(!Number.isFinite(x)){const q=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(q)x=Date.UTC(Number(q[3]),Number(q[2])-1,Number(q[1]))}
  return Number.isFinite(x)?x:0;
}
function sortedAllMatches(){
  const all=Array.isArray(D?.matches)?[...D.matches]:[];
  return all.sort((a,b)=>{const d=matchTime(b)-matchTime(a);if(d)return d;const ai=Number(a?.sourceIndex??9999),bi=Number(b?.sourceIndex??9999);if(ai!==bi)return ai-bi;return String(b?.id||'').localeCompare(String(a?.id||''))});
}
function renderOverview(){
  const o=D?.overview||{};
  $('#ovTime').textContent=Number.isFinite(Number(o.gameTimeHours))?Number(o.gameTimeHours).toFixed(1)+'h':'—';
  $('#ovMatches').textContent=num(o.totalMatches);
  $('#ovWinRate').textContent=pct(o.totalWinRate);
  $('#ovAchievements').textContent=o.achievementsCompleted!=null?num(o.achievementsCompleted):(o.achievementsText||'—');

  const fs=Array.isArray(o.factions)?o.factions:[];
  $('#factionOverview').innerHTML=['鹅','鸭','中立'].map(f=>{
    const x=fs.find(v=>v?.faction===f)||{games:0,winRate:0};
    return `<div class="factionCard ${factionClass(f)}"><div><strong>${esc(f)}</strong><div class="muted">${num(x.games)} 场</div></div><div style="text-align:right"><strong>${pct(x.winRate)}</strong><div class="muted">胜率</div></div></div>`;
  }).join('');

  const rows=sortedAllMatches().filter(m=>m?.roleName).slice(0,50);
  $('#recent50').innerHTML=rows.length?rows.map((m,i)=>{
    const f=factionClass(m.faction),state=m.won?`win ${f}`:'loss';
    const title=`${i+1}. ${m.date||''} · ${m.roleName||''} · ${m.result||''}`;
    return `<div class="recentSquare ${state}" title="${esc(title)}">${m.roleIcon?`<img src="${esc(m.roleIcon)}" alt="${esc(m.roleName||'')}">`:`<span class="n">${i+1}</span>`}</div>`;
  }).join(''):'<div class="empty" style="grid-column:1/-1">暂无已缓存对局。</div>';
}
function sortRoles(){
  let rows=Array.isArray(D?.roleStats)?[...D.roleStats]:[];
  if(roleFaction)rows=rows.filter(r=>r?.faction===roleFaction);
  rows.sort((a,b)=>{const av=Number(a?.[roleSort]||0),bv=Number(b?.[roleSort]||0);if(av!==bv)return roleDir==='desc'?bv-av:av-bv;return String(a.role||'').localeCompare(String(b.role||''),'zh-CN')});
  return rows;
}
function renderRoleSort(){
  document.querySelectorAll('.sortBtn').forEach(b=>{const on=b.dataset.sort===roleSort;b.classList.toggle('active',on);b.querySelector('.sortMark').textContent=on?(roleDir==='desc'?'▼':'▲'):'↕'});
}
function renderRoles(){
  const rows=sortRoles();$('#roleCount').textContent=`${rows.length} 个身份`;
  $('#roleBody').innerHTML=rows.length?rows.map(r=>`<tr><td><div class="roleCell">${r.roleIcon?`<img class="roleIcon" src="${esc(r.roleIcon)}" alt="">`:''}<span>${esc(r.role||'—')}</span><span class="factionTag ${factionClass(r.faction)}">${esc(r.faction||'未知')}</span></div></td><td>${num(r.uses)}</td><td>${num(r.wins)}</td><td>${num(r.losses)}</td><td>${pct(r.winRate)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">当前阵营筛选下暂无身份记录。</td></tr>';
  renderRoleSort();
}
function filteredMatches(){
  const all=sortedAllMatches(),role=$('#roleFilter').value,res=$('#resultFilter').value,mode=$('#modeFilter').value,players=$('#playerFilter').value,rounds=$('#roundFilter').value;
  return all.filter(m=>{if(role&&String(m.roleName)!==role)return false;if(mode&&String(m.mode)!==mode)return false;if(res==='win'&&!m.won)return false;if(res==='loss'&&m.won)return false;if(players&&String(m.playerCount)!==players)return false;if(rounds&&String(m.survivalRounds)!==rounds)return false;return true});
}

}
function renderEventRow(official,e){

  if(e?.inferredType==='disconnect')return `<div class="eventRow">${personChip(official,target)}<span class="eventAction disconnect">断线</span></div>`;

function meetingDeathCause(e){
  if(e?.inferredType==='disconnect')return'断线';
  const c=numericEventCode(e);
  if(c===3)return'被票出';
  if(c===2)return'普通击杀';
  if(c===1011)return'刺客狙击';
  if(c===1015)return'炸弹爆炸';
  if(c===1019)return'隐形击杀';
  if(c===1021)return'超能力杀';
  if(c===1027)return'鸽子感染';

function meetingDeathMap(official,model){
  const mi=model?.round?.meetingInfo,map=new Map();if(!mi)return map;
  const put=(raw,cause,e=null,priority=50)=>{
    const uid=canonicalPlayerUid(official,raw);if(!uid)return;
    const old=map.get(uid);if(old&&old.priority>priority)return;
    const actor=e?resolvedEventActor(official,e):null;
    map.set(uid,{cause,actor,actorRole:e?eventActorRoleHint(numericEventCode(e),e):null,inferred:!!e?.inferred,priority});
  };
  if(mi.result&&mi.result!=='skip'&&mi.result!=='tie')put(mi.result,'被票出',null,100);
  for(const e of model.meetingEvents||[]){
    const victim=deathVictimId(e);if(victim)put(victim,meetingDeathCause(e),e,e?.inferred?80:90);
  }
  const start=cmpTime(mi?.startTime??mi?.startAt),end=cmpTime(mi?.endTime??mi?.endAt??model?.round?.endAt);
  if(Number.isFinite(end))for(const [uid,p] of Object.entries(official?.playerData||{})){
    if(Number(p?.role)===47||map.has(uid))continue;
    const dead=cmpTime(p?.deadAt);if(!Number.isFinite(dead)||dead===0||dead>end)continue;

}
function isSkipVoteTarget(v){const s=String(v??'').toLowerCase();return v==null||s===''||['skip','abstain','abstained','none','null','-1'].includes(s)}
function renderMeeting(official,model){
  const mi=model?.round?.meetingInfo;if(!mi)return'';
  const entries=mi.votes&&typeof mi.votes==='object'?Object.entries(mi.votes):[];
  const grouped=new Map(),skips=[];

    if(voter)grouped.get(target).push(voter);

  const deaths=meetingDeathMap(official,model),players=officialPlayers(official);

    const cls=['meetingPlayer'];if(dead)cls.push('dead');if(dead?.cause==='被票出')cls.push('votedOut');if(dead?.cause==='气球爆炸')cls.push('balloon');
    let status='';

    }
    const voteLine=voters.length?`<div class="voterList">${voters.map(v=>personChip(official,v,true)).join('')}</div>`:'<div class="noVotes">无人投票</div>';
    return `<div class="${cls.join(' ')}"><div class="meetingPlayerTop">${personChip(official,p.uid,false)}${status}</div><div class="voteReceived"><div class="voteReceivedLabel">投给此人的玩家 · ${voters.length} 票</div>${voteLine}</div></div>`;
  }).join('');
  const voteHtml=cards?`<div class="meetingGrid">${cards}</div>`:'<div class="muted" style="padding:9px">本次会议没有可用玩家信息。</div>';
  const skipHtml=skips.length?`<div class="skipBlock"><div class="voteReceivedLabel">弃票 · ${skips.length} 人</div><div class="voterList">${skips.map(v=>personChip(official,v,true)).join('')}</div></div>`:'';
  let result='';
  if(mi.result==='skip')result='<span class="skipVote">结果：无人被票出</span>';else if(mi.result==='tie')result='<span class="skipVote">结果：平票，无人被票出</span>';else if(mi.result)result=`<span>结果：被票出</span>${personChip(official,mi.result,true)}`;
  const special=(model.meetingEvents||[]).filter(e=>!deathVictimId(e));
  const meetingEvents=special.length?`<div class="meetingEvents"><div class="meetingEventsTitle">会议中其他事件</div><div class="eventList">${special.map(e=>renderEventRow(official,e)).join('')}</div></div>`:'';
  return `<div class="meetingPanel"><div class="meetingHead"><span>第 ${model.index} 次讨论</span>${mi.starter?`<span class="muted">发起：${esc(getPlayerName(official,mi.starter))}</span>`:''}</div>${voteHtml}${skipHtml}${result?`<div class="meetingResult">${result}</div>`:''}${meetingEvents}</div>`;

function winningSummary(official){

  const wf=Number(official.winningFaction),label=wf===1?'鹅':wf===2?'鸭':wf===3?'中立':roleLabel(wf);
  return `<div class="endSummary"><strong>${esc(label)}胜利：</strong><div class="peopleLine">${winners.map(uid=>personChip(official,uid,true)).join('')}</div></div>`;

function renderReplay(official,fallback=[]){

function rawApiDetails(rows){

  return `<details style="margin-top:14px"><summary>查看原始比赛接口数据</summary><div class="detailInner">${rows.map((r,i)=>{let body=String(r?.body||'').trim(),shown=body;try{shown=JSON.stringify(JSON.parse(body),null,2)}catch(_){}return `<div class="detailSection"><h3>接口 ${i+1}</h3><div class="muted">${esc(r?.url||'')}</div><pre class="raw">${esc(shown)}</pre></div>`}).join('')}</div></details>`;

function renderDetail(d){
  if(!d||!d.available)return'';

function adjustedMatchKills(m){

function matchHtml(m){

function renderMatches(){
