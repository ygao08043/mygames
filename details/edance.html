.wrap{max-width:1500px;margin:0 auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.back{color:#b6ccdf;text-decoration:none}.build{font-size:12px;color:var(--muted)}

<style id="ymkf-device-page-patch-v1">
.ymkf-device-hidden-preview{display:none !important}
.ymkf-omen9-details{margin-top:10px}

<script id="ymkf-device-page-patch-v1-js">
(function(){
  function n(s){return String(s||'').replace(/\s+/g,' ').trim();}
  function containsAny(el, arr){
    const t=n(el.textContent).toLowerCase();
    return arr.some(x=>t.includes(String(x).toLowerCase()));
  }
  function unique(arr){return Array.from(new Set(arr));}
  function isLikelyCard(el){
    if(!el || !el.textContent) return false;
    const t=n(el.textContent);
    if(t.length<2 || t.length>1200) return false;
    if(el.querySelector('img,svg,canvas,video,picture')) return true;
    const cls=(el.className&&typeof el.className==='string')?el.className.toLowerCase():'';
    return /(card|item|device|equip|hardware|panel|box)/.test(cls);
  }
  function nearestCard(node){
    let cur=node;
    while(cur && cur!==document.body){
      if(isLikelyCard(cur)) return cur;
      cur=cur.parentElement;
    }
    return null;
  }
  function textNodeReplaceWithin(root, regex, replacement){
    const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const hits=[];
    while(walker.nextNode()){
      const node=walker.currentNode;
      if(regex.test(node.nodeValue||'')) hits.push(node);
    }
    hits.forEach(node=>{ node.nodeValue=(node.nodeValue||'').replace(regex,replacement); });
    return hits.length;
  }
  function firstTitleEl(card){
    return card.querySelector('h1,h2,h3,h4,h5,h6,.title,.name,.device-name,strong,b,.card-title') || null;
  }
  function normalizeDeviceSections(){
    const candidates = Array.from(document.querySelectorAll('section,div,main,article'));
    const roots = [];
    candidates.forEach(el=>{
      const t=n(el.textContent);
      if(!t) return;
      if((/设备|device|hardware/i.test(t) && t.length<4000) || /OMEN9/i.test(t) || /iPad/i.test(t)){
        roots.push(el);
      }
    });
    return unique(roots);
  }

  function findCardsByKeyword(root, keywordRe){
    const hits=[];
    Array.from(root.querySelectorAll('*')).forEach(el=>{
      if(!el || !el.textContent) return;
      if(keywordRe.test(n(el.textContent))){
        const card=nearestCard(el);
        if(card && !hits.includes(card)) hits.push(card);
      }
    });
    return hits;
  }

  function buildMouseCardLike(sampleCard){
    const card = sampleCard.cloneNode(true);
    card.setAttribute('data-ymkf-g102','1');

    // remove old dynamic detail injections
    card.querySelectorAll('.ymkf-omen9-details').forEach(x=>x.remove());
    card.querySelectorAll('.ymkf-device-hidden-preview').forEach(x=>x.classList.remove('ymkf-device-hidden-preview'));

    const title = firstTitleEl(card);
    if(title) title.textContent = '罗技 G102';

    // replace descriptive lines
    let descNodes = Array.from(card.querySelectorAll('p,li,.meta,.subtitle,.desc,.detail,.sub,.label,.value,small,span'))
      .filter(el => !el.closest('.ymkf-omen9-details') && n(el.textContent));
    descNodes.forEach((el, idx)=>{
      if(idx===0) el.textContent='鼠标';
      else if(idx===1) el.textContent='当前使用：罗技 G102';
      else if(idx===2) el.textContent='外设';
      else el.classList.add('ymkf-device-hidden-preview');
    });

    if(descNodes.length===0){
      const p=document.createElement('p');
      p.textContent='当前使用：罗技 G102';
      card.appendChild(p);
    }

    const imgs = card.querySelectorAll('img');
    if(imgs.length){
      imgs.forEach(img=>{
        if(!img.getAttribute('alt') || /omen|ipad|电脑|设备|mouse/i.test(img.getAttribute('alt'))){
          img.setAttribute('alt','Logitech G102');
        }
      });
    }
    return card;
  }

  function normalizeOmenCard(card){
    if(card.getAttribute('data-ymkf-omen9')==='1') return;

    card.setAttribute('data-ymkf-omen9','1');
    const title = firstTitleEl(card);
    if(title) title.textContent = 'OMEN9';

    // Collect likely preview detail nodes.
    let detailNodes = Array.from(card.querySelectorAll('p,li,.meta,.subtitle,.desc,.detail,.sub,.label,.value,small,span'))
      .filter(el => !el.closest('.ymkf-omen9-details') && n(el.textContent) && (!title || el!==title) && !el.closest('summary'));

    // Hide detail nodes in preview.
    detailNodes.forEach(el => el.classList.add('ymkf-device-hidden-preview'));

    // Extract text lines, removing redundant title/spec headers.
    let lines = detailNodes.map(el => n(el.textContent))
      .filter(t => t && !/^OMEN9$/i.test(t) && !/^设备$/i.test(t) && !/^details?$/i.test(t));

    // Remove old storage/RAM lines if present; we will normalize them.
    lines = lines.filter(t => !/(存储|储存|SSD|硬盘|RAM|内存)/i.test(t));

    const details = document.createElement('details');
    details.className='ymkf-omen9-details';
    const summary = document.createElement('summary');
    summary.innerHTML='<span class="ymkf-omen9-summary-chip">点击查看配置 <span aria-hidden="true">▾</span></span>';
    details.appendChild(summary);

    const wrap = document.createElement('div');
    wrap.className='ymkf-omen9-specs';

    // Always normalize these two user-confirmed specs.
    const normalized = [
      '存储空间：1T',
      '运行内存：32G'
    ];

    if(lines.length===0){
      lines = ['笔记本电脑','点击展开查看设备配置'];
    }

    // Try to keep other existing lines, but make the confirmed specs explicit.
    lines.forEach(t=>{
      const div=document.createElement('div');
      div.className='line';
      div.textContent=t;
      wrap.appendChild(div);
    });

    normalized.forEach(t=>{
      const div=document.createElement('div');
      div.className='line';
      div.textContent=t;
      wrap.appendChild(div);
    });

    const note=document.createElement('div');
    note.className='ymkf-device-added-note';
    note.textContent='预览卡片仅显示 OMEN9，详细配置点开查看。';
    wrap.appendChild(note);

    details.appendChild(wrap);
    card.appendChild(details);
  }

  function renameIpad(root){
    let changed = 0;
    changed += textNodeReplaceWithin(root, /\biPad\s*Pro\s*(?:11|12\.9|13)?(?:-?inch)?\s*M4\b/gi, 'iPad Pro 13-inch M4');
    changed += textNodeReplaceWithin(root, /\biPad\s*(?:Pro|Air)?\b/gi, 'iPad Pro 13-inch M4');
    return changed;
  }

  function addMouse(root){
    if(/G102|Logitech\s*G102|罗技\s*G102/i.test(n(root.textContent))) return false;

    const omenCard = findCardsByKeyword(root, /OMEN9/i)[0];
    const ipadCard = findCardsByKeyword(root, /iPad/i)[0];
    const sample = omenCard || ipadCard || Array.from(root.querySelectorAll('article,section,li,div')).find(isLikelyCard);
    if(!sample) return false;

    const grid = sample.parentElement;
    if(!grid) return false;

    const newCard = buildMouseCardLike(sample);
    grid.appendChild(newCard);
    return true;
  }

  function run(){
    const roots = normalizeDeviceSections();
    let touched = false;

    roots.forEach(root=>{
      if(/iPad/i.test(n(root.textContent)) || /OMEN9/i.test(n(root.textContent)) || /设备|device/i.test(n(root.textContent))){
        renameIpad(root);
        findCardsByKeyword(root, /OMEN9/i).forEach(card=>{ normalizeOmenCard(card); touched = true; });
        if(addMouse(root)) touched = true;
      }
    });

    // fallback: direct global iPad rename if no structured root worked
    if(!touched){
      renameIpad(document.body);
      findCardsByKeyword(document.body, /OMEN9/i).forEach(card=>{ normalizeOmenCard(card); touched = true; });
      addMouse(document.body);
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', run);
  }else{
    run();
  }
})();
</script>

<body>
<div class="wrap">
  <div class="top"><a class="back" href="../index.html">← 返回游戏库</a><div class="build">Build v1.19.37</div></div>
  <section class="hero">
    <h1>e舞成名 · 升级版战绩</h1>
    <p>YMKF · 来自 11 张成绩详情截图。所有截图中明确显示的数值均按原值录入；截图未显示的字段保留为空。</p>
    <div class="cards" id="summary"></div>
  </section>
  <section class="section">
    <div class="section-h">GameActivity 时间段</div>
    <div class="sessions" id="sessions"></div>
    <div class="note">时间规则：相邻两首间隔 ≤ 20 分钟视为同一次游玩；每次游玩的最后一首向后延续 4 分钟。当前 11 首重建为 2 段，并按这两段计入 GameActivity 与总时长。</div>
  </section>
  <section class="section">
    <div class="section-h">全部成绩</div>
    <div class="toolbar">
      <label>模式 <select id="modeFilter"><option value="all">全部</option><option value="lover">lover</option><option value="疯狂">疯狂</option><option value="missing">未记录</option></select></label>
      <button id="resetBtn" type="button">恢复默认排序</button>
      <span style="color:var(--muted);font-size:12px">点击任意带 ↕ 的数值表头可升序 / 降序</span>
    </div>
    <div class="table-wrap"><table class="table">
      <thead><tr>
        <th>歌曲</th><th>模式</th><th class="sort" data-key="playedAtLocal">时间 ↕</th>
        <th class="sort" data-key="gradeRank">评级 ↕</th>
        <th class="sort" data-key="dancePowerGain">舞力+ ↕</th>
        <th class="sort" data-key="score">分数 ↕</th>
        <th class="sort" data-key="stars">星级 ↕</th>
        <th class="sort" data-key="bpm">BPM ↕</th>
        <th class="sort" data-key="combo">Combo ↕</th>
        <th class="sort" data-key="perfect">Perfect ↕</th>
        <th class="sort" data-key="cool">Cool ↕</th>
        <th class="sort" data-key="good">Good ↕</th>
        <th class="sort" data-key="miss">Miss ↕</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</div>
<script>
const DATA_URL='../data/rhythm/edance.json';
const gradeOrder={F:0,C:1,B:2,A:3,AA:4,S:5,SS:6,SSS:7};
let data=null, sortKey='playedAtLocal', sortDir='desc';
const fmt=n=>Number(n||0).toLocaleString('zh-CN');
const dur=s=>{s=Number(s||0);const m=Math.floor(s/60),ss=s%60;return `${m}分${String(ss).padStart(2,'0')}秒`};
function val(v){return v===null||v===undefined||v===''?null:v}
function summary(){
 const s=data.summary||{};
 document.querySelector('#summary').innerHTML=[
 ['记录',`${s.recordCount||0} 首`],['游玩段',`${s.sessionCount||0} 次`],['总时长',dur(s.totalPlaytimeSeconds)],
 ['累计舞力',`+${s.totalDancePowerGain||0}`],['最高分',fmt(s.maxScore)],['最高 Combo',fmt(s.maxCombo)]
 ].map(([k,v])=>`<div class="card"><b>${v}</b><span>${k}</span></div>`).join('');
}
function sessions(){
 document.querySelector('#sessions').innerHTML=(data.sessions||[]).map((s,i)=>`<div class="session"><strong>第 ${i+1} 次 · ${s.tracks} 首 · ${dur(s.seconds)}</strong><div class="muted">${s.startLocal} → ${s.endLocal}</div></div>`).join('');
}
function cmp(a,b,key){
 let av,bv;
 if(key==='gradeRank'){av=gradeOrder[a.grade]??-1;bv=gradeOrder[b.grade]??-1}
 else if(key==='playedAtLocal'){av=Date.parse(String(a.playedAtLocal).replace(' ','T'));bv=Date.parse(String(b.playedAtLocal).replace(' ','T'))}
 else {av=val(a[key]);bv=val(b[key]); if(av===null&&bv===null)return 0;if(av===null)return 1;if(bv===null)return -1;av=Number(av);bv=Number(bv)}
 return av===bv?0:(av>bv?1:-1)
}
function cell(v,cls=''){return val(v)===null?`<span class="missing">—</span>`:`<span class="${cls}">${v}</span>`}
function render(){
 const mode=document.querySelector('#modeFilter').value;
 let list=[...(data.records||[])];
 if(mode!=='all')list=list.filter(r=>mode==='missing'?!r.mode:r.mode===mode);
 list.sort((a,b)=>cmp(a,b,sortKey)*(sortDir==='asc'?1:-1));
 document.querySelectorAll('th.sort').forEach(th=>{const old=th.querySelector('.sortmark');if(old)old.remove();if(th.dataset.key===sortKey){const sp=document.createElement('span');sp.className='sortmark';sp.textContent=sortDir==='asc'?'▲':'▼';th.appendChild(sp)}})
 document.querySelector('#rows').innerHTML=list.map(r=>`<tr>
   <td class="song" title="${r.title||'截图未显示曲名'}">${r.title||'<span class="missing">截图未显示曲名</span>'}${r.sourceNote?`<div class="source-note">${r.sourceNote}</div>`:''}</td>
   <td>${cell(r.mode,'mode')}</td><td>${r.playedAtLocal}</td><td><span class="grade">${r.grade}</span></td>
   <td>${cell('+'+r.dancePowerGain,'dp')}</td><td>${fmt(r.score)}</td>
   <td>${r.stars==null?'<span class="missing">—</span>':`<span class="stars">${'★'.repeat(r.stars)}</span> ${r.stars}`}</td>
   <td>${cell(r.bpm)}</td><td>${fmt(r.combo)}</td><td>${fmt(r.perfect)}</td><td>${fmt(r.cool)}</td><td>${fmt(r.good)}</td><td>${fmt(r.miss)}</td>
 </tr>`).join('');
}
document.querySelectorAll('th.sort').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.key;if(sortKey===k)sortDir=sortDir==='asc'?'desc':'asc';else{sortKey=k;sortDir='desc'}render()}));
document.querySelector('#modeFilter').addEventListener('change',render);
document.querySelector('#resetBtn').addEventListener('click',()=>{sortKey='playedAtLocal';sortDir='desc';document.querySelector('#modeFilter').value='all';render()});
fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(j=>{data=j;summary();sessions();render()}).catch(e=>{document.querySelector('#rows').innerHTML=`<tr><td colspan="13" style="text-align:left;color:#ff9d9d">数据加载失败：${e.message}</td></tr>`});
</script>
