<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA=null, dailyRange=30, weeklyRange=16, monthlyRange=18, timelinePage=0;
const h=s=>`${(Number(s||0)/3600).toFixed(Number(s||0)>=36000?0:1)} h`;
const pct=(a,b)=>b>0?`${(a/b*100).toFixed(1)}%`:'0%';
const shortDate=s=>{const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`};
const colorFor=(key,i=0)=>{let x=0;for(const c of String(key||i))x=(x*31+c.charCodeAt(0))>>>0;return `hsl(${x%360} 68% 62%)`};
function setupCanvas(canvas){const r=canvas.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);canvas.width=Math.max(300,Math.floor(r.width*dpr));canvas.height=Math.max(150,Math.floor(r.height*dpr));const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);return {c,w:r.width,h:r.height}}
function niceMax(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v)),n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function exactTime(s){s=Math.max(0,Math.round(Number(s||0)));const H=Math.floor(s/3600),M=Math.floor((s%3600)/60),S=s%60;const parts=[];if(H)parts.push(H+'小时');if(M)parts.push(M+'分');if(S||!parts.length)parts.push(S+'秒');return parts.join(' ')}
function tipHtml(title,seconds,extra=''){return `<b>${esc(title)}</b><br><span>${exactTime(seconds)} · ${(Number(seconds||0)/3600).toFixed(2)} h${extra?` · ${esc(extra)}`:''}</span>`}
function hideTip(){const t=$('#chartTooltip');if(t)t.classList.remove('show')}
function showTip(htmlText,e){const t=$('#chartTooltip');if(!t)return;t.innerHTML=htmlText;t.classList.add('show');const pad=12;let x=e.clientX+14,y=e.clientY+14;const box=t.getBoundingClientRect();if(x+box.width>innerWidth-pad)x=e.clientX-box.width-14;if(y+box.height>innerHeight-pad)y=e.clientY-box.height-14;t.style.left=Math.max(pad,x)+'px';t.style.top=Math.max(pad,y)+'px'}
function setChartHits(canvas,hitTest){canvas.__ymkfHitTest=hitTest;if(canvas.__ymkfBound)return;canvas.__ymkfBound=true;const handle=e=>{const r=canvas.getBoundingClientRect(),hit=canvas.__ymkfHitTest?.(e.clientX-r.left,e.clientY-r.top);if(hit)showTip(hit,e);else hideTip()};canvas.addEventListener('pointermove',handle);canvas.addEventListener('pointerdown',handle);canvas.addEventListener('pointerleave',hideTip)}
function drawBars(canvas,rows,labelFn,valueFn,opt={}){const {c,w,h:hh}=setupCanvas(canvas),pad={l:44,r:10,t:12,b:30};c.clearRect(0,0,w,hh);const vals=rows.map(valueFn),max=niceMax(Math.max(1,...vals));c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');c.font='10px system-ui';for(let i=0;i<4;i++){const y=pad.t+(hh-pad.t-pad.b)*i/3;c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();c.textAlign='right';c.fillText(h(max*(1-i/3)),pad.l-6,y+3)}const bw=(w-pad.l-pad.r)/Math.max(1,rows.length);rows.forEach((r,i)=>{const v=valueFn(r),bh=(hh-pad.t-pad.b)*(v/max),x=pad.l+i*bw+bw*.14,y=hh-pad.b-bh;c.fillStyle=opt.colorFn?opt.colorFn(r,i):colorFor(labelFn(r),i);c.fillRect(x,y,Math.max(2,bw*.72),bh);if(rows.length<=16||i%Math.ceil(rows.length/10)===0){c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');c.textAlign='center';c.fillText(labelFn(r),x+bw*.36,hh-10)}});setChartHits(canvas,(mx,my)=>{if(mx<pad.l||mx>w-pad.r||my<pad.t||my>hh-pad.b||!rows.length)return null;const i=Math.max(0,Math.min(rows.length-1,Math.floor((mx-pad.l)/bw))),r=rows[i];return tipHtml(labelFn(r),valueFn(r))})}
function drawLine(canvas,rows,labelFn=r=>shortDate(r.date),tipLabelFn=r=>r.date||labelFn(r)){const {c,w,h:hh}=setupCanvas(canvas),pad={l:48,r:12,t:16,b:30};c.clearRect(0,0,w,hh);if(!rows.length){c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');c.font='11px system-ui';c.textAlign='center';c.fillText('暂无记录',w/2,hh/2);setChartHits(canvas,()=>null);return}const vals=rows.map(x=>Number(x.seconds||0)),max=niceMax(Math.max(1,...vals));c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');c.font='10px system-ui';for(let i=0;i<4;i++){const yy=pad.t+(hh-pad.t-pad.b)*i/3;c.beginPath();c.moveTo(pad.l,yy);c.lineTo(w-pad.r,yy);c.stroke();c.textAlign='right';c.fillText(h(max*(1-i/3)),pad.l-7,yy+3)}const x=i=>pad.l+(rows.length<=1?.5:i/(rows.length-1))*(w-pad.l-pad.r),y=v=>hh-pad.b-(Number(v)/max)*(hh-pad.t-pad.b);c.strokeStyle='#9b8cff';c.lineWidth=2.4;c.beginPath();rows.forEach((r,i)=>i?c.lineTo(x(i),y(r.seconds)):c.moveTo(x(i),y(r.seconds)));c.stroke();rows.forEach((r,i)=>{if(Number(r.seconds||0)<=0)return;c.fillStyle='#d7d0ff';c.beginPath();c.arc(x(i),y(r.seconds),2.7,0,Math.PI*2);c.fill()});const maxTicks=Math.max(3,Math.floor((w-pad.l-pad.r)/82)),step=Math.max(1,Math.ceil(rows.length/maxTicks)),ticks=[];for(let i=0;i<rows.length;i+=step)ticks.push(i);if(ticks[ticks.length-1]!==rows.length-1)ticks.push(rows.length-1);c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');c.textAlign='center';ticks.forEach(i=>c.fillText(labelFn(rows[i]),x(i),hh-10));setChartHits(canvas,(mx,my)=>{if(mx<pad.l||mx>w-pad.r||my<pad.t||my>hh-pad.b)return null;let i=rows.length<=1?0:Math.round((mx-pad.l)/(w-pad.l-pad.r)*(rows.length-1));i=Math.max(0,Math.min(rows.length-1,i));const r=rows[i];return tipHtml(tipLabelFn(r),r.seconds)})}
function drawDonut(canvas,rows){const {c,w,h:hh}=setupCanvas(canvas),cx=w/2,cy=hh/2,R=Math.min(w,hh)*.40,r=R*.58,total=rows.reduce((s,x)=>s+Number(x.seconds||0),0);c.clearRect(0,0,w,hh);if(!total){c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');c.textAlign='center';c.font='12px system-ui';c.fillText('暂无数据',cx,cy);setChartHits(canvas,()=>null);return}let a=-Math.PI/2;const arcs=[];rows.forEach((row,i)=>{const da=Number(row.seconds||0)/total*Math.PI*2;c.beginPath();c.arc(cx,cy,R,a,a+da);c.arc(cx,cy,r,a+da,a,true);c.closePath();c.fillStyle=colorFor(row.id||row.name,i);c.fill();arcs.push({a0:a,a1:a+da,row});a+=da});c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text');c.textAlign='center';c.font='700 18px system-ui';c.fillText(h(total),cx,cy+2);c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');c.font='10px system-ui';c.fillText('总计',cx,cy+19);setChartHits(canvas,(mx,my)=>{const dx=mx-cx,dy=my-cy,rr=Math.hypot(dx,dy);if(rr<r||rr>R)return null;let ang=Math.atan2(dy,dx);if(ang<-.5*Math.PI)ang+=Math.PI*2;const hit=arcs.find(x=>ang>=x.a0&&ang<x.a1);if(!hit)return null;return tipHtml(hit.row.name||'游戏',hit.row.seconds,pct(hit.row.seconds,total))})}
function drawHourlyRadial(canvas,rows){const {c,w,h:hh}=setupCanvas(canvas);c.clearRect(0,0,w,hh);const size=Math.min(w,hh),cx=w/2,cy=hh/2+2,outer=size*.405,labelR=outer+26;const vals=Array.from({length:24},(_,i)=>Number((rows.find(r=>Number(r.hour)===i)||{}).seconds||0));const max=Math.max(1,...vals),css=getComputedStyle(document.documentElement),text=css.getPropertyValue('--text').trim(),muted=css.getPropertyValue('--muted').trim();const light=css.colorScheme==='light';c.strokeStyle=light?'rgba(20,24,32,.34)':'rgba(255,255,255,.45)';c.lineWidth=1.8;c.beginPath();c.arc(cx,cy,outer,0,Math.PI*2);c.stroke();for(let hour=0;hour<24;hour++){const v=vals[hour],frac=v/max;if(frac<=0)continue;const a0=-Math.PI/2+hour*Math.PI*2/24,a1=a0+Math.PI*2/24,r=Math.max(2,outer*frac),hue=210+(hour/23)*110;c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,r,a0,a1);c.closePath();c.fillStyle=`hsla(${hue} 68% 62% / .92)`;c.fill();c.strokeStyle=light?'rgba(255,255,255,.18)':'rgba(255,255,255,.09)';c.lineWidth=.6;c.stroke()}c.fillStyle=text;c.font='700 11px system-ui';c.textAlign='center';c.textBaseline='middle';for(let hour=0;hour<24;hour++){const a=-Math.PI/2+hour*Math.PI*2/24;c.fillText(`${hour}:00`,cx+Math.cos(a)*labelR,cy+Math.sin(a)*labelR)}let peak=0;for(let i=1;i<24;i++)if(vals[i]>vals[peak])peak=i;const total=vals.reduce((a,b)=>a+b,0);c.fillStyle=muted;c.font='10px system-ui';c.textAlign='left';c.fillText('峰值时段',12,18);c.fillStyle=text;c.font='700 12px system-ui';c.fillText(`${peak}:00 · ${h(vals[peak])}`,12,34);c.fillStyle=muted;c.font='10px system-ui';c.textAlign='right';c.fillText(`总计 ${h(total)}`,w-12,18);setChartHits(canvas,(mx,my)=>{const dx=mx-cx,dy=my-cy;if(Math.hypot(dx,dy)>outer)return null;let ang=Math.atan2(dy,dx)+Math.PI/2;if(ang<0)ang+=Math.PI*2;const hour=Math.max(0,Math.min(23,Math.floor(ang/(Math.PI*2/24))));return tipHtml(`${hour}:00–${hour}:59`,vals[hour],pct(vals[hour],total))})}
function legendHtml(rows,total){return rows.slice(0,8).map((r,i)=>`<div class="legend-row"><i class="dot" style="background:${colorFor(r.id||r.name,i)}"></i><span class="legend-name">${esc(r.name)}</span><span class="legend-value">${h(r.seconds)} · ${pct(r.seconds,total)}</span></div>`).join('')||'<div class="legend-value">暂无记录</div>'}
function championHistory(rows){return (rows||[]).map(r=>`<div class="record-row"><div class="record-period">${esc(r.label||r.period)}</div><div class="record-game" title="${esc(r.name)}">${esc(r.name||'暂无记录')}</div><div class="record-stat"><div class="record-hours">${h(r.seconds)}</div><div class="record-share">${pct(r.seconds,r.totalSeconds)} · 周期占比</div></div></div>`).join('')||'<div class="legend-value">暂无记录</div>'}

function distOptions(){return `<option value="all">总体</option>${(DATA.distributionMonths||[]).map(x=>`<option value="${esc(x.month)}">${esc(x.label||x.month)}</option>`).join('')}`}
function distRows(kind,month){if(month==='all')return DATA[kind]||[];const row=(DATA.distributionMonths||[]).find(x=>x.month===month);return row?(row[kind]||[]):[]}

function rangeRows(rows,range){return range==='all'?Array.from(rows||[]):Array.from(rows||[]).slice(-Number(range||0))}
function configureLineScroller(scrollId,stageId,rowCount,range,spacing){const scroll=$(scrollId),stage=$(stageId);if(!scroll||!stage)return;const viewport=Math.max(320,scroll.clientWidth||scroll.parentElement?.clientWidth||320),all=range==='all',target=all?Math.max(viewport,72+Math.max(1,rowCount-1)*spacing):viewport,mode=String(range);stage.style.width=Math.ceil(target)+'px';if(scroll.dataset.rangeMode!==mode){scroll.dataset.rangeMode=mode;requestAnimationFrame(()=>{scroll.scrollLeft=all?scroll.scrollWidth:0})}}
function setRangeButtons(group,range){document.querySelectorAll(`[data-range-group="${group}"]`).forEach(b=>b.classList.toggle('active',String(b.dataset.range)===String(range)))}
function renderTimeline(){
  const host=$('#timeline'),allDays=DATA.timelineDays||[],allSegs=DATA.timeline||[],windowDays=Number(DATA.timelineWindowDays||14);
  if(!allDays.length){host.innerHTML='<div class="timeline-empty">暂无可显示的会话日期</div>';return}
  const maxPage=Math.max(0,Math.ceil(allDays.length/windowDays)-1);timelinePage=Math.max(0,Math.min(maxPage,timelinePage));
