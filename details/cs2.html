<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counter-Strike 2 · YMKF</title>
<style>
:root{color-scheme:dark;--bg:#080a0e;--panel:#111720;--panel2:#0b1017;--line:#283243;--text:#f4f7fb;--muted:#8e9aad;--orange:#f3a33c;--green:#68dda5;--bad:#ff8b8b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 28% -10%,#263a54 0,#0b0e13 36%,#07090c 100%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1320px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.back{color:#d8e1ef;text-decoration:none}.brand{font-size:30px;font-weight:950;letter-spacing:.2px;margin-top:5px}.brand b{color:var(--orange)}.sub,.muted{color:var(--muted)}button,.linkbtn,select,input{border:1px solid #324057;background:#182130;color:#e8eef8;border-radius:10px;padding:8px 10px;text-decoration:none}.linkbtn,button{cursor:pointer;font-weight:800}.hero,.card{background:linear-gradient(180deg,rgba(21,28,39,.96),rgba(12,16,23,.96));border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.hero{padding:20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.who{display:flex;align-items:center;gap:15px}.avatar{width:72px;height:72px;border-radius:14px;background:#202938;object-fit:cover}.name{font-size:24px;font-weight:950}.steamid{font:11px ui-monospace,Consolas,monospace;color:#aab6c7}.status{padding:8px 12px;border-radius:999px;background:#352719;color:#ffd49a;font-weight:850}.status.ok{background:#153b2b;color:#86edb8}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0 22px}.nav a{padding:7px 10px;border:1px solid #2c384b;border-radius:999px;text-decoration:none;color:#cbd6e6;background:#0d131c;font-size:12px;font-weight:800}.section{scroll-margin-top:12px;margin-top:25px}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 2px 11px}.sectionHead h2{font-size:19px;margin:0}.sectionHead .count{font-size:11px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.metric{padding:14px;background:rgba(7,10,15,.48);border:1px solid #253042;border-radius:13px;min-width:0}.metric strong{display:block;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric small{color:var(--muted)}.accent{color:var(--orange)}.warn{border:1px dashed #604b2b;background:#17130d;color:#e8c88e;border-radius:13px;padding:13px;margin-bottom:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input{min-width:220px;flex:1}.toolbar select{max-width:240px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.item{background:#0b1017;border:1px solid #263246;border-radius:14px;padding:13px;min-width:0}.itemHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.itemName{font-size:17px;font-weight:900}.tag{font-size:10px;border:1px solid #3a4a61;padding:2px 7px;border-radius:999px;color:#aebbd0;white-space:nowrap}.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}.mini div{background:#080c12;border:1px solid #202a39;border-radius:9px;padding:7px;min-width:0}.mini b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis}.mini span{font-size:9px;color:var(--muted)}details{margin-top:9px}summary{cursor:pointer;color:#aebbd0;font-size:11px}.rawgrid{display:grid;grid-template-columns:1fr;gap:5px;margin-top:8px}.rawrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:6px 8px;background:#070a0e;border:1px solid #1e2734;border-radius:8px;font-size:10px}.rawrow span:first-child{color:#9dabbe;overflow:hidden;text-overflow:ellipsis}.tableWrap{overflow:auto}.matches{width:100%;border-collapse:collapse;min-width:780px}.matches th,.matches td{text-align:left;padding:9px 8px;border-bottom:1px solid #202938;white-space:nowrap}.matches th{font-size:10px;color:var(--muted)}.empty{padding:34px;text-align:center;color:var(--muted)}.footnote{margin:34px 0 8px;padding-top:14px;border-top:1px solid #202938;color:#788497;font-size:9.5px;line-height:1.45}.footnote b{color:#98a5b7;font-weight:750}.footnote .sourceLine{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0}.footnote code{font:9px ui-monospace,Consolas,monospace;color:#8795a9;word-break:break-all}.footnote summary{font-size:9.5px;color:#8795a9}.footnote pre{max-height:260px;overflow:auto;background:#07090c;border:1px solid #1c2430;border-radius:8px;padding:8px;font:9px/1.35 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}.good{color:var(--green)}.bad{color:var(--bad)}
@media(max-width:1080px){.metrics{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.wrap{padding:15px}.mini{grid-template-columns:repeat(2,1fr)}}
</style>
<!-- YMKF site icon hf26 -->
<link rel="icon" type="image/svg+xml" href="../assets/playnite/site-icon.svg">
<link rel="shortcut icon" href="../assets/playnite/site-icon.svg">
<link rel="apple-touch-icon" href="../assets/playnite/site-icon.svg">
<link rel="manifest" href="../assets/playnite/site.webmanifest">
<meta name="theme-color" content="#10131d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YMKF">
<!-- /YMKF site icon hf26 -->
</head>
<body>
<div class="wrap">
  <div class="top"><div><a class="back" href="../index.html">← 返回游戏库</a><div class="brand"><b>COUNTER-STRIKE 2</b> 战绩</div><div class="sub">Build v1.15.0-cs2-hf6</div></div><button onclick="location.reload()">刷新页面</button></div>
  <div id="app" class="empty">正在读取 CS2 数据…</div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const num=v=>v===null||v===undefined||v===''?'—':Number(v).toLocaleString('zh-CN'),ratio=v=>v===null||v===undefined?'—':Number(v).toFixed(2),pct=v=>v===null||v===undefined?'—':(Number(v)*100).toFixed(1)+'%',hours=s=>s>0?(Number(s)/3600).toFixed(1)+' h':'—';
function metric(v,l,cls=''){return `<div class="metric"><strong class="${cls}">${v}</strong><small>${l}</small></div>`}
function sourceStatus(s){const st=String(s?.status||'unbound');return st==='connected'?'已连接':st==='identity_ready'?'身份就绪':st==='bound_unverified'?'已登录·待核验':st==='auth_expired'?'登录已过期':st==='identity_mismatch'?'SteamID 不一致':st==='bound_no_api_key'?'缺 API Key':st==='identity_only'?'仅身份':'未连接'}
function sortValue(row,key){if(key==='name')return String(row.name||'').toLowerCase();let v=row[key];if(v===null||v===undefined)v=row.stats?.[key];return v===null||v===undefined?-Infinity:Number(v)}
function sortRows(rows,key,dir){return [...rows].sort((a,b)=>{const x=sortValue(a,key),y=sortValue(b,key);if(typeof x==='string')return dir==='asc'?x.localeCompare(y):y.localeCompare(x);return dir==='asc'?x-y:y-x})}
function rawRows(item){const stats=item.stats||{},labels=item.labels||{};return Object.keys(stats).map(k=>`<div class="rawrow"><span title="${esc(k)}">${esc(labels[k]||k)} <code>${esc(k)}</code></span><b>${num(stats[k])}</b></div>`).join('')}
function renderWeapons(d){const all=d.weapons||[],box=$('#weaponList'),cat=$('#weaponCat').value,q=$('#weaponSearch').value.trim().toLowerCase(),key=$('#weaponSort').value,dir=$('#weaponDir').dataset.dir||'desc';let rows=all.filter(x=>(cat==='全部'||x.category===cat)&&(!q||String(x.name+' '+x.id+' '+x.category).toLowerCase().includes(q)));rows=sortRows(rows,key,dir);$('#weaponCount').textContent=`${rows.length} / ${all.length}`;box.innerHTML=rows.length?rows.map(w=>`<article class="item"><div class="itemHead"><div><div class="itemName">${esc(w.name)}</div><div class="muted" style="font-size:10px">${esc(w.id)}</div></div><span class="tag">${esc(w.category)}</span></div><div class="mini"><div><b>${num(w.kills)}</b><span>击杀</span></div><div><b>${num(w.hits)}</b><span>命中</span></div><div><b>${num(w.shots)}</b><span>开火</span></div><div><b>${pct(w.accuracy)}</b><span>命中率</span></div></div><details><summary>全部抓取字段（${Object.keys(w.stats||{}).length}）</summary><div class="rawgrid">${rawRows(w)}</div></details></article>`).join(''):'<div class="card empty">没有符合筛选条件的武器 / 道具数据</div>'}
function renderMaps(d){const all=d.maps||[],box=$('#mapList'),cat=$('#mapCat').value,q=$('#mapSearch').value.trim().toLowerCase(),key=$('#mapSort').value,dir=$('#mapDir').dataset.dir||'desc';let rows=all.filter(x=>(cat==='全部'||x.category===cat)&&(!q||String(x.name+' '+x.id+' '+x.category).toLowerCase().includes(q)));rows=sortRows(rows,key,dir);$('#mapCount').textContent=`${rows.length} / ${all.length}`;box.innerHTML=rows.length?rows.map(m=>`<article class="item"><div class="itemHead"><div><div class="itemName">${esc(m.name)}</div><div class="muted" style="font-size:10px">${esc(m.id)}</div></div><span class="tag">${esc(m.category)}</span></div><div class="mini" style="grid-template-columns:repeat(3,1fr)"><div><b>${num(m.wins)}</b><span>胜利回合</span></div><div><b>${num(m.rounds)}</b><span>总回合</span></div><div><b>${pct(m.winRate)}</b><span>回合胜率</span></div></div><details><summary>全部抓取字段（${Object.keys(m.stats||{}).length}）</summary><div class="rawgrid">${rawRows(m)}</div></details></article>`).join(''):'<div class="card empty">没有符合筛选条件的地图数据</div>'}
function renderMatches(d){const rows=d.matches||[],box=$('#matchBox');$('#matchCount').textContent=`${rows.length} 场`;if(!rows.length){box.innerHTML=`<div class="empty"><b>当前没有可验证的逐场对局记录</b><br><br>Steam Web API 的 appid 730 接口提供累计统计，但不提供普通玩家完整逐场历史。小黑盒当前绑定链只验证账号与 SteamID64；在没有验证到真实战报接口前，这里不会伪造比赛记录。<br><span class="muted">以后只要同步器抓到逐场数据，本区会按原始字段自动完整展示。</span></div>`;return}const cols=[...new Set(rows.flatMap(x=>Object.keys(x)))];box.innerHTML=`<div class="tableWrap"><table class="matches"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
fetch('../data/cs2.json?v='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{
 const app=$('#app'),id=d.identity||{},p=d.profile||{},s=d.summary||{},o=d.official||{},h=d.heybox||{},src=d.sources||{},has=!!o.available;
 if(d.status==='unbound'||d.status==='invalid_binding'){app.innerHTML='<div class="card empty">CS2 尚未绑定 Steam。运行 <b>BIND_CS2_STEAM.cmd</b> 后再运行 <b>RUN_SYNC.cmd</b>。</div>';return}
 const missing=d.dataQuality?.missingCoreStats||[];app.className='';app.innerHTML=`
 <section class="hero"><div class="who">${p.avatar?`<img class="avatar" src="${esc(p.avatar)}" alt="">`:'<div class="avatar"></div>'}<div><div class="name">${esc(p.name||'Steam 已绑定')}</div><div class="steamid">SteamID64 · ${esc(id.steamId64||'—')}</div><div class="sub">${d.updatedAt?'更新 '+new Date(d.updatedAt).toLocaleString('zh-CN',{hour12:false}):'尚未同步'}</div></div></div><div class="status ${d.status==='ok'?'ok':''}">${d.status==='ok'?'● 数据已同步':'● Steam 已绑定'}</div></section>
 <nav class="nav"><a href="#summary">总数据</a><a href="#weapons">武器 / 道具</a><a href="#maps">地图</a><a href="#matches">全部对局</a></nav>
 <section id="summary" class="section"><div class="sectionHead"><h2>1 · 总数据</h2><span class="count">累计统计 + Playnite 总时长</span></div>${!has?'<div class="warn">Valve 累计统计当前不可用。缺失字段不会再被伪装成 0。</div>':''}${missing.length?`<div class="warn">当前 Valve 返回中缺少：<b>${missing.map(esc).join('、')}</b>。因此对应位置显示“—”。之前的 0 是旧版脚本把“字段不存在”强制转换成 0，并不代表真实战绩为 0。</div>`:''}<div class="metrics">${metric(num(s.kills),'总击杀','accent')}${metric(num(s.deaths),'总死亡')}${metric(ratio(s.kd),'K/D')}${metric(num(s.assists),'总助攻')}${metric(num(s.headshots),'爆头击杀')}${metric(pct(s.headshotRate),'爆头率')}${metric(num(s.wins),'胜利回合')}${metric(num(s.rounds),'总回合')}${metric(pct(s.winRate),'回合胜率')}${metric(num(s.mvp),'MVP')}${metric(num(s.damage),'累计伤害')}${metric(pct(s.accuracy),'命中率')}${metric(num(s.bombsPlanted),'下包')}${metric(num(s.bombsDefused),'拆包')}${metric(hours(s.playniteSeconds),'总时长（Playnite）')}</div>${s.accuracySource&&s.accuracySource!=='unavailable'?`<div class="muted" style="font-size:10px;margin:8px 2px">命中率计算来源：${esc(s.accuracySource)}</div>`:''}</section>
 <section id="weapons" class="section"><div class="sectionHead"><h2>2 · 武器 / 道具数据</h2><span id="weaponCount" class="count"></span></div><div class="card" style="padding:14px"><div class="toolbar"><input id="weaponSearch" placeholder="搜索武器 / 道具"><select id="weaponCat"></select><select id="weaponSort"><option value="kills">按击杀</option><option value="accuracy">按命中率</option><option value="hits">按命中</option><option value="shots">按开火</option><option value="name">按名称</option></select><button id="weaponDir" data-dir="desc">降序 ↓</button></div><div id="weaponList" class="cards"></div></div></section>
 <section id="maps" class="section"><div class="sectionHead"><h2>3 · 地图数据</h2><span id="mapCount" class="count"></span></div><div class="card" style="padding:14px"><div class="toolbar"><input id="mapSearch" placeholder="搜索地图"><select id="mapCat"></select><select id="mapSort"><option value="rounds">按总回合</option><option value="wins">按胜利回合</option><option value="winRate">按胜率</option><option value="name">按名称</option></select><button id="mapDir" data-dir="desc">降序 ↓</button></div><div id="mapList" class="cards"></div></div></section>
 <section id="matches" class="section"><div class="sectionHead"><h2>4 · 全部对局</h2><span id="matchCount" class="count"></span></div><div id="matchBox" class="card"></div></section>
 <footer class="footnote"><div class="sourceLine"><b>战绩来源 / 账号绑定：</b> Steam · ${sourceStatus(src.steam)} · ${esc(src.steam?.note||'Valve Steam Web API - appid 730')}；小黑盒 · ${sourceStatus(src.heybox)} · ${esc(src.heybox?.note||'')}</div>${h&&Object.keys(h).length?`<div class="sourceLine"><b>小黑盒账号：</b> ${esc(h.nickname||'—')}；Heybox ID ${esc(h.heyboxId||'—')}；等级 ${esc(h.level||'—')}；SteamID64 校验 ${h.steamVerified?'一致':'待核验'}；绑定 SteamID64 <code>${esc(h.steamId64||'—')}</code></div>`:''}<div class="sourceLine"><b>说明：</b> CS2 统一主键始终是 SteamID64。Steam 绑定使用本机 Steam Web API Key + SteamID64；小黑盒为可选数据源并继续做 SteamID64 防串号校验。总时长采用 Playnite 导出记录。非公开接口未验证前不伪造字段。</div><details><summary>Steam API 原始统计字段（${Object.keys(o.rawStats||{}).length}）</summary><pre>${esc(JSON.stringify(o.rawStats||{},null,2))}</pre></details></footer>`;
 const wCats=['全部',...new Set((d.weapons||[]).map(x=>x.category))],mCats=['全部',...new Set((d.maps||[]).map(x=>x.category))];$('#weaponCat').innerHTML=wCats.map(x=>`<option>${esc(x)}</option>`).join('');$('#mapCat').innerHTML=mCats.map(x=>`<option>${esc(x)}</option>`).join('');
 ['weaponSearch','weaponCat','weaponSort'].forEach(id=>$('#'+id).addEventListener(id==='weaponSearch'?'input':'change',()=>renderWeapons(d)));['mapSearch','mapCat','mapSort'].forEach(id=>$('#'+id).addEventListener(id==='mapSearch'?'input':'change',()=>renderMaps(d)));$('#weaponDir').onclick=e=>{const b=e.currentTarget,before=b.dataset.dir||'desc';b.dataset.dir=before==='desc'?'asc':'desc';b.textContent=b.dataset.dir==='desc'?'降序 ↓':'升序 ↑';renderWeapons(d)};$('#mapDir').onclick=e=>{const b=e.currentTarget,before=b.dataset.dir||'desc';b.dataset.dir=before==='desc'?'asc':'desc';b.textContent=b.dataset.dir==='desc'?'降序 ↓':'升序 ↑';renderMaps(d)};renderWeapons(d);renderMaps(d);renderMatches(d);
}).catch(e=>{$('#app').innerHTML=`<div class="card empty"><b>CS2 数据读取失败</b><br><br>${esc(e.message||e)}</div>`})
</script>
</body>
</html>
