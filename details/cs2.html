<head>

<title>Counter-Strike 2 · YMKF</title>
<style>
:root{color-scheme:dark;--bg:#080a0e;--panel:#111720;--panel2:#0b1017;--line:#283243;--text:#f4f7fb;--muted:#8e9aad;--orange:#f3a33c;--green:#68dda5;--bad:#ff8b8b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 28% -10%,#263a54 0,#0b0e13 36%,#07090c 100%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1320px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.back{color:#d8e1ef;text-decoration:none}.brand{font-size:30px;font-weight:950;letter-spacing:.2px;margin-top:5px}.brand b{color:var(--orange)}.sub,.muted{color:var(--muted)}button,.linkbtn,select,input{border:1px solid #324057;background:#182130;color:#e8eef8;border-radius:10px;padding:8px 10px;text-decoration:none}.linkbtn,button{cursor:pointer;font-weight:800}.hero,.card{background:linear-gradient(180deg,rgba(21,28,39,.96),rgba(12,16,23,.96));border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.hero{padding:20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.who{display:flex;align-items:center;gap:15px}.avatar{width:72px;height:72px;border-radius:14px;background:#202938;object-fit:cover}.name{font-size:24px;font-weight:950}.steamid{font:11px ui-monospace,Consolas,monospace;color:#aab6c7}.status{padding:8px 12px;border-radius:999px;background:#352719;color:#ffd49a;font-weight:850}.status.ok{background:#153b2b;color:#86edb8}.pageTabs{display:flex;gap:8px;margin:14px 0 18px;padding:6px;background:#0a0f16;border:1px solid #253044;border-radius:14px;overflow-x:auto;position:sticky;top:6px;z-index:20;backdrop-filter:blur(14px)}.tabBtn{flex:1;min-width:110px;border:1px solid transparent;background:transparent;color:#95a4ba;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:900;white-space:nowrap}.tabBtn.active{background:#1d2939;border-color:#3a4b64;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.2)}.section{margin-top:8px}.tabPanel{display:none}.tabPanel.active{display:block}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 2px 11px}.sectionHead h2{font-size:19px;margin:0}.sectionHead .count{font-size:11px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.metric{padding:14px;background:rgba(7,10,15,.48);border:1px solid #253042;border-radius:13px;min-width:0}.metric strong{display:block;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric small{color:var(--muted)}.accent{color:var(--orange)}.warn{border:1px dashed #604b2b;background:#17130d;color:#e8c88e;border-radius:13px;padding:13px;margin-bottom:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input{min-width:220px;flex:1}.toolbar select{max-width:240px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.item{background:#0b1017;border:1px solid #263246;border-radius:14px;padding:13px;min-width:0}.itemHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.itemName{font-size:17px;font-weight:900}.tag{font-size:10px;border:1px solid #3a4a61;padding:2px 7px;border-radius:999px;color:#aebbd0;white-space:nowrap}.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}.mini div{background:#080c12;border:1px solid #202a39;border-radius:9px;padding:7px;min-width:0}.mini b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis}.mini span{font-size:9px;color:var(--muted)}details{margin-top:9px}summary{cursor:pointer;color:#aebbd0;font-size:11px}.rawgrid{display:grid;grid-template-columns:1fr;gap:5px;margin-top:8px}.rawrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:6px 8px;background:#070a0e;border:1px solid #1e2734;border-radius:8px;font-size:10px}.rawrow span:first-child{color:#9dabbe;overflow:hidden;text-overflow:ellipsis}.tableWrap{overflow:auto}.matches{width:100%;border-collapse:collapse;min-width:780px}.matches th,.matches td{text-align:left;padding:9px 8px;border-bottom:1px solid #202938;white-space:nowrap}.matches th{font-size:10px;color:var(--muted)}.empty{padding:34px;text-align:center;color:var(--muted)}.footnote{margin:34px 0 8px;padding-top:14px;border-top:1px solid #202938;color:#788497;font-size:9.5px;line-height:1.45}.footnote b{color:#98a5b7;font-weight:750}.footnote .sourceLine{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0}.footnote code{font:9px ui-monospace,Consolas,monospace;color:#8795a9;word-break:break-all}.footnote summary{font-size:9.5px;color:#8795a9}.footnote pre{max-height:260px;overflow:auto;background:#07090c;border:1px solid #1c2430;border-radius:8px;padding:8px;font:9px/1.35 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}.good{color:var(--green)}.bad{color:var(--bad)}.result{font-size:10px;font-weight:900;border-radius:999px;padding:3px 8px;border:1px solid #40506a}.result.win{color:#7de9ae;border-color:#286847;background:#102d20}.result.loss{color:#ff9d9d;border-color:#744040;background:#321919}.result.draw{color:#f5d17c;border-color:#755f2c;background:#302711}.matchList{display:grid;gap:9px}.matchCard{background:#0b1017;border:1px solid #263246;border-radius:14px;padding:12px}.matchTop{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}.matchMap{font-size:16px;font-weight:950}.matchMeta{font-size:10px;color:var(--muted)}.score{font:900 20px ui-monospace,Consolas,monospace}.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}.pager .pageInfo{font-size:11px;color:var(--muted)}
@media(max-width:1080px){.metrics{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.wrap{padding:15px}.mini{grid-template-columns:repeat(2,1fr)}.pageTabs{margin-left:-3px;margin-right:-3px}.tabBtn{flex:0 0 auto;min-width:92px}}
</style>

<body>
<div class="wrap">
  <div class="top"><div><a class="back" href="../index.html">← 返回游戏库</a><div class="brand"><b>COUNTER-STRIKE 2</b> 战绩</div><div class="sub">Build v1.15.0-cs2-hf8</div></div><button onclick="location.reload()">刷新页面</button></div>
  <div id="app" class="empty">正在读取 CS2 数据…</div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const num=v=>v===null||v===undefined||v===''?'—':Number(v).toLocaleString('zh-CN'),ratio=v=>v===null||v===undefined?'—':Number(v).toFixed(2),pct=v=>v===null||v===undefined?'—':(Number(v)*100).toFixed(1)+'%',hours=s=>s>0?(Number(s)/3600).toFixed(1)+' h':'—';
function metric(v,l,cls=''){return `<div class="metric"><strong class="${cls}">${v}</strong><small>${l}</small></div>`}
function sourceStatus(s){const st=String(s?.status||'unbound');return st==='connected'?'已连接':st==='identity_ready'?'身份就绪':st==='bound_unverified'?'已登录·待核验':st==='auth_expired'?'登录已过期':st==='identity_mismatch'?'SteamID 不一致':st==='bound_no_api_key'?'缺 API Key':st==='identity_only'?'仅身份':'未连接'}
function sortValue(row,key){if(key==='name')return String(row.name||'').toLowerCase();let v=row[key];if(v===null||v===undefined)v=row.stats?.[key];return v===null||v===undefined?-Infinity:Number(v)}
function sortRows(rows,key,dir){return [...rows].sort((a,b)=>{const x=sortValue(a,key),y=sortValue(b,key);if(typeof x==='string')return dir==='asc'?x.localeCompare(y):y.localeCompare(x);return dir==='asc'?x-y:y-x})}
function rawRows(item){const stats=item.stats||{},labels=item.labels||{};return Object.keys(stats).map(k=>`<div class="rawrow"><span title="${esc(k)}">${esc(labels[k]||k)} <code>${esc(k)}</code></span><b>${num(stats[k])}</b></div>`).join('')}
function renderWeapons(d){const all=d.weapons||[],box=$('#weaponList'),cat=$('#weaponCat').value,q=$('#weaponSearch').value.trim().toLowerCase(),key=$('#weaponSort').value,dir=$('#weaponDir').dataset.dir||'desc';let rows=all.filter(x=>(cat==='全部'||x.category===cat)&&(!q||String(x.name+' '+x.id+' '+x.category).toLowerCase().includes(q)));rows=sortRows(rows,key,dir);$('#weaponCount').textContent=`${rows.length} / ${all.length}`;box.innerHTML=rows.length?rows.map(w=>`<article class="item"><div class="itemHead"><div><div class="itemName">${esc(w.name)}</div><div class="muted" style="font-size:10px">${esc(w.id)}</div></div><span class="tag">${esc(w.category)}</span></div><div class="mini"><div><b>${num(w.kills)}</b><span>击杀</span></div><div><b>${num(w.hits)}</b><span>命中</span></div><div><b>${num(w.shots)}</b><span>开火</span></div><div><b>${pct(w.accuracy)}</b><span>命中率</span></div></div><details><summary>全部抓取字段（${Object.keys(w.stats||{}).length}）</summary><div class="rawgrid">${rawRows(w)}</div></details></article>`).join(''):'<div class="card empty">没有符合筛选条件的武器 / 道具数据</div>'}
function renderMaps(d){
 const all=d.maps||[],box=$('#mapList'),cat=$('#mapCat').value,q=$('#mapSearch').value.trim().toLowerCase(),key=$('#mapSort').value,dir=$('#mapDir').dataset.dir||'desc';
 let rows=all.filter(x=>(cat==='全部'||x.category===cat)&&(!q||String(x.name+' '+x.id+' '+x.category+' '+(x.modeBreakdown||'')).toLowerCase().includes(q)));rows=sortRows(rows,key,dir);$('#mapCount').textContent=`${rows.length} / ${all.length}`;
 const history=!!d.personalHistory?.available;
 box.innerHTML=rows.length?rows.map(m=>history?`<article class="item"><div class="itemHead"><div><div class="itemName">${esc(m.name)}</div><div class="muted" style="font-size:10px">${esc(m.modeBreakdown||'Steam Personal Game Data')}</div></div><span class="tag">逐场重算</span></div><div class="mini"><div><b>${num(m.matchesPlayed)}</b><span>总场数</span></div><div><b>${num(m.matchesWon)}</b><span>胜</span></div><div><b>${num(m.matchesLost)}</b><span>负</span></div><div><b>${num(m.matchesDrawn)}</b><span>平</span></div><div><b>${pct(m.matchWinRate)}</b><span>比赛胜率</span></div><div><b>${ratio(m.kd)}</b><span>K/D</span></div><div><b>${num(m.kills)} / ${num(m.assists)} / ${num(m.deaths)}</b><span>总 K / A / D</span></div><div><b>${num(m.avgKills)} / ${num(m.avgDeaths)}</b><span>场均击杀 / 死亡</span></div><div><b>${num(m.wins)} : ${num((m.rounds??0)-(m.wins??0))}</b><span>回合胜 : 负</span></div><div><b>${pct(m.winRate)}</b><span>回合胜率</span></div></div><details><summary>统计明细</summary><div class="rawgrid">${rawRows(m)}</div></details></article>`:`<article class="item"><div class="itemHead"><div><div class="itemName">${esc(m.name)}</div><div class="muted" style="font-size:10px">${esc(m.id)}</div></div><span class="tag">Valve 旧累计字段</span></div><div class="mini"><div><b>${num(m.wins)}</b><span>胜利回合</span></div><div><b>${num(m.rounds)}</b><span>总回合</span></div><div><b>${pct(m.winRate)}</b><span>回合胜率</span></div><div><b>${num(m.matchesWon)}</b><span>胜利场次</span></div><div><b>${num(m.matchesPlayed)}</b><span>比赛场次</span></div></div><details><summary>全部抓取字段（${Object.keys(m.stats||{}).length}）</summary><div class="rawgrid">${rawRows(m)}</div></details></article>`).join(''):'<div class="card empty">没有符合筛选条件的地图数据</div>'
}
let matchPage=1;
function renderMatches(d){
 const all=d.matches||[],box=$('#matchBox'),q=($('#matchSearch')?.value||'').trim().toLowerCase(),mode=$('#matchMode')?.value||'全部',res=$('#matchResult')?.value||'全部',size=Number($('#matchSize')?.value||20);
 let rows=all.filter(x=>(mode==='全部'||x.modeName===mode)&&(res==='全部'||x.result===res)&&(!q||String((x.map||'')+' '+(x.time||'')+' '+(x.score||'')+' '+(x.modeName||'')).toLowerCase().includes(q)));
 rows=[...rows].sort((a,b)=>(Date.parse(b.time)||0)-(Date.parse(a.time)||0));
 const pages=Math.max(1,Math.ceil(rows.length/size));matchPage=Math.min(Math.max(1,matchPage),pages);const view=rows.slice((matchPage-1)*size,matchPage*size);
 $('#matchCount').textContent=`${rows.length} / ${all.length} 场`;
 if(!all.length){box.innerHTML=`<div class="empty"><b>还没有导入 Steam Personal Game Data</b><br><br>运行 <b>BIND_CS2_HISTORY.cmd</b>。它会打开真实 Edge/Chrome 的 steamcommunity.com 首页；登录后直接在同一 Steam 会话内读取 Personal Game Data，不使用 OpenID、本地回调，也不需要 Match Sharing Code。<br><br><span class="muted">如果以后登录失效，重新运行 BIND_CS2_HISTORY.cmd 即可；已缓存历史不会因为一次刷新失败而删除。</span></div>`;return}
 box.innerHTML=`<div class="matchList">${view.map(m=>{const rc=m.result==='win'?'win':m.result==='loss'?'loss':'draw',rt=m.result==='win'?'胜':m.result==='loss'?'负':m.result==='draw'?'平':'未知';return `<article class="matchCard"><div class="matchTop"><div><div class="matchMap">${esc(m.map||'Unknown')}</div><div class="matchMeta">${esc(m.modeName||m.mode||'')} · ${esc(m.time||'')}</div></div><span class="result ${rc}">${rt}</span><div class="score">${esc(m.myScore??'—')} : ${esc(m.enemyScore??'—')}</div></div><div class="mini"><div><b>${num(m.kills)} / ${num(m.assists)} / ${num(m.deaths)}</b><span>K / A / D</span></div><div><b>${ratio(m.kd)}</b><span>K/D</span></div><div><b>${pct(m.headshotRate)}</b><span>爆头率</span></div><div><b>${num(m.mvps)}</b><span>MVP</span></div><div><b>${num(m.playerScore)}</b><span>Score</span></div><div><b>${esc(m.matchDuration||'—')}</b><span>比赛时长</span></div></div><details><summary>对局详细信息</summary><div class="rawgrid"><div class="rawrow"><span>模式</span><b>${esc(m.modeName||m.mode||'—')}</b></div><div class="rawrow"><span>Steam 原始比分</span><b>${esc(m.score||'—')}</b></div><div class="rawrow"><span>等待时间</span><b>${esc(m.waitTime||'—')}</b></div><div class="rawrow"><span>比赛时间</span><b>${esc(m.time||'—')}</b></div>${m.demo?`<div class="rawrow"><span>Replay</span><b><a class="back" href="${esc(m.demo)}">打开</a></b></div>`:''}</div></details></article>`}).join('')}</div><div class="pager"><button id="matchPrev" ${matchPage<=1?'disabled':''}>← 上一页</button><span class="pageInfo">第 ${matchPage} / ${pages} 页 · 每页 ${size} 场</span><button id="matchNext" ${matchPage>=pages?'disabled':''}>下一页 →</button></div>`;
 const prev=$('#matchPrev'),next=$('#matchNext');if(prev)prev.onclick=()=>{matchPage--;renderMatches(d)};if(next)next.onclick=()=>{matchPage++;renderMatches(d)}
}
function setTab(name){const valid=['summary','weapons','maps','matches'];if(!valid.includes(name))name='summary';document.querySelectorAll('.tabPanel').forEach(x=>x.classList.toggle('active',x.id===name));document.querySelectorAll('.tabBtn').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));history.replaceState(null,'','#'+name);window.scrollTo({top:0,behavior:'auto'})}
fetch('../data/cs2.json?v='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{
 const app=$('#app'),id=d.identity||{},p=d.profile||{},s=d.summary||{},o=d.official||{},h=d.heybox||{},src=d.sources||{},has=!!o.available;
 if(d.status==='unbound'||d.status==='invalid_binding'){app.innerHTML='<div class="card empty">CS2 尚未绑定 Steam。运行 <b>BIND_CS2_STEAM.cmd</b> 后再运行 <b>RUN_SYNC.cmd</b>。</div>';return}
 const missing=d.dataQuality?.missingCoreStats||[];app.className='';app.innerHTML=`
 <section class="hero"><div class="who">${p.avatar?`<img class="avatar" src="${esc(p.avatar)}" alt="">`:'<div class="avatar"></div>'}<div><div class="name">${esc(p.name||'Steam 已绑定')}</div><div class="steamid">SteamID64 · ${esc(id.steamId64||'—')}</div><div class="sub">${d.updatedAt?'更新 '+new Date(d.updatedAt).toLocaleString('zh-CN',{hour12:false}):'尚未同步'}</div></div></div><div class="status ${d.status==='ok'?'ok':''}">${d.status==='ok'?'● 数据已同步':'● Steam 已绑定'}</div></section>
 <nav class="pageTabs" aria-label="CS2 数据分页"><button class="tabBtn" data-tab="summary">总数据</button><button class="tabBtn" data-tab="weapons">武器 / 道具</button><button class="tabBtn" data-tab="maps">地图</button><button class="tabBtn" data-tab="matches">全部对局</button></nav>
 <section id="summary" class="section tabPanel"><div class="sectionHead"><h2>1 · 总数据</h2><span class="count">Steam 累计统计 + Personal Game Data + Playnite</span></div>${!has?'<div class="warn">Valve 累计统计当前不可用。缺失字段不会再被伪装成 0。</div>':''}${missing.length?`<div class="warn">当前 Valve 返回中缺少：<b>${missing.map(esc).join('、')}</b>。对应位置显示“—”，不会把字段缺失当成 0。</div>`:''}<div class="metrics">${metric(num(s.kills),'总击杀','accent')}${metric(num(s.deaths),'总死亡')}${metric(ratio(s.kd),'累计 K/D')}${metric(num(s.assists),'总助攻')}${metric(num(s.headshots),'爆头击杀')}${metric(pct(s.headshotRate),'爆头率')}${metric(num(s.wins),'胜利回合')}${metric(num(s.rounds),'总回合')}${metric(pct(s.winRate),'回合胜率')}${metric(num(s.mvp),'MVP')}${metric(num(s.damage),'累计伤害')}${metric(pct(s.accuracy),'命中率')}${metric(num(s.bombsPlanted),'下包')}${metric(num(s.bombsDefused),'拆包')}${metric(hours(s.playniteSeconds),'总时长（Playnite）')}${d.personalHistory?.available?metric(num(s.matchTotal),'历史总场数','accent'):''}${d.personalHistory?.available?metric(num(s.matchWins),'胜场'):''}${d.personalHistory?.available?metric(num(s.matchLosses),'负场'):''}${d.personalHistory?.available?metric(num(s.matchDraws),'平局'):''}${d.personalHistory?.available?metric(pct(s.matchWinRate),'比赛胜率'):''}${d.personalHistory?.available?metric(ratio(s.matchKd),'历史对局 K/D'):''}${d.personalHistory?.available?metric(num(s.matchAvgKills),'场均击杀'):''}${d.personalHistory?.available?metric(num(s.matchAvgAssists),'场均助攻'):''}${d.personalHistory?.available?metric(num(s.matchAvgDeaths),'场均死亡'):''}</div>${s.accuracySource&&s.accuracySource!=='unavailable'?`<div class="muted" style="font-size:10px;margin:8px 2px">命中率 = 所有可识别枪械命中数之和 ÷ 所有可识别枪械开火数之和。</div>`:''}</section>
 <section id="weapons" class="section tabPanel"><div class="sectionHead"><h2>2 · 武器 / 道具数据</h2><span id="weaponCount" class="count"></span></div><div class="card" style="padding:14px"><div class="toolbar"><input id="weaponSearch" placeholder="搜索武器 / 道具"><select id="weaponCat"></select><select id="weaponSort"><option value="kills">按击杀</option><option value="accuracy">按命中率</option><option value="hits">按命中</option><option value="shots">按开火</option><option value="name">按名称</option></select><button id="weaponDir" data-dir="desc">降序 ↓</button></div><div id="weaponList" class="cards"></div></div></section>
 <section id="maps" class="section tabPanel"><div class="sectionHead"><h2>3 · 地图数据</h2><span id="mapCount" class="count"></span></div>${d.personalHistory?.available?`<div class="warn">地图统计已改为根据 ${num(d.personalHistory.count)} 场 Steam Personal Game Data 逐场重算。Mirage、Anubis、Ancient 等不再依赖 Valve 残缺的旧 <code>total_*_map_*</code> 字段。</div>`:`<div class="warn">尚未导入 Personal Game Data，所以这里仍临时显示 Valve 旧累计地图字段。运行 <b>BIND_CS2_HISTORY.cmd</b> 后会自动切换到逐场比赛重算。</div>`}<div class="card" style="padding:14px"><div class="toolbar"><input id="mapSearch" placeholder="搜索地图"><select id="mapCat"></select><select id="mapSort"><option value="matchesPlayed">按比赛场次</option><option value="matchWinRate">按比赛胜率</option><option value="kd">按 K/D</option><option value="avgKills">按场均击杀</option><option value="rounds">按总回合</option><option value="winRate">按回合胜率</option><option value="name">按名称</option></select><button id="mapDir" data-dir="desc">降序 ↓</button></div><div id="mapList" class="cards"></div></div></section>
 <section id="matches" class="section tabPanel"><div class="sectionHead"><h2>4 · 全部对局</h2><span id="matchCount" class="count"></span></div><div class="card" style="padding:14px"><div class="toolbar"><input id="matchSearch" placeholder="搜索地图 / 日期 / 比分"><select id="matchMode"></select><select id="matchResult"><option value="全部">全部结果</option><option value="win">胜</option><option value="loss">负</option><option value="draw">平</option></select><select id="matchSize"><option value="20">每页 20 场</option><option value="50">每页 50 场</option><option value="100">每页 100 场</option></select></div><div id="matchBox"></div></div></section>
 <footer class="footnote"><div class="sourceLine"><b>战绩来源 / 账号绑定：</b> Steam · ${sourceStatus(src.steam)} · ${esc(src.steam?.note||'Valve Steam Web API - appid 730')}；Personal Game Data · ${d.personalHistory?.available?'已导入 '+num(d.personalHistory.count)+' 场':'未导入'}；小黑盒 · ${sourceStatus(src.heybox)}。</div>${h&&Object.keys(h).length?`<div class="sourceLine"><b>小黑盒账号：</b> ${esc(h.nickname||'—')}；Heybox ID ${esc(h.heyboxId||'—')}；等级 ${esc(h.level||'—')}；SteamID64 校验 ${h.steamVerified?'一致':'待核验'}；绑定 SteamID64 <code>${esc(h.steamId64||'—')}</code></div>`:''}<div class="sourceLine"><b>说明：</b> CS2 主键为 SteamID64。总时长来自 Playnite；累计/武器来自 Steam Web API；命中率按全部可识别枪械命中/开火重新计算；地图与全部对局在 Personal Game Data 可用时按真实逐场记录重算。网页登录使用本机独立 Edge/Chrome 配置，不使用 OpenID localhost 回调。</div>${d.personalHistory?.updatedAt?`<div class="sourceLine"><b>比赛历史：</b> 最近导入 ${esc(new Date(d.personalHistory.updatedAt).toLocaleString('zh-CN',{hour12:false}))} · ${esc(d.personalHistory.status||'')} · ${num(d.personalHistory.count)} 场</div>`:''}<details><summary>Steam API 原始统计字段（${Object.keys(o.rawStats||{}).length}）</summary><pre>${esc(JSON.stringify(o.rawStats||{},null,2))}</pre></details></footer>`;
 const wCats=['全部',...new Set((d.weapons||[]).map(x=>x.category))],mCats=['全部',...new Set((d.maps||[]).map(x=>x.category))],matchModes=['全部',...new Set((d.matches||[]).map(x=>x.modeName).filter(Boolean))];$('#weaponCat').innerHTML=wCats.map(x=>`<option>${esc(x)}</option>`).join('');$('#mapCat').innerHTML=mCats.map(x=>`<option>${esc(x)}</option>`).join('');$('#matchMode').innerHTML=matchModes.map((x,i)=>`<option value="${esc(x)}">${i===0?'全部模式':esc(x)}</option>`).join('');
 ['weaponSearch','weaponCat','weaponSort'].forEach(id=>$('#'+id).addEventListener(id==='weaponSearch'?'input':'change',()=>renderWeapons(d)));['mapSearch','mapCat','mapSort'].forEach(id=>$('#'+id).addEventListener(id==='mapSearch'?'input':'change',()=>renderMaps(d)));['matchSearch','matchMode','matchResult','matchSize'].forEach(id=>$('#'+id).addEventListener(id==='matchSearch'?'input':'change',()=>{matchPage=1;renderMatches(d)}));$('#weaponDir').onclick=e=>{const b=e.currentTarget,before=b.dataset.dir||'desc';b.dataset.dir=before==='desc'?'asc':'desc';b.textContent=b.dataset.dir==='desc'?'降序 ↓':'升序 ↑';renderWeapons(d)};$('#mapDir').onclick=e=>{const b=e.currentTarget,before=b.dataset.dir||'desc';b.dataset.dir=before==='desc'?'asc':'desc';b.textContent=b.dataset.dir==='desc'?'降序 ↓':'升序 ↑';renderMaps(d)};renderWeapons(d);renderMaps(d);renderMatches(d);document.querySelectorAll('.tabBtn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));setTab(location.hash.replace('#','')||'summary');
}).catch(e=>{$('#app').innerHTML=`<div class="card empty"><b>CS2 数据读取失败</b><br><br>${esc(e.message||e)}</div>`})
</script>
</body>
